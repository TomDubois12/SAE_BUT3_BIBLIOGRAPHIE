        <script type="text/javascript">

              // initialize global variables.
              var edges;
              var nodes;
              var allNodes;
              var allEdges;
              var nodeColors;
              var originalNodes;
              var network;

              var options, data;

              // This method is responsible for drawing the graph, returns the drawn network
              function drawGraph() {
                  var container = document.getElementById('mynetwork');

                  

                  // parsing and collecting nodes and edges from the python
                  nodes = new vis.DataSet([{"abstract": "The singularity index \u03b1 of the asymmetric C(1s) x\u2010ray photoelectron spectrum (XPS) of vitreous carbon is determined to be 0.19\u00b10.01, independent of the interlayer separation of the graphitic layers. This result is interpreted within the framework of the many\u2010electron theory; two mechanisms are suggested: (1) the modulation of the two\u2010dimensional graphite band structures by the random interlayer perturbation, and (2) the excitonic screening. By assigning the value \u03b1=0.19 to be characteristic of carbon atoms associated with polynuclear aromatic rings, we show that the fraction of carbon in these rings in coal can be determined by the asymmetry of the C(1s) XPS line.", "author": "T. Cheung", "color": "blue", "doi": "10.1063/1.330025", "id": "10.1063/1.330025", "isOrigin": true, "label": "T. Cheung 1982", "nb_citations": 67, "primaryNode": false, "shape": "dot", "size": 37, "title": "X\u2010ray photoemission of carbon: Lineshape analysis and application to studies of coals", "url": "https://www.semanticscholar.org/paper/d4c4c3f3af3fa0c693f93d9893a2fa62805f8459", "year": 1982}, {"abstract": "Aper\u00e7u indisponible", "author": "G. Wertheim, P. V. Attekum, S. Basu", "color": "blue", "doi": "10.1016/0038-1098(80)91089-3", "id": "10.1016/0038-1098(80)91089-3", "isOrigin": true, "label": "G. Wertheim 1980", "nb_citations": 167, "primaryNode": false, "shape": "dot", "size": 98, "title": "Electronic structure of lithium graphite", "url": "https://www.semanticscholar.org/paper/933f937a4001279d0a07db77dfb805bb5ef6d7d2", "year": 1980}, {"abstract": "Aper\u00e7u indisponible", "author": "P. Citrin, G. Wertheim, Y. Baer", "color": "red", "doi": "10.1103/physrevb.16.4256", "id": "10.1103/physrevb.16.4256", "isOrigin": true, "label": "P. Citrin 1977", "nb_citations": 172, "primaryNode": true, "shape": "dot", "size": 100.0, "title": "Many-body processes in x-ray photoemission line shapes from Li, Na, Mg, and Al metals", "url": "https://www.semanticscholar.org/paper/0d4bb95948e76544d4b74180fffeebb0bb0e9836", "year": 1977}, {"abstract": "Aper\u00e7u indisponible", "author": "P. Citrin, G. Wertheim, Y. Baer", "color": "blue", "doi": "10.1103/physrevlett.35.885", "id": "10.1103/physrevlett.35.885", "isOrigin": true, "label": "P. Citrin 1975", "nb_citations": 53, "primaryNode": false, "shape": "dot", "size": 20.0, "title": "Many-Electron Effects in Core-Level X-Ray and Electron Spectroscopies from Na, Mg, and Al", "url": "https://www.semanticscholar.org/paper/dbd59ed5268c6bded38e7ebfd7b897070a09d144", "year": 1975}]);
                  edges = new vis.DataSet([{"arrows": "to", "color": "#f85a16", "from": "10.1063/1.330025", "to": "10.1016/0038-1098(80)91089-3", "width": 1}]);

                  nodeColors = {};
                  allNodes = nodes.get({ returnType: "Object" });
                  for (nodeId in allNodes) {
                    nodeColors[nodeId] = allNodes[nodeId].color;
                  }
                  allEdges = edges.get({ returnType: "Object" });
                  // adding nodes and edges to the graph
                  data = {nodes: nodes, edges: edges};

                  var options = {
    "configure": {
        "enabled": false
    },
    "edges": {
        "color": {
            "inherit": true
        },
        "smooth": {
            "enabled": true,
            "type": "dynamic"
        }
    },
    "interaction": {
        "dragNodes": true,
        "hideEdgesOnDrag": false,
        "hideNodesOnDrag": false
    },
    "physics": {
        "enabled": true,
        "stabilization": {
            "enabled": true,
            "fit": true,
            "iterations": 1000,
            "onlyDynamicEdges": false,
            "updateInterval": 50
        }
    }
};

                  


                  

                  network = new vis.Network(container, data, options);

                  

                  

                  


                  

                  return network;

              }
              drawGraph();
        </script>
