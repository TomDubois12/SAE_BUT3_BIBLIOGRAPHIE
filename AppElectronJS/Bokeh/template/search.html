<html>
    <link rel="stylesheet" href="../css/search.css">
    <div class="logo">
        <img src="../img/logo.png" alt="logo de l'application" class="logo">
    </div>
    <div class="text">
        <p>Explorez vos propres données sous forme de graphique !</p>
        <p>Pour commencer, entrez votre première recherche à partir d'un nom d'auteur ou d'un mot clé</p>
    </div>
    <nav class="navbar">
        <input class="input" type="search" id="site-search" name="q" minlength="4"
            placeholder="Entrez votre recherche" 
        />
        <button onclick="desactiverBouton('auteur', 'sujet')" id="auteur" class="active">Par auteur</button>
        <button onclick="desactiverBouton('sujet', 'auteur')" id="sujet">Par sujet</button>
        <button id="search-btn">Rechercher</button>
    </nav>

    <div id="result"></div>
    <script>
        document.getElementById('search-btn').addEventListener('click', async () => {
            const query = document.getElementById('site-search').value; // Récupère le contenu de la barre de recherche
            const param2 = document.getElementById('auteur').disabled ? "True" : "False";
            const output = await window.api.callFunctionSearch([query,param2]);  // Assurez-vous que l'appel utilise 'callFunctionSearch'
        });
    </script> 
    <script>
        // Fonction pour désactiver un bouton et activer l'autre
        function desactiverBouton(idBoutonADesactiver, idBoutonAActiver) {
            const boutonADesactiver = document.getElementById(idBoutonADesactiver);
            const boutonAActiver = document.getElementById(idBoutonAActiver);

            // Désactiver le bouton sélectionné
            if (boutonADesactiver) {
                boutonADesactiver.disabled = true;
                boutonADesactiver.style.backgroundColor = "white"; // Indique visuellement qu'il est désactivé
                boutonADesactiver.style.color = "#166F7A"; // Indique visuellement qu'il est désactivé
            }

            // Activer l'autre bouton
            if (boutonAActiver) {
                boutonAActiver.disabled = false;
                boutonAActiver.style.backgroundColor = "#166F7A"; // Indique visuellement qu'il est actif
                boutonAActiver.style.color = "white"; // Indique visuellement qu'il est actif
            }
        }

        // Fonction pour afficher le résultat
        function afficherResultat() {
            let filtre = "";
            if(document.getElementById('auteur').disabled == true){
                filtre = "sujets";
            }
            else{
                filtre = "auteurs";
            }
            const inputValue = document.getElementById('site-search').value;
            document.getElementById('result').innerHTML = "Résultat sur les " + filtre + " : " + inputValue;
        }

        // Écouter le clic sur le bouton "Rechercher"
        document.getElementById('search-btn').addEventListener('click', afficherResultat);

        // Écouter la touche "Entrée" dans l'input
        document.getElementById('site-search').addEventListener('keypress', function(event) {
            if (event.key === "Enter") {
                event.preventDefault(); // Empêche la soumission du formulaire si nécessaire
                afficherResultat();
            }
        });

        // Activer le bouton "Par auteur" par défaut
        window.onload = function() {
            desactiverBouton('sujet', 'auteur'); // Appelle la fonction pour désactiver le bouton "sujet"
        };
    </script>
</html>
