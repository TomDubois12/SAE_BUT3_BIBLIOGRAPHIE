<!DOCTYPE html>
<html lang="fr">
<head>
    <style>
        .generated-div {
            background-color: lightgray;
            padding: 10px;
            margin-top: 10px;
            border: 1px solid black;
        }
    </style>
</head>

<body>

    <div id="result"></div>

    <script>
        function handleClick(idNode) {
            const className = `generated-div-${idNode}`;
            const existingElements = document.getElementsByClassName(className);
    
            if (existingElements.length > 0) {
                // Supprime le premier élément de la collection
                existingElements[0].remove();
                console.log(`L'élément avec la classe ${className} a été supprimé.`);
            } else {
                // Crée un nouvel élément <aside>
                const aside = document.createElement("aside");
                
                // Ajoute du contenu au aside
                aside.textContent = `Ceci est un nouvel aside pour ${idNode}`;
                aside.classList.add(className); // Ajoute la classe pour le style
    
                // Ajoute l'aside dans le DOM
                document.body.appendChild(aside);
                console.log(`Un nouvel aside a été créé pour ${idNode}.`);
            }
        }
    
        const valeurs = [
            {
                "Key": "W5RYTYI6",
                "Item Type": "journalArticle",
                "Publication Year": "1996",
                "Author": "Díaz, Javier; Paolicelli, Guido; Ferrer, Salvador; Comin, Fabio",
                "Title": "Separation of the ${\\mathit{sp}}^{3}$ and ${\\mathit{sp}}^{2}$ components in the C1s photoemission spectra of amorphous carbon films",
                "Publication Title": "Physical Review B",
                "DOI": "10.1103/PhysRevB.54.8064",
                "Url": "https://link.aps.org/doi/10.1103/PhysRevB.54.8064",
                "Abstract Note": "Two different types of amorphous carbon films were deposited on Si substrates...",
            },
            {
                "Key": "IBTRRNBT",
                "Item Type": "journalArticle",
                "Publication Year": "1979",
                "Author": "van Attekum, P. M. Th. M.; Wertheim, G. K.",
                "Title": "Excitonic Effects in Core-Hole Screening",
                "Publication Title": "Physical Review Letters",
                "DOI": "10.1103/PhysRevLett.43.1896",
                "Url": "https://link.aps.org/doi/10.1103/PhysRevLett.43.1896",
                "Abstract Note": "It is shown that the C 1s core-electron line shape of graphite in photoemission...",
            }
        ];
    
        for (let i = 0; i < valeurs.length; i++) {
            const bouton = document.createElement("button");
            bouton.innerHTML = valeurs[i].Key;
            bouton.id = "node" + i;
            bouton.className = "node";
            bouton.addEventListener("click", () => handleClick(bouton.id)); // Use arrow function to pass id
            document.getElementById("result").appendChild(bouton);
        }
    
    </script>
</body>
</html>
