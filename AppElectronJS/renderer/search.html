<html>
    <head>
        <meta charset="UTF-8">
        <meta http-equiv="Content-Security-Policy" content="script-src 'self' 'unsafe-inline';" />
        <link rel="stylesheet" href="CSS/accueil.css">
    </head>
    <body>
        <div class="logo">
            <img src="images/logo.webp" alt="logo de l'application" class="logo">
        </div> 
        <div class="text">
            <p class="title">Explorez les articles connectés sous forme de graphe</p>
            <p class="textsearch">Pour commencer, saisissez un élement de recherche</p>
        </div>

        <nav class="navbar">
            <input class="input" type="search" id="site-search" name="q" minlength="1"
                placeholder="Indiquez un mot clé, un nom d’auteur"  
            />
            <select id="listBouton" onchange="changerChoix(this)">
                <option class="auteur" value="auteur">Par auteur</option>
                <option class="sujet" value="sujet">Par sujet</option>
                <option class="titre" value="titre">Par titre</option>
            </select>
            <button id="search-btn">Rechercher</button>
        </nav>
        
        <div class="textIcons">
            <p>Dans cette barre de recherche, vous pouvez essayer avec :</p>
        </div>
        <ul class="groupIcons">
            <li>
                <div>
                    <img src="images/Key_alt.png" alt="Un T" class="key">
                    <div class="text-auteur">
                        <p>
                            Un ou plusieurs mots clés
                        </p>
                    </div>
                </div>
            </li>
            <li>
                <div>
                    <img src="images/File_alt.png" alt="Un fichier" class="file">
                    <div class="text-auteur">
                        <p>
                            Un titre d'article
                        </p>
                    </div>
                </div>
            </li>
            <li>
                <div>
                    <img src="images/User_alt.png" alt="Un utilisateur" class="user">
                    <div class="text-auteur">
                        <p>
                            Un nom d'auteur
                        </p>
                    </div>
                </div>
            </li>
        </ul>
    
        <div id="result"></div>
        <script src="js/renderer.js"></script>
    
    </body>
</html>
