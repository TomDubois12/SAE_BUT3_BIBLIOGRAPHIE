<html>
    <head>
        <meta charset="UTF-8">
        <meta http-equiv="Content-Security-Policy" content="script-src 'self' 'unsafe-inline';" />
        <link rel="stylesheet" type="text/css" href="CSS/themeDarkLight.css">
        <link rel="stylesheet" href="CSS/search.css">

    </head>
    <body>
        <div class="logo">
            <img src="images/logo.png" alt="logo de l'application" class="logo">
        </div>
        <div class="text">
            <p>Explorez vos propres données sous forme de graphique !</p>
            <p>Pour commencer, entrez votre première recherche à partir d'un nom d'auteur ou d'un mot clé</p>
        </div>

        <nav class="navbar">
            <input class="input" type="search" id="site-search" name="q" minlength="4"
                placeholder="Entrez votre recherche" 
            />
            <button onclick="desactiverBouton('auteur', 'sujet')" id="auteur" class="active">Par auteur</button>
            <button onclick="desactiverBouton('sujet', 'auteur')" id="sujet">Par sujet</button>
            <button id="search-btn">Rechercher</button>
        </nav>
    
        <div id="result"></div>
    <script src="js/renderer.js"></script>
    </body>
</html>
