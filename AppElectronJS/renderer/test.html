                  // parsing and collecting nodes and edges from the python
                  nodes = new vis.DataSet([{"abstract": "The results of studies of physical properties such as density, electrical and thermal conductivity, bending strength and elastic modulus for glassy carbon are presented as a function of its heattreatment temperature. The diameters of aromatic planes as estimated from X-ray diffraction patterns are included. It is found that glassy carbon is resistant to thermal shock and to oxidizing agents, and is useful in many fields of industry. Its various applications are briefly summarized.", "author": "S. Yamada, H. Sato, T. Ishii", "citations": "https://www.semanticscholar.org/paper/6330fe85679d76a180ec894ccba30fe1d8a4ae78", "color": "red", "doi": "10.1016/0008-6223(64)90039-9", "id": "10.1016/0008-6223(64)90039-9", "infos": "{\"Key\": \"JXH76KA2\", \"Item Type\": \"journalArticle\", \"Publication Year\": 1964.0}", "isOrigin": true, "label": "S. Yamada 1964", "nb_citations": 40, "shape": "dot", "size": 20, "title": "Eigenschaften und Verwendung von glasartigem Kohlenstoff", "year": 1964}, {"abstract": "In order to accommodate an increasing demand for glassy carbon products with tailored characteristics, one has to understand the origin of their structure-related properties. In this work, through the use of high-resolution transmission electron microscopy, Raman spectroscopy, and electron energy loss spectroscopy it has been demonstrated that the structure of glassy carbon at different stages of the carbonization process resembles the curvature observed in fragments of nanotubes, fullerenes, or nanoonions. The measured nanoindentation hardness and reduced Young\u2019s modulus change as a function of the pyrolysis temperature from the range of 600\u20132500 \u00b0C and reach maximum values for carbon pyrolyzed at around 1000 \u00b0C. Essentially, the highest values of the mechanical parameters for glassy carbon manufactured at that temperature can be related to the greatest amount of non-planar sp 2 -hybridized carbon atoms involved in the formation of curved graphene-like layers. Such complex labyrinth-like structure with sp 2 -type bonding would be rigid and hard to break that explains the glassy carbon high strength and hardness.", "author": "K. Jurkiewicz, K. Jurkiewicz, M. Pawlyta, Dorota Zygad\u0142o, Dorota Zygad\u0142o, D. Chrobak, D. Chrobak, S. Duber, R. Wrzalik, R. Wrzalik, A. Ratuszna, A. Ratuszna, A. Burian, A. Burian", "citations": "https://www.semanticscholar.org/paper/e5e7cd06acecd446ebc2e244d4b05db21fed8e82", "color": "red", "doi": "10.1007/s10853-017-1753-7", "id": "10.1007/s10853-017-1753-7", "infos": "{\"Key\": \"QE6QTHM5\", \"Item Type\": \"journalArticle\", \"Publication Year\": 2018.0}", "isOrigin": true, "label": "K. Jurkiewicz 2018", "nb_citations": 118, "shape": "dot", "size": 23, "title": "Evolution of glassy carbon under heat treatment: correlation structure\u2013mechanical properties", "year": 2018}, {"abstract": "Interest in two-dimensional, sheet-like or flake-like carbon forms has expanded beyond monolayer graphene to include related materials with significant variations in layer number, lateral dimension, rotational faulting, and chemical modification. Describing this family of \u201cgraphene materials\u201d has been causing confusion in the Carbon journal and in the scientific literature as a whole. The international editorial team for Carbon believes that the time has come for a discussion on a rational naming system for two-dimensional carbon forms. We propose here a first nomenclature for two-dimensional carbons that could guide authors toward a more precise description of their subject materials, and could allow the field to move forward with a higher degree of common understanding.", "author": "A. Bianco, Hui\u2010Ming Cheng, T. Enoki, Y. Gogotsi, R. Hurt, N. Koratkar, T. Kyotani, M. Monthioux, C. Park, J. Tasc\u00f3n, Jin Zhang", "citations": "https://www.semanticscholar.org/paper/c3c5a00d854b908a4776b9b99d0f8583bc36949e", "color": "red", "doi": "10.1016/J.CARBON.2013.08.038", "id": "10.1016/j.carbon.2013.08.038", "infos": "{\"Key\": \"UBXIGCCI\", \"Item Type\": \"journalArticle\", \"Publication Year\": 2013.0}", "isOrigin": true, "label": "A. Bianco 2013", "nb_citations": 867, "shape": "dot", "size": 45, "title": "All in the graphene family - A recommended nomenclature for two-dimensional carbon materials", "year": 2013}, {"abstract": "The recent discovery of graphene has sparked much interest, thus far focused on the peculiar electronic structure of this material, in which charge carriers mimic massless relativistic particles(1-3). However, the physical structure of graphene - a single layer of carbon atoms densely packed in a honeycomb crystal lattice - is also puzzling. On the one hand, graphene appears to be a strictly two-dimensional material, exhibiting such a high crystal quality that electrons can travel submicrometre distances without scattering. On the other hand, perfect two-dimensional crystals cannot exist in the free state, according to both theory and experiment(4-9). This incompatibility can be avoided by arguing that all the graphene structures studied so far were an integral part of larger three-dimensional structures, either supported by a bulk substrate or embedded in a three-dimensional matrix(1-3,9-12). Here we report on individual graphene sheets freely suspended on a microfabricated scaffold in vacuum or air. These membranes are only one atom thick, yet they still display long-range crystalline order. However, our studies by transmission electron microscopy also reveal that these suspended graphene sheets are not perfectly flat: they exhibit intrinsic microscopic roughening such that the surface normal varies by several degrees and out-of-plane deformations reach 1 nm. The atomically thin single-crystal membranes offer ample scope for fundamental research and new technologies, whereas the observed corrugations in the third dimension may provide subtle reasons for the stability of two-dimensional crystals(13-15).", "author": "Jannik C. Meyer, A. Geim, M. Katsnelson, K. Novoselov, Tim Booth, S. Roth", "citations": "https://www.semanticscholar.org/paper/200c8711fed74965e3e944c635c6d4f4e88dcaf5", "color": "blue", "doi": "10.1038/nature05545", "id": "10.1038/nature05545", "infos": "{\"Key\": \"QHFGD5P7\", \"Item Type\": \"journalArticle\", \"Publication Year\": 2007.0}", "isOrigin": false, "label": "Jannik C. Meyer 2007", "nb_citations": 4506, "shape": "dot", "size": 100, "title": "The structure of suspended graphene sheets", "year": 2007}, {"abstract": "Raman spectra, phenanthrenequinone adsorption, differential capacitance and scanning electron micrographs on fractured and polished glassy carbon (GC) surfaces were monitored before and after pulsed laser irradiation of varying power density. At power densities below 30 MW / cm2, the Raman spectra, \u0393PQ, Cdlo and SEM appearance of polished surfaces changed slightly with laser activation. However, the Raman spectra of fractured GC indicated increased disorder during laser irradiation. After vigorous laser treatment, the Raman spectrum became similar to that of the polished surface, but \u0393 and Cdlo on the fractured surface did not change greatly at power densities below 30 MW / cm2. At higher power densities, both polished and fractured surfaces showed significantly higher \u0393PQ and Cdlo, and the SEMs showed evidence of local melting. After 70 MW / cm2 laser treatment, the fractured and polished surfaces were quite similar. The results support a mechanism based on thermomechanical shock below about 30 MW / cm2 and local melting above this threshold.", "author": "N. Pontikos, R. McCreery", "citations": "https://www.semanticscholar.org/paper/4064a11a6c84a04939ce16f6f4c35eb1f180caf2", "color": "blue", "doi": "10.1016/0022-0728(92)80048-9", "id": "10.1016/0022-0728(92)80048-9", "infos": "{\"Key\": \"S38UQ8CL\", \"Item Type\": \"journalArticle\", \"Publication Year\": 1992.0}", "isOrigin": false, "label": "N. Pontikos 1992", "nb_citations": 36, "shape": "dot", "size": 20, "title": "Microstructural and morphological changes induced in glassy carbon electrodes by laser irradiation", "year": 1992}, {"abstract": "We have used Raman spectroscopy to characterize a variety of carbon-containing particulate matter, including samples collected in ambient urban atmospheres. Based on the Raman spectra of known, commercial particles, we derive a simple empirical model that reflects their microchemistry and microphysics. This model gives information on the crystal size and morphology of the graphitic component, which correlates with the known characteristics of the commercial samples. We derive similar information about the graphitic component of the ambient particles, and suggest that this method might be used to characterize ambient particles systematically in the future.", "author": "S. Sze, N. Siddique, J. Sloan, R. Escribano", "citations": "https://www.semanticscholar.org/paper/dc6b270a4d0e8149f527488ca4a03884e25484b1", "color": "red", "doi": "10.1016/S1352-2310(00)00325-3", "id": "10.1016/S1352-2310(00)00325-3", "infos": "{\"Key\": \"U649GPQC\", \"Item Type\": \"journalArticle\", \"Publication Year\": 2001.0}", "isOrigin": true, "label": "S. Sze 2001", "nb_citations": 195, "shape": "dot", "size": 26, "title": "Raman spectroscopic characterization of carbonaceous aerosols", "year": 2001}, {"abstract": "Experimental conditions and mathematical fitting procedures for the collection and analysis of Raman spectra of soot and related carbonaceous materials have been investigated and optimised with a Raman microscope system operated at three different laser excitation wavelengths (514, 633, and 780 nm). Several band combinations for spectral analysis have been tested, and a combination of four Lorentzian-shaped bands (G, D1, D2, D4) at about 1580, 1350, 1620, and 1200 cm(-1), respectively, with a Gaussian-shaped band (W) at similar to 1500 cm(-1) was best suited for the first-order spectra. The second-order spectra were best fitted with Lorentzian-shaped bands at about 2450, 2700, 2900, and 3100 cm(-1). Spectral parameters (band positions, full widths at half maximum, and intensity ratios) are reported for several types of industrial carbon black (Degussa Printex, Cabot Monarch), diesel soot (particulate matter from modern heavy duty vehicle and passenger car engine exhaust, NIST SRM1650), spark-discharge soot (Palas GfG100), and graphite. Several parameters, in particular the width of the D1 band at similar to 1350 cm(-1), provide structural information and allow to discriminate the sample materials, but the characterisation and distinction of different types of soot is limited by the experimental reproducibility of the spectra and the statistical uncertainties of curve fitting. The results are discussed and compared with X-ray diffraction measurements and earlier Raman spectroscopic studies of comparable materials, where different measurement and fitting procedures had been applied.", "author": "A. Sadezky, H. Muckenhuber, H. Grothe, R. Niessner, U. P\u00f6schl", "citations": "https://www.semanticscholar.org/paper/42b700f94161dacc7abf48c4e0bb4e74053d7684", "color": "blue", "doi": "10.1016/J.CARBON.2005.02.018", "id": "10.1016/j.carbon.2005.02.018", "infos": "{\"Key\": \"9TD44Z57\", \"Item Type\": \"journalArticle\", \"Publication Year\": 2005.0}", "isOrigin": false, "label": "A. Sadezky 2005", "nb_citations": 3580, "shape": "dot", "size": 89, "title": "Raman microspectroscopy of soot and related carbonaceous materials: Spectral analysis and structural information", "year": 2005}, {"abstract": "The use of X-ray photoelectron spectroscopy for the study of carbon fibre surfaces is first discussed in general terms, and then with emphasis on untreated fibre samples heated to 1400\u00b0C in vacuo. Preliminary theoretical calculations show that a graphitic environment does have some modifying effect upon expected C 1s binding energy shifts for surface groups when compared with those obtained from other systems. Differences in surface chemistry cause only very small changes in the C 1s region, but these changes are shown to be detectable when appropriate data and data analysis techniques are used. Heat treatment causes loss of some oxide groups from the surface of the fibres and some nitrogen from the bulk of the fibres, although the resulting fibres do contain some CO groupings absent in the original fibres.", "author": "A. Proctor, P. Sherwood", "citations": "https://www.semanticscholar.org/paper/d53b8da1ac85e3ec973d72b12f157a6fe7999686", "color": "red", "doi": "10.1016/0368-2048(82)85051-2", "id": "10.1016/0368-2048(82)85051-2", "infos": "{\"Key\": \"Y8AG2ZSY\", \"Item Type\": \"journalArticle\", \"Publication Year\": 1982.0}", "isOrigin": true, "label": "A. Proctor 1982", "nb_citations": 122, "shape": "dot", "size": 24, "title": "X-ray photoelectron spectroscopic studies of carbon fibre surfaces. I. carbon fibre spectra and the effects of heat treatment", "year": 1982}, {"abstract": "X-ray photoelectron spectroscopy (XPS) has been used to investigate the surface characteristics of two carbon fibers and determine the role of surface treatment in improving the properties of a carbon fiber composite. Carbon and oxygen were the major elements observed on the surface of the carbon fiber samples. Small amounts of lightly oxidized nitrogen amounting to about 3at.% were detected on the surface of thermally oxidized carbon fiber in a gas mixture of O2/(N2+O2). Graphitic carbon was the major carbon functional component on the surface of carbon fiber samples but other functional forms of carbon were also present such as C\u2013O, C\ue605O, and O\u2013C\ue605O. The biggest differences in the surface chemistry between the carbon fibers with and without surface treatment was in the carbonyl group (C\ue605O) content. Thermal oxidation processing in a gas mixture of O2/(N2+O2) can be employed to increase the carbonyl functional group which is the main contributor in improving the interlaminar shear strengths of carbon fiber composite materials.", "author": "Wondoo Lee, Jin-Hyok Lee, P. J. Reucroft", "citations": "https://www.semanticscholar.org/paper/4daa23e195373b63cbe17aa8cfb2a7f1b135f1c9", "color": "blue", "doi": "10.1016/S0169-4332(00)00558-4", "id": "10.1016/S0169-4332(00)00558-4", "infos": "{\"Key\": \"E9E6UM95\", \"Item Type\": \"journalArticle\", \"Publication Year\": 2001.0}", "isOrigin": false, "label": "Wondoo Lee 2001", "nb_citations": 173, "shape": "dot", "size": 25, "title": "XPS study of carbon fiber surfaces treated by thermal oxidation in a gas mixture of O2/(O2+N2)", "year": 2001}, {"abstract": "calculations of the phonon density of states, Al-Jishi and Dresselha~s~~~~~ have attributed the second-order bands", "author": "Yan. Wang, D. Alsmeyer, R. McCreery", "citations": "https://www.semanticscholar.org/paper/6cec800cf9222c4a309547e87a45dbba9c32e8db", "color": "red", "doi": "10.1021/CM00011A018", "id": "10.1021/cm00011a018", "infos": "{\"Key\": \"WR77HG7I\", \"Item Type\": \"journalArticle\", \"Publication Year\": 1990.0}", "isOrigin": true, "label": "Yan. Wang 1990", "nb_citations": 1469, "shape": "dot", "size": 58, "title": "Raman Spectroscopy of Carbon Materials: Structural Basis of Observed Spectra", "year": 1990}, {"abstract": "The Raman spectrum of glassy carbon has been measured. Two broad lines are observed at 1340 and 1590 cm\u22121. These results are consistent with the turbostratic structure, which has been suggested for glassy carbon, with a particle size La of approximately 30 A.", "author": "M. Nathan, John E. Smith, K. Tu", "citations": "https://www.semanticscholar.org/paper/92aca12e2a778b2244684f9f85d0d9c908bf7d7b", "color": "red", "doi": "10.1063/1.1663599", "id": "10.1063/1.1663599", "infos": "{\"Key\": \"9RKW8G7G\", \"Item Type\": \"journalArticle\", \"Publication Year\": 1974.0}", "isOrigin": true, "label": "M. Nathan 1974", "nb_citations": 145, "shape": "dot", "size": 24, "title": "Raman spectra of glassy carbon", "year": 1974}, {"abstract": "We report a novel phase of carbon possessing a monoclinic C2/m structure (8 atoms/cell) identified using an ab initio evolutionary structural search. This polymorph, which we call M-carbon, is related to the (2x1) reconstruction of the (111) surface of diamond and can also be viewed as a distorted (through sliding and buckling of the sheets) form of graphite. It is stable over cold-compressed graphite above 13.4 GPa. The simulated x-ray diffraction pattern and near K-edge spectroscopy are in satisfactory agreement with the experimental data [W. L. Mao, Science 302, 425 (2003)10.1126/science.1089713] on overcompressed graphite. The hardness and bulk modulus of this new carbon polymorph are calculated to be 83.1 and 431.2 GPa, respectively, which are comparable to those of diamond.", "author": "Quan Li, Yanming Ma, A. Oganov, Hongbo Wang, Hui Wang, Ying Xu, T. Cui, H. Mao, G. Zou", "citations": "https://www.semanticscholar.org/paper/d6b981b8ae7e13215629acdb7c8830b33cc6c625", "color": "red", "doi": "10.1103/PHYSREVLETT.102.175506", "id": "10.1103/PhysRevLett.102.175506", "infos": "{\"Key\": \"56TBVTMB\", \"Item Type\": \"journalArticle\", \"Publication Year\": 2009.0}", "isOrigin": true, "label": "Quan Li 2009", "nb_citations": 464, "shape": "dot", "size": 35, "title": "Superhard monoclinic polymorph of carbon.", "year": 2009}, {"abstract": ": Through a systematic structural search we found an allotrope of carbon with Cmmm symmetry which we predict to be more stable than graphite for pressures above 10 GPa. This material, which we refer to as Z-carbon, is formed by pure sp(3) bonds and it provides an explanation to several features in experimental x-ray diffraction and Raman spectra of graphite under pressure. The transition from graphite to Z-carbon can occur through simple sliding and buckling of graphene sheets. Our calculations predict that Z-carbon is a transparent wide band-gap semiconductor with a hardness comparable to diamond.", "author": "M. Amsler, J. A. Flores-Livas, L. Lehtovaara, F. Balima, S. Ghasemi, D. Machon, S. Pailh\u00e8s, Alexander Willand, D. Caliste, S. Botti, A. Miguel, S. Goedecker, M. Marques", "citations": "https://www.semanticscholar.org/paper/859900aae66b40b3ec32af0580955f7261961753", "color": "blue", "doi": "10.1103/PHYSREVLETT.108.065501", "id": "10.1103/PhysRevLett.108.065501", "infos": "{\"Key\": \"RVIAUN5U\", \"Item Type\": \"journalArticle\", \"Publication Year\": 2012.0}", "isOrigin": false, "label": "M. Amsler 2012", "nb_citations": 216, "shape": "dot", "size": 27, "title": "Crystal Structure of Cold Compressed Graphite", "year": 2012}, {"abstract": "The microscopic structure of carbonaceous surfaces exposed to natural organic matter (NOM) under aqueous conditions has been explored using atomic force microscopy (AFM). Dismal Swamp Water was used as the NOM source, while highly ordered pyrolytic graphite (HOPG) served as a surrogate for the graphene sheets that characterize the surface of many carbonaceous materials in aquatic environments. Under acidic conditions, the HOPG surface was covered with a densely packed monolayer of NOM molecules. In some cases, aggregates of well-defined, individual NOM molecules were observed that exhibited a degree of registry with respect to the HOPG substrate. This suggests that adsorbate-substrate interactions play a role in moderating the structure of the adsorbate layer. As the pH increased, the concentration of adsorbed NOM decreased systematically because of increasingly repulsive interactions between adsorbates. Increasing the ionic strength produced a modest increase in the concentration of adsorbed NOM. Ca2+ ions exerted a more pronounced influence on both the surface coverage of adsorbed NOM molecules and the size of individual adsorbates because of the effects of intermolecular complexation. In contrast to the spherical structures observed by AFM under aqueous conditions, adsorbed NOM formed a mixture of \"ringlike\" assemblies and larger aggregates upon drying.", "author": "J. Gorham, J. Wnuk, M. Shin, Howard Fairbrother", "citations": "https://www.semanticscholar.org/paper/bcfe75001f2fd295c4b035749f41c6f042bfe9bb", "color": "red", "doi": "10.1021/ES061793D", "id": "10.1021/es061793d", "infos": "{\"Key\": \"9MT2FGXT\", \"Item Type\": \"journalArticle\", \"Publication Year\": 2007.0}", "isOrigin": true, "label": "J. Gorham 2007", "nb_citations": 30, "shape": "dot", "size": 20, "title": "Adsorption of natural organic matter onto carbonaceous surfaces: atomic force microscopy study.", "year": 2007}, {"abstract": "The effects of surface dimensions and topology on the adsorption of water on a graphite surface at 298 K were investigated using the grand canonical Monte Carlo (GCMC) simulation. Regarding the surface topology, we specifically considered the functional group and its position on the surface. The hydroxyl group (OH) is used as a model for the functional group. For describing the interaction of water, we used the potential model proposed by Muller et al., and the simulated isotherms of water in slit pores are found to depend on the position and concentration of the functional group. The onset of adsorption shifts to lower pressure when the concentration of functional group increases or when the functional group is positioned at the center of the graphene surface. The configuration of a group of functional groups also affects the adsorption isotherm. In all cases investigated, we have found that the hysteresis loop always exists, and the loop size depends on the concentration of the functional group and its position. Finally, we tested the molecular model of water adsorption on a functional graphite pore against the experimental data of a commercial activated carbon. The agreement is found to be satisfactory when the model porous solid is composed of pores having width in the range between 10 and 20 A and functional groups positioned at the center of the graphitic wall.", "author": "A. Wongkoblap, D. Do", "citations": "https://www.semanticscholar.org/paper/f66f5677d874ab86ba8ec1794827c802f93130a6", "color": "blue", "doi": "10.1021/JP0747297", "id": "10.1021/jp0747297", "infos": "{\"Key\": \"NST92PVA\", \"Item Type\": \"journalArticle\", \"Publication Year\": 2007.0}", "isOrigin": false, "label": "A. Wongkoblap 2007", "nb_citations": 38, "shape": "dot", "size": 20, "title": "Adsorption of water in finite length carbon slit pore: comparison between computer simulation and experiment.", "year": 2007}, {"abstract": "Single-walled nanotubes (SWNTs) industrially produced and multiwalled nanotubes (MWNTs) we produced by catalysis were investigated by transmission electron microscopy (TEM) and Fourier transform infrared (FTIR) spectroscopy. The observed spectral features, that is the peak position, intensity, and bandwidth, were related to some structural properties of the investigated samples. In such a way, information on the vibrational modes, nanotube diameters, and purity degree of the samples was obtained. The findings of the FTIR investigation are in perfect agreement with the TEM evidence.", "author": "C. Branca, F. Frusteri, V. Magaz\u00f9, A. Mangione", "citations": "https://www.semanticscholar.org/paper/fcc101dfb177592baf30cb9d7fb2b1d6fe9adabe", "color": "red", "doi": "10.1021/JP0372183", "id": "10.1021/jp0372183", "infos": "{\"Key\": \"INCW39BX\", \"Item Type\": \"journalArticle\", \"Publication Year\": 2004.0}", "isOrigin": true, "label": "C. Branca 2004", "nb_citations": 129, "shape": "dot", "size": 24, "title": "Characterization of Carbon Nanotubes by TEM and Infrared Spectroscopy", "year": 2004}, {"abstract": "Department of Materials Science, University of Patras, 26504 Rio Patras, Greece, Theoretical and Physical Chemistry Institute, National Hellenic Research Foundation, 48 Vass. Constantinou Avenue, 116 35 Athens, Greece, Institut de Biolog
