                function drawGraph() {

                    // parsing and collecting nodes and edges from the python
                    nodes = new vis.DataSet([{ "abstract": "Interest in two-dimensional, sheet-like or flake-like carbon forms has expanded beyond monolayer graphene to include related materials with significant variations in layer number, lateral dimension, rotational faulting, and chemical modification. Describing this family of \u201cgraphene materials\u201d has been causing confusion in the Carbon journal and in the scientific literature as a whole. The international editorial team for Carbon believes that the time has come for a discussion on a rational naming system for two-dimensional carbon forms. We propose here a first nomenclature for two-dimensional carbons that could guide authors toward a more precise description of their subject materials, and could allow the field to move forward with a higher degree of common understanding.", "author": "A. Bianco, Hui\u2010Ming Cheng, T. Enoki, Y. Gogotsi, R. Hurt, N. Koratkar, T. Kyotani, M. Monthioux, C. Park, J. Tasc\u00f3n, Jin Zhang", "citations": "https://www.semanticscholar.org/paper/c3c5a00d854b908a4776b9b99d0f8583bc36949e", "color": "red", "doi": "10.1016/J.CARBON.2013.08.038", "id": "10.1016/j.carbon.2013.08.038", "infos": "{\"Key\": \"UBXIGCCI\", \"Item Type\": \"journalArticle\", \"Publication Year\": 2013.0}", "label": "A. Bianco 2013", "nb_citations": 868, "shape": "dot", "size": 48, "title": "All in the graphene family - A recommended nomenclature for two-dimensional carbon materials", "year": 2013 }, { "abstract": "The recent discovery of graphene has sparked much interest, thus far focused on the peculiar electronic structure of this material, in which charge carriers mimic massless relativistic particles(1-3). However, the physical structure of graphene - a single layer of carbon atoms densely packed in a honeycomb crystal lattice - is also puzzling. On the one hand, graphene appears to be a strictly two-dimensional material, exhibiting such a high crystal quality that electrons can travel submicrometre distances without scattering. On the other hand, perfect two-dimensional crystals cannot exist in the free state, according to both theory and experiment(4-9). This incompatibility can be avoided by arguing that all the graphene structures studied so far were an integral part of larger three-dimensional structures, either supported by a bulk substrate or embedded in a three-dimensional matrix(1-3,9-12). Here we report on individual graphene sheets freely suspended on a microfabricated scaffold in vacuum or air. These membranes are only one atom thick, yet they still display long-range crystalline order. However, our studies by transmission electron microscopy also reveal that these suspended graphene sheets are not perfectly flat: they exhibit intrinsic microscopic roughening such that the surface normal varies by several degrees and out-of-plane deformations reach 1 nm. The atomically thin single-crystal membranes offer ample scope for fundamental research and new technologies, whereas the observed corrugations in the third dimension may provide subtle reasons for the stability of two-dimensional crystals(13-15).", "author": "Jannik C. Meyer, A. Geim, M. Katsnelson, K. Novoselov, Tim Booth, S. Roth", "citations": "https://www.semanticscholar.org/paper/200c8711fed74965e3e944c635c6d4f4e88dcaf5", "color": "blue", "doi": "10.1038/nature05545", "id": "10.1038/nature05545", "infos": "{\"Key\": \"QHFGD5P7\", \"Item Type\": \"journalArticle\", \"Publication Year\": 2007.0}", "label": "Jannik C. Meyer 2007", "nb_citations": 4505, "shape": "dot", "size": 170, "title": "The structure of suspended graphene sheets", "year": 2007 }, { "abstract": "\u003cp\u003eSummary\u003cbr/\u003eCarbon is a unique and very versatile element which is capable of forming different architectures at the nanoscale. Over the last 20 years, new members of the carbon nanostructure family arose, and more are coming. This review provides a brief overview on carbon nanostructures ranging from C60 to graphene, passing through carbon nanotubes. It provides the reader with important definitions in carbon nanoscience and concentrates on novel one- and two-dimensional layered carbon (sp2 hybridized), including graphene and nanoribbons. This account presents the latest advances in their synthesis and characterization, and discusses new perspectives of tailoring their electronic, chemical, mechanical and magnetic properties based on defect control engineering. It is foreseen that some of the structures discussed in the review will have important applications in areas related to electronics, spintronics, composites, medicine and many others.\u003c/p\u003e", "author": "M. Terrones, A. Botello-M\u00e9ndez, J. Campos-Delgado, F. L\u00f3pez\u2010Ur\u00edas, Y. Vega-Cant\u00fa, F. Rodr\u00edguez-Macias, A. El\u00edas, E. Mu\u00f1oz-Sandoval, Abraham G. Cano-M\u00e1rquez, J. Charlier, H. Terrones", "citations": "https://www.semanticscholar.org/paper/f38a7c0910ba3a3afac797c02fef64a0d219f5af", "color": "blue", "doi": "10.1016/J.NANTOD.2010.06.010", "id": "10.1016/j.nantod.2010.06.010", "infos": "{\"Key\": \"ADMIET89\", \"Item Type\": \"journalArticle\", \"Publication Year\": 2010.0}", "label": "M. Terrones 2010", "nb_citations": 822, "shape": "dot", "size": 47, "title": "Graphene and graphite nanoribbons: Morphology, properties, synthesis, defects and applications", "year": 2010 }, { "abstract": "The transition from graphene to a fully disordered sp2 carbon material can be idealized by either cutting graphene into smaller and smaller pieces, or adding more and more point defects. In other words, from the dimensionality standpoint, defects in two-dimensional (2D) systems can be either one- (1D) or zero-dimensional (0D). From an application point of view, both in terms of bottom-up as well as top-down approaches, the discrimination between these two structural disorder in two-dimensional systems is urgently desired. In graphene, both types of defects produce changes in the Raman spectrum, but identifying separately the contribution from each defect-type has not yet been achieved. Here we show that a diagram can be built for disentangling contributions of point-like and line-like defects to the Raman spectra of graphene-related materials embracing, from the topology point of view, all possible structures from perfect to fully disordered sp2 bonded carbons. Two sets of graphene-related samples, produced by well-established protocols that generate either 0D or 1D defects in a controlled way, are analysed with our model and used to parameterize the limiting values of the phase space. We then discuss the limitations and apply our new methodology to analyse the structure of two-dimensional nanocarbons generated from renewable gas, used to produce inks and conducting coatings.", "author": "Luiz Gustavo Can\u00e7ado, Mateus Gomes da Silva, E. H. Martins Ferreira, F. Hof, Katerina Kampioti, Kai Huang, A. P\u00e9nicaud, Carlos Alberto Achete, R. Capaz, A. Jorio", "citations": "https://www.semanticscholar.org/paper/72ab286be29fab358cdaefce05abc1324c1aabe6", "color": "blue", "doi": "10.1088/2053-1583/aa5e77", "id": "10.1088/2053-1583/aa5e77", "infos": "{\"Key\": \"H9HESWFE\", \"Item Type\": \"journalArticle\", \"Publication Year\": 2017.0}", "label": "Luiz Gustavo Can\u00e7ado 2017", "nb_citations": 183, "shape": "dot", "size": 26, "title": "Disentangling contributions of point and line defects in the Raman spectra of graphene-related materials", "year": 2017 }, { "abstract": "This article reviews the basic theoretical aspects of graphene, a one-atom-thick allotrope of carbon, with unusual two-dimensional Dirac-like electronic excitations. The Dirac electrons can be controlled by application of external electric and magnetic fields, or by altering sample geometry and/or topology. The Dirac electrons behave in unusual ways in tunneling, confinement, and the integer quantum Hall effect. The electronic properties of graphene stacks are discussed and vary with stacking order and number of layers. Edge (surface) states in graphene depend on the edge termination (zigzag or armchair) and affect the physical properties of nanoribbons. Different types of disorder modify the Dirac equation leading to unusual spectroscopic and transport properties. The effects of electron-electron and electron-phonon interactions in single layer and multilayer graphene are also presented.", "author": "A. Neto, F. Guinea, N. Peres, K. Novoselov, A.K. Geim", "citations": "https://www.semanticscholar.org/paper/777b4f88dec264cf4a39d80c8f0124ba8a2621be", "color": "blue", "doi": "10.1103/RevModPhys.81.109", "id": "10.1103/RevModPhys.81.109", "infos": "{\"Key\": \"XHTTU722\", \"Item Type\": \"journalArticle\", \"Publication Year\": 2009.0}", "label": "A. Neto 2007", "nb_citations": 9999, "shape": "dot", "size": 353, "title": "The electronic properties of graphene", "year": 2007 }, { "abstract": "This review on graphene, a one-atom thick, two-dimensional sheet of carbon atoms, starts with a general description of the graphene electronic structure as well as a basic experimental toolkit for identifying and handling this material. Owing to the versatility of graphene properties and projected applications, several production techniques are summarized, ranging from the mechanical exfoliation of high-quality graphene to the direct growth on carbides or metal substrates and from the chemical routes using graphene oxide to the newly developed approach at the molecular level. The most promising and appealing properties of graphene are summarized from an exponentially growing literature, with a particular attention to matching production methods to characteristics and to applications. In particular, we report on the high carrier mobility value in suspended and annealed samples for electronic devices, on the thickness-dependent optical transparency and, in the mechanical section, on the high robustness and full integration of graphene in sensing device applications. Finally, we emphasize on the high potential of graphene not only as a post-silicon materials for CMOS device application but more ambitiously as a platform for post-CMOS molecular architecture in electronic information processing.", "author": "C. Soldano, A. Mahmood, E. Dujardin", "citations": "https://www.semanticscholar.org/paper/62f3f2fac39a5fab533b5911d2bed4fa9962d054", "color": "blue", "doi": "10.1016/j.carbon.2010.01.058", "id": "10.1016/j.carbon.2010.01.058", "infos": "{\"Key\": \"PMBKDWMC\", \"Item Type\": \"journalArticle\", \"Publication Year\": 2010.0}", "label": "C. Soldano 2010", "nb_citations": 1579, "shape": "dot", "size": 72, "title": "Production, properties and potential of graphene", "year": 2010 }, { "abstract": "We report a novel phase of carbon possessing a monoclinic C2/m structure (8 atoms/cell) identified using an ab initio evolutionary structural search. This polymorph, which we call M-carbon, is related to the (2x1) reconstruction of the (111) surface of diamond and can also be viewed as a distorted (through sliding and buckling of the sheets) form of graphite. It is stable over cold-compressed graphite above 13.4 GPa. The simulated x-ray diffraction pattern and near K-edge spectroscopy are in satisfactory agreement with the experimental data [W. L. Mao, Science 302, 425 (2003)10.1126/science.1089713] on overcompressed graphite. The hardness and bulk modulus of this new carbon polymorph are calculated to be 83.1 and 431.2 GPa, respectively, which are comparable to those of diamond.", "author": "Quan Li, Yanming Ma, A. Oganov, Hongbo Wang, Hui Wang, Ying Xu, T. Cui, H. Mao, G. Zou", "citations": "https://www.semanticscholar.org/paper/d6b981b8ae7e13215629acdb7c8830b33cc6c625", "color": "red", "doi": "10.1103/PHYSREVLETT.102.175506", "id": "10.1103/PhysRevLett.102.175506", "infos": "{\"Key\": \"56TBVTMB\", \"Item Type\": \"journalArticle\", \"Publication Year\": 2009.0}", "label": "Quan Li 2009", "nb_citations": 464, "shape": "dot", "size": 35, "title": "Superhard monoclinic polymorph of carbon.", "year": 2009 }, { "abstract": ": Through a systematic structural search we found an allotrope of carbon with Cmmm symmetry which we predict to be more stable than graphite for pressures above 10 GPa. This material, which we refer to as Z-carbon, is formed by pure sp(3) bonds and it provides an explanation to several features in experimental x-ray diffraction and Raman spectra of graphite under pressure. The transition from graphite to Z-carbon can occur through simple sliding and buckling of graphene sheets. Our calculations predict that Z-carbon is a transparent wide band-gap semiconductor with a hardness comparable to diamond.", "author": "M. Amsler, J. A. Flores-Livas, L. Lehtovaara, F. Balima, S. Ghasemi, D. Machon, S. Pailh\u00e8s, Alexander Willand, D. Caliste, S. Botti, A. Miguel, S. Goedecker, M. Marques", "citations": "https://www.semanticscholar.org/paper/859900aae66b40b3ec32af0580955f7261961753", "color": "blue", "doi": "10.1103/PHYSREVLETT.108.065501", "id": "10.1103/PhysRevLett.108.065501", "infos": "{\"Key\": \"RVIAUN5U\", \"Item Type\": \"journalArticle\", \"Publication Year\": 2012.0}", "label": "M. Amsler 2012", "nb_citations": 216, "shape": "dot", "size": 27, "title": "Crystal Structure of Cold Compressed Graphite", "year": 2012 }, { "abstract": "The combination of Raman spectroscopy and high-pressure techniques provides a unique method for studying the mechanical and structural response of carbon-based materials. Existing Raman studies on graphite under pressure were restricted to the analysis of the so-called G band, because the Raman signal from the diamond anvils overlaps other characteristic Raman features, like the D band. Here, we present a Raman spectroscopy study of highly oriented pyrolytic graphite (HOPG) under uniaxial stress using moissanite anvils. The use of moissanite has allowed us to observe, for the first time, the evolution of the D band under extreme compression. We have employed several excitation wavelengths: 632.8, 532.0 and 488.0 nm, to further study dispersion effects. Our results have important implications on the interpretation of high-pressure Raman results on several families of carbon-based compounds.", "author": "E. Del Corro, Jes\u00fas D. Gonz\u00e1lez, M. Taravillo, W. Escoffier, V. Baonza", "citations": "https://www.semanticscholar.org/paper/0f8a429069bf90e8168c6256b846ee593e9ab47b", "color": "blue", "doi": "10.1080/08957950802444796", "id": "10.1080/08957950802444796", "infos": "{\"Key\": \"M6N8HW8Z\", \"Item Type\": \"journalArticle\", \"Publication Year\": 2008.0}", "label": "E. Del Corro 2008", "nb_citations": 2, "shape": "dot", "size": 20, "title": "Graphite under non-hydrostatic conditions", "year": 2008 }, { "abstract": "N. Rey,1 P. Toulemonde,1,2 D. Machon,1 L. Duclaux,3 S. Le Floch,1 V. Pischedda,1 J. P. Iti\u00e9,4 A.-M. Flank,4 P. Lagarde,4 W. A. Crichton,5 M. Mezouar,5 Th. Str\u00e4ssle,6 D. Sheptyakov,6 G. Montagnac,7 and A. San-Miguel1,* 1Laboratoire de Physique de la Mati\u00e8re Condens\u00e9e et Nanostructures, CNRS, UMR 5586, Universit\u00e9 Lyon 1, F-69622 Villeurbanne, France 2D\u00e9partement MCMF, Institut N\u00e9el, CNRS and Universit\u00e9 Joseph Fourier, 25 Avenue des Martyrs, Bo\u00eete Postale 166, F-38042 Grenoble Cedex 9, France 3Laboratoire de Chimie Mol\u00e9culaire et Environnement, Universit\u00e9 de Savoie-ESIGEC, Campus Scientifique de Savoie-Technolac, Le Bourget du Lac Cedex, France 4Synchrotron-SOLEIL, CNRS-UR1, Bo\u00eete Postale 48, 91192 Gif-sur-Yvette Cedex, France 5European Synchrotron Radiation Facility, rue 6 Jules Horowitz, Bo\u00eete Postale 220, 38043 Grenoble Cedex 09, France 6Laboratory for Neutron Scattering, ETH Zurich \u0026 Paul Scherrer Institut, CH-5232 Villigen PSI, Switzerland 7Laboratoire de Sciences de la Terre, UMR 5570, CNRS-ENSL-UCBL, 46 All\u00e9e d\u2019Italie, F-69364 Lyon Cedex 07, France Received 19 October 2007; revised manuscript received 23 January 2008; published 27 March 2008", "author": "N. Rey, P. Toulemonde, D. Machon, L. Duclaux, S. Floch, V. Pischedda, J. Iti\u00e9, A. Flank, P. Lagarde, W. Crichton, M. Mezouar, T. Stra\u0308ssle, D. Sheptyakov, G. Montagnac, Alfonso San-Miguel", "citations": "https://www.semanticscholar.org/paper/025b9a2d632ed0a06fe360375f54b5ac7c76e8dd", "color": "blue", "doi": "10.1103/physrevb.77.125433", "id": "10.1103/PhysRevB.77.125433", "infos": "{\"Key\": \"IZMQF2HP\", \"Item Type\": \"journalArticle\", \"Publication Year\": 2008.0}", "label": "N. Rey 2008", "nb_citations": 3, "shape": "dot", "size": 20, "title": "High-pressure behavior of CsC 8 graphite intercalation compound : Lattice structures and phase-transition mechanism", "year": 2008 }, { "abstract": "Crystalline graphite with compound curvature has been produced by precipitation of carbon from metal carbide solutions. Nearly spherical graphitic shells hundreds of microns thick have been synthesized on top of millimeter-sized spherical transition metal cores in high vacuum. Raman spectroscopy, backscatter electron diffraction and X-ray analysis shows the shell to be composed of highly crystalline graphite. Upon cooling, these graphite-like shells routinely undergo a reversible transformation in which the initially smooth surface forms striking geometric facets bounded by ridges of triangular cross section. Evaporation rates and other factors suggest that this transformation represents a phase transition from graphite composed of randomly oriented layers of graphene to fully crystalline graphite having layers in registry. (c) 2006 Elsevier Ltd. All rights reserved.", "author": "S. M. Winder, Dongxia Liu, J. Bender", "citations": "https://www.semanticscholar.org/paper/cb5ff418f212f20023e742d4b7eb2c5a7be98ae4", "color": "blue", "doi": "10.1016/J.CARBON.2006.05.012", "id": "10.1016/j.carbon.2006.05.012", "infos": "{\"Key\": \"K4TZKNZW\", \"Item Type\": \"journalArticle\", \"Publication Year\": 2006.0}", "label": "S. M. Winder 2006", "nb_citations": 8, "shape": "dot", "size": 20, "title": "Synthesis and characterization of compound-curved graphite", "year": 2006 }, { "abstract": "In order to accommodate an increasing demand for glassy carbon products with tailored characteristics, one has to understand the origin of their structure-related properties. In this work, through the use of high-resolution transmission electron microscopy, Raman spectroscopy, and electron energy loss spectroscopy it has been demonstrated that the structure of glassy carbon at different stages of the carbonization process resembles the curvature observed in fragments of nanotubes, fullerenes, or nanoonions. The measured nanoindentation hardness and reduced Young\u2019s modulus change as a function of the pyrolysis temperature from the range of 600\u20132500 \u00b0C and reach maximum values for carbon pyrolyzed at around 1000 \u00b0C. Essentially, the highest values of the mechanical parameters for glassy carbon manufactured at that temperature can be related to the greatest amount of non-planar sp 2 -hybridized carbon atoms involved in the formation of curved graphene-like layers. Such complex labyrinth-like structure with sp 2 -type bonding would be rigid and hard to break that explains the glassy carbon high strength and hardness.", "author": "K. Jurkiewicz, K. Jurkiewicz, M. Pawlyta, Dorota Zygad\u0142o, Dorota Zygad\u0142o, D. Chrobak, D. Chrobak, S. Duber, R. Wrzalik, R. Wrzalik, A. Ratuszna, A. Ratuszna, A. Burian, A. Burian", "citations": "https://www.semanticscholar.org/paper/e5e7cd06acecd446ebc2e244d4b05db21fed8e82", "color": "blue", "doi": "10.1007/s10853-017-1753-7", "id": "10.1007/s10853-017-1753-7", "infos": "{\"Key\": \"QE6QTHM5\", \"Item Type\": \"journalArticle\", \"Publication Year\": 2018.0}", "label": "K. Jurkiewicz 2018", "nb_citations": 118, "shape": "dot", "size": 23, "title": "Evolution of glassy carbon under heat treatment: correlation structure\u2013mechanical properties", "year": 2018 }, { "abstract": "Porous carbons that are three-dimensionally periodic on the scale of optical wavelengths were made by a synthesis route resembling the geological formation of natural opal. Porous silica opal crystals were sintered to form an intersphere interface through which the silica was removed after infiltration with carbon or a carbon precursor. The resulting porous carbons had different structures depending on synthesis conditions. Both diamond and glassy carbon inverse opals resulted from volume filling. Graphite inverse opals, comprising 40-angstrom-thick layers of graphite sheets tiled on spherical surfaces, were produced by surface templating. The carbon inverse opals provide examples of both dielectric and metallic optical photonic crystals. They strongly diffract light and may provide a route toward photonic band-gap materials.", "author": "A. Zakhidov, R. Baughman, Z. Iqbal, C. Cui, I. Khayrullin, S. Dantas, Jordi Marti, V. Ralchenko", "citations": "https://www.semanticscholar.org/paper/3b876b2375142afe7ee2f05acebfe56b90b01f66", "color": "red", "doi": "10.1126/SCIENCE.282.5390.897", "id": "10.1126/science.282.5390.897", "infos": "{\"Key\": \"JJMCPXHX\", \"Item Type\": \"journalArticle\", \"Publication Year\": 1998.0}", "label": "A. Zakhidov 1998", "nb_citations": 847, "shape": "dot", "size": 48, "title": "Carbon structures with three-dimensional periodicity at optical wavelengths", "year": 1998 }, { "abstract": "calculations of the phonon density of states, Al-Jishi and Dresselha~s~~~~~ have attributed the second-order bands", "author": "Yan. Wang, D. Alsmeyer, R. McCreery", "citations": "https://www.semanticscholar.org/paper/6cec800cf9222c4a309547e87a45dbba9c32e8db", "color": "red", "doi": "10.1021/CM00011A018", "id": "10.1021/cm00011a018", "infos": "{\"Key\": \"WR77HG7I\", \"Item Type\": \"journalArticle\", \"Publication Year\": 1990.0}", "label": "Yan. Wang 1990", "nb_citations": 1469, "shape": "dot", "size": 68, "title": "Raman Spectroscopy of Carbon Materials: Structural Basis of Observed Spectra", "year": 1990 }, { "abstract": "The Raman spectrum of glassy carbon has been measured. Two broad lines are observed at 1340 and 1590 cm\u22121. These results are consistent with the turbostratic structure, which has been suggested for glassy carbon, with a particle size La of approximately 30 A.", "author": "M. Nathan, John E. Smith, K. Tu", "citations": "https://www.semanticscholar.org/paper/92aca12e2a778b2244684f9f85d0d9c908bf7d7b", "color": "red", "doi": "10.1063/1.1663599", "id": "10.1063/1.1663599", "infos": "{\"Key\": \"9RKW8G7G\", \"Item Type\": \"journalArticle\", \"Publication Year\": 1974.0}", "label": "M. Nathan 1974", "nb_citations": 145, "shape": "dot", "size": 24, "title": "Raman spectra of glassy carbon", "year": 1974 }, { "abstract": "Graphene-based materials exhibit remarkable electronic, optical, and mechanical properties, which has resulted in both high scientific interest and huge potential for a variety of applications. Furthermore, the family of graphene-based materials is growing because of developments in preparation methods. Raman spectroscopy is a versatile tool to identify and characterize the chemical and physical properties of these materials, both at the laboratory and mass-production scale. This technique is so important that most of the papers published concerning these materials contain at least one Raman spectrum. Thus, here, we systematically review the developments in Raman spectroscopy of graphene-based materials from both fundamental research and practical (i.e., device applications) perspectives. We describe the essential Raman scattering processes of the entire first- and second-order modes in intrinsic graphene. Furthermore, the shear, layer-breathing, G and 2D modes of multilayer graphene with different stacking orders are discussed. Techniques to determine the number of graphene layers, to probe resonance Raman spectra of monolayer and multilayer graphenes and to obtain Raman images of graphene-based materials are also presented. The extensive capabilities of Raman spectroscopy for the investigation of the fundamental properties of graphene under external perturbations are described, which have also been extended to other graphene-based materials, such as graphene quantum dots, carbon dots, graphene oxide, nanoribbons, chemical vapor deposition-grown and SiC epitaxially grown graphene flakes, composites, and graphene-based van der Waals heterostructures. These fundamental properties have been used to probe the states, effects, and mechanisms of graphene materials present in the related heterostructures and devices. We hope that this review will be beneficial in all the aspects of graphene investigations, from basic research to material synthesis and device applications.", "author": "Jiang-Bin Wu, Miao\u2010Ling Lin, Xin Cong, He-Nan Liu, P. Tan", "citations": "https://www.semanticscholar.org/paper/44f510905efea9027dfd7f587e98225798f039a3", "color": "blue", "doi": "10.1039/c6cs00915h", "id": "10.1039/C6CS00915H", "infos": "{\"Key\": \"595Z5ZLE\", \"Item Type\": \"journalArticle\", \"Publication Year\": 2018.0}", "label": "Jiang-Bin Wu 2018", "nb_citations": 1094, "shape": "dot", "size": 56, "title": "Raman spectroscopy of graphene-based materials and its applications in related devices.", "year": 2018 }, { "abstract": "A review of double resonance Raman spectroscopy is presented. Non-zone centre phonon modes in solids can be observed in the double resonance Raman spectra, in which weak Raman signals appear in a wide frequency region and their combination or overtone modes can be assigned. By changing the excitation laser energy, we can derive the phonon dispersion relations of a single nanotube.", "author": "Riichiro Saito, A. Gr\u00fcneis, G. Samsonidze, Victor W. Brar, G. Dresselhaus, M. Dresselhaus, A. Jorio, L. G. Can\u00e7ado, C. Fantini, M. Pimenta, A. G. S. Filho", "citations": "https://www.semanticscholar.org/paper/ffc8dfcabbcb460010f25911d15f5db6f0829fbc", "color": "blue", "doi": "10.1088/1367-2630/5/1/157", "id": "10.1088/1367-2630/5/1/157", "infos": "{\"Key\": \"299WXTKI\", \"Item Type\": \"journalArticle\", \"Publication Year\": 2003.0}", "label": "Riichiro Saito 2003", "nb_citations": 231, "shape": "dot", "size": 27, "title": "Double resonance Raman spectroscopy of single-wall carbon nanotubes", "year": 2003 }, { "abstract": "High sensitivity surface Raman spectroscopy was used to acquire spectra from monolayers of nitrophenyl groups covalently bonded to glassy carbon (GC) and ordered graphite. 4-Nitrophenyl radical was generated by electroreduction of 4-nitrophenyl diazonium ion in acetonitrile, then the radical covalently bonded to the carbon surface. Raman spectroscopy with a 488 nm laser and a CCD spectrograph revealed spectral features characteristic of the nitrophenyl group. Voltammetry, XPS, and Raman spectroscopic data established that the surface coverage was 6.5 x mol/cm2 on the basal plane of highly ordered pyrolytic graphite (HOPG). Electrochemical reduction of the nitrophenyl surface yielded significant spectral changes, perhaps due to formation of an amine. The similarity of the Raman results for modified HOPG and GC surface indicates that the nitrophenyl radical is quite aggressive, apparently attacking both edge plane and basal plane sites.", "author": "Yi-chun Liu, R. McCreery", "citations": "https://www.semanticscholar.org/paper/8563ce515bb737f2412c86a944c084a90ca36519", "color": "red", "doi": "10.1021/JA00150A024", "id": "10.1021/ja00150a024", "infos": "{\"Key\": \"AQVC4XKB\", \"Item Type\": \"journalArticle\", \"Publication Year\": 1995.0}", "label": "Yi-chun Liu 1995", "nb_citations": 261, "shape": "dot", "size": 28, "title": "Reactions of Organic Monolayers on Carbon Surfaces Observed with Unenhanced Raman Spectroscopy", "year": 1995 }, { "abstract": "We report on the micro-Raman spectroscopy of monolayer, bilayer, trilayer, and many layers of graphene (graphite) bombarded by low-energy argon ions with different doses. The evolution of peak frequencies, intensities, linewidths, and areas of the main Raman bands of graphene is analyzed as function of the distance between defects and number of layers. We describe the disorder-induced frequency shifts and the increase in the linewidth of the Raman bands by means of a spatial-correlation model. Also, the evolution of the relative areas A{sub D}/A{sub G}, A{sub D}{sup \u0027}/A{sub G}, and A{sub G}{sup \u0027}/A{sub G} is described by a phenomenological model. The present results can be used to fully characterize disorder in graphene systems.", "author": "E. Ferreira, M. Moutinho, F. Stavale, M. Lucchese, R. Capaz, C. Achete, A. Jorio", "citations": "https://www.semanticscholar.org/paper/6cb10e4ca250164d7e471b7df20dd558cf8f8f74", "color": "blue", "doi": "10.1103/PHYSREVB.82.125429", "id": "10.1103/PhysRevB.82.125429", "infos": "{\"Key\": \"SD6Q5J26\", \"Item Type\": \"journalArticle\", \"Publication Year\": 2010.0}", "label": "E. Ferreira 2010", "nb_citations": 632, "shape": "dot", "size": 41, "title": "Evolution of the Raman spectra from single-, few-, and many-layer graphene with increasing disorder", "year": 2010 }, { "abstract": "Single-walled nanotubes (SWNTs) industrially produced and multiwalled nanotubes (MWNTs) we produced by catalysis were investigated by transmission electron microscopy (TEM) and Fourier transform infrared (FTIR) spectroscopy. The observed spectral features, that is the peak position, intensity, and bandwidth, were related to some structural properties of the investigated samples. In such a way, information on the vibrational modes, nanotube diameters, and purity degree of the samples was obtained. The findings of the FTIR investigation are in perfect agreement with the TEM evidence.", "author": "C. Branca, F. Frusteri, V. Magaz\u00f9, A. Mangione", "citations": "https://www.semanticscholar.org/paper/fcc101dfb177592baf30cb9d7fb2b1d6fe9adabe", "color": "red", "doi": "10.1021/JP0372183", "id": "10.1021/jp0372183", "infos": "{\"Key\": \"INCW39BX\", \"Item Type\": \"journalArticle\", \"Publication Year\": 2004.0}", "label": "C. Branca 2004", "nb_citations": 129, "shape": "dot", "size": 24, "title": "Characterization of Carbon Nanotubes by TEM and Infrared Spectroscopy", "year": 2004 }, { "abstract": "The singularity index \u03b1 of the asymmetric C(1s) x\u2010ray photoelectron spectrum (XPS) of vitreous carbon is determined to be 0.19\u00b10.01, independent of the interlayer separation of the graphitic layers. This result is interpreted within the framework of the many\u2010electron theory; two mechanisms are suggested: (1) the modulation of the two\u2010dimensional graphite band structures by the random interlayer perturbation, and (2) the excitonic screening. By assigning the value \u03b1=0.19 to be characteristic of carbon atoms associated with polynuclear aromatic rings, we show that the fraction of carbon in these rings in coal can be determined by the asymmetry of the C(1s) XPS line.", "author": "T. Cheung", "citations": "https://www.semanticscholar.org/paper/d4c4c3f3af3fa0c693f93d9893a2fa62805f8459", "color": "red", "doi": "10.1063/1.330025", "id": "10.1063/1.330025", "infos": "{\"Key\": \"2CXY33YA\", \"Item Type\": \"journalArticle\", \"Publication Year\": 1982.0}", "label": "T. Cheung 1982", "nb_citations": 67, "shape": "dot", "size": 22, "title": "X\u2010ray photoemission of carbon: Lineshape analysis and application to studies of coals", "year": 1982 }, { "abstract": NaN, "author": "S. Iijima", "citations": "https://www.semanticscholar.org/paper/2b1a1d5dc50c47baf35cf5a51c238caa5b07a474", "color": "red", "doi": "10.1038/354056a0", "id": "10.1038/354056a0", "infos": "{\"Key\": \"VEDXAWWU\", \"Item Type\": \"journalArticle\", \"Publication Year\": 1991.0}", "label": "S. Iijima 1991", "nb_citations": 9998, "shape": "dot", "size": 353, "title": "Helical microtubules of graphitic carbon", "year": 1991 }, { "abstract": "Carbon nanotubes (CNTs) revealing metallic or semiconductive properties depending on the folding modes of the nanotube walls represent a novel class of nanowires. Different methods to separate semiconductive CNTs from conductive CNTs have been developed, and synthetic strategies to chemically modify the side walls or tube ends by molecular or biomolecular components have been reported. Tailoring hybrid systems consisting of CNTs and biomolecules (proteins and DNA) has rapidly expanded and attracted substantial research effort. The integration of biomaterials with CNTs enables the use of the hybrid systems as active field-effect transistors or biosensor devices (enzyme electrodes, immunosensors, or DNA sensors). Also, the integration of CNTs with biomolecules has allowed the generation of complex nanostructures and nanocircuitry of controlled properties and functions. The rapid progress in this interdisciplinary field of CNT-based nanobioelectronics and nanobiotechnology is reviewed by summarizing the present scientific accomplishments, and addressing the future goals and perspectives of the area.", "author": "E. Katz, I. Willner", "citations": "https://www.semanticscholar.org/paper/d3ff14bc638e72fe59b8632a13ee8ca1ddea6cd6", "color": "red", "doi": "10.1002/CPHC.200400193", "id": "10.1002/cphc.200400193", "infos": "{\"Key\": \"9ZAJS8BE\", \"Item Type\": \"journalArticle\", \"Publication Year\": 2004.0}", "label": "E. Katz 2004", "nb_citations": 641, "shape": "dot", "size": 41, "title": "Biomolecule-functionalized carbon nanotubes: applications in nanobioelectronics.", "year": 2004 }, { "abstract": "High hydrostatic pressures were applied to single-wall carbon nanotubes by means of a diamond anvil cell (DAC), and micro-Raman spectroscopy was simultaneously used to monitor the pressure-induced shift of various nanotube bands. The data confirm recent results independently obtained from internal pressure experiments with various liquids, where the peak shifts were considered to arise from compressive forces imposed by the liquids on the nanotubes. It is also shown that the nanotube peak at 1580 cm-1 (the G band) shifts linearly with pressure up to 20\u2009000 atm and deviates from linearity at higher pressure. This deviation is found to be coincident with a drop in Raman intensity for the disorder-induced peak at 2610 cm-1 (the overtone of the D* band), possibly corresponding to the occurrence of reversible flattening of the nanotubes. The independent results presented here confirm the potential of nanotubes as molecular sensors.", "author": "J. Wood, Frogley, Er Erwin Meurs, A. Prins, Aajm Ton Peijs, D. Dunstan, H. Wagner", "citations": "https://www.semanticscholar.org/paper/a77dfd21427a713ce9c465f11a29113177001bce", "color": "blue", "doi": "10.1021/JP992136T", "id": "10.1021/jp992136t", "infos": "{\"Key\": \"P23AGKI8\", \"Item Type\": \"journalArticle\", \"Publication Year\": 1999.0}", "label": "J. Wood 1999", "nb_citations": 105, "shape": "dot", "size": 23, "title": "Mechanical Response of Carbon Nanotubes under Molecular and Macroscopic Pressures", "year": 1999 }, { "abstract": NaN, "author": "S. Koenig, Narasimha Boddeti, M. Dunn, J. Bunch", "citations": "https://www.semanticscholar.org/paper/f035670e0986b8d43457d14b735be59dea84391b", "color": "blue", "doi": "10.1038/nnano.2011.123", "id": "10.1038/nnano.2011.123", "infos": "{\"Key\": \"2PDI89PA\", \"Item Type\": \"journalArticle\", \"Publication Year\": 2011.0}", "label": "S. Koenig 2011", "nb_citations": 952, "shape": "dot", "size": 51, "title": "Ultrastrong adhesion of graphene membranes.", "year": 2011 }, { "abstract": "Department of Materials Science, University of Patras, 26504 Rio Patras, Greece, Theoretical and Physical Chemistry Institute, National Hellenic Research Foundation, 48 Vass. Constantinou Avenue, 116 35 Athens, Greece, Institut de Biologie Moleculaire et Cellulaire, UPR9021 CNRS, Immunologie et Chimie Therapeutiques, 67084 Strasbourg, France, and Dipartimento di Scienze Farmaceutiche, Universita di Trieste, Piazzale Europa 1, 34127 Trieste, Italy", "author": "D. Tasis, N. Tagmatarchis, A. Bianco, M. Prato", "citations": "https://www.semanticscholar.org/paper/4137c7569c18fd130dab7e500a8c2292cade4bab", "color": "red", "doi": "10.1021/CR050569O", "id": "10.1021/cr050569o", "infos": "{\"Key\": \"G98JRHBI\", \"Item Type\": \"journalArticle\", \"Publication Year\": 2006.0}", "label": "D. Tasis 2006", "nb_citations": 3703, "shape": "dot", "size": 143, "title": "Chemistry of carbon nanotubes.", "year": 2006 }, { "abstract": "An ultra lightweight carbon microtube material called Aerographite is synthesized by a novel single-step chemical vapor deposition synthesis based on ZnO networks, which is presently the lightest known material with a density smaller than \u03bcg/cm(3). Despite its low density, the hierarchical design leads to remarkable mechanical, electrical, and optical properties. The first experiments with Aerographite electrodes confirm its applicability.", "author": "M. Mecklenburg, A. Schuchardt, Y. Mishra, S. Kaps, R. Adelung, A. Lotnyk, L. Kienle, K. Schulte", "citations": "https://www.semanticscholar.org/paper/2620cdc6a86d56b496f882cb52561e2328eb3c75", "color": "red", "doi": "10.1002/adma.201200491", "id": "10.1002/adma.201200491", "infos": "{\"Key\": \"HBDRJ6F9\", \"Item Type\": \"journalArticle\", \"Publication Year\": 2012.0}", "label": "M. Mecklenburg 2012", "nb_citations": 367, "shape": "dot", "size": 32, "title": "Aerographite: Ultra Lightweight, Flexible Nanowall, Carbon Microtube Material with Outstanding Mechanical Performance", "year": 2012 }, { "abstract": "The thermal reaction of single-wall carbon nanotubes with in situ generated aryl diazonium compounds is described and is compared to a previously reported, electrochemically induced reaction with preformed aryl diazonium salts.", "author": "Jeffrey L. Bahr and, J. Tour", "citations": "https://www.semanticscholar.org/paper/9ee51529025c27b71e582a8c2d96517ba395a8af", "color": "blue", "doi": "10.1021/CM0109903", "id": "10.1021/cm0109903", "infos": "{\"Key\": \"T3T7FHUC\", \"Item Type\": \"journalArticle\", \"Publication Year\": 2001.0}", "label": "Jeffrey L. Bahr and 2001", "nb_citations": 557, "shape": "dot", "size": 38, "title": "Highly Functionalized Carbon Nanotubes Using in Situ Generated Diazonium Compounds", "year": 2001 }, { "abstract": NaN, "author": "R. Duan, A. K. Mukherjee", "citations": "https://www.semanticscholar.org/paper/fda4984d6e9d8fa000727fbf8cb3e22d66b5588f", "color": "blue", "doi": "10.1002/adma.200306564", "id": "10.1002/adma.200306564", "infos": "{\"Key\": \"PUSKPM43\", \"Item Type\": \"journalArticle\", \"Publication Year\": 2004.0}", "label": "R. Duan 2004", "nb_citations": 12, "shape": "dot", "size": 20, "title": "Synthesis of SiCNO Nanowires Through Heat\u2010Treatment of Polymer\u2010Functionalized Single\u2010Walled Carbon Nanotubes", "year": 2004 }, { "abstract": "The results of studies of physical properties such as density, electrical and thermal conductivity, bending strength and elastic modulus for glassy carbon are presented as a function of its heattreatment temperature. The diameters of aromatic planes as estimated from X-ray diffraction patterns are included. It is found that glassy carbon is resistant to thermal shock and to oxidizing agents, and is useful in many fields of industry. Its various applications are briefly summarized.", "author": "S. Yamada, H. Sato, T. Ishii", "citations": "https://www.semanticscholar.org/paper/6330fe85679d76a180ec894ccba30fe1d8a4ae78", "color": "red", "doi": "10.1016/0008-6223(64)90039-9", "id": "10.1016/0008-6223(64)90039-9", "infos": "{\"Key\": \"JXH76KA2\", \"Item Type\": \"journalArticle\", \"Publication Year\": 1964.0}", "label": "S. Yamada 1964", "nb_citations": 40, "shape": "dot", "size": 21, "title": "Eigenschaften und Verwendung von glasartigem Kohlenstoff", "year": 1964 }, { "abstract": "An XPS study of anodic oxidized glass-like carbon (GC) was conducted in order to investigate the inconsistency between O1s/C1s and oxygen concentration (Ocal.) calculated from the curve fitting results of the C1s spectrum. Consideration of the asymmetric peak shape of the C1s spectrum is normally done in order to obtain precise curve fitting results. However, it was found that the 2nd-carbon peak should also be taken into consideration in the curve fitting process in addition to the effect of asymmetric peak shape of carbon to obtain a consistent value of O1s/C1s. The 2nd graphitic peak is normally located +0.7\u2013+0.8 eV away from the original C1s spectrum. The ratio of the 2nd graphitic peak area in the C1s spectrum increased as the electrical charge increased. However, the peak shapes of C1s spectra of anodic oxidized GC after heat treatment at 1500 \u00b0C in argon atmosphere were almost the same as the C1s of untreated GC. Although the origin of the 2nd graphitic peak is not well understood, it may be related to the amount of oxygen on the GC surface.", "author": "S. Yumitori", "citations": "https://www.semanticscholar.org/paper/13dfe0324c569f27602c2341afea3022d077a4ea", "color": "blue", "doi": "10.1023/A:1004761103919", "id": "10.1023/A:1004761103919", "infos": "{\"Key\": \"B4B5A9LW\", \"Item Type\": \"journalArticle\", \"Publication Year\": 2000.0}", "label": "S. Yumitori 2000", "nb_citations": 298, "shape": "dot", "size": 29, "title": "Correlation of C1s chemical state intensities with the O1s intensity in the XPS analysis of anodically oxidized glass-like carbon samples", "year": 2000 }, { "abstract": "Raman spectra, phenanthrenequinone adsorption, differential capacitance and scanning electron micrographs on fractured and polished glassy carbon (GC) surfaces were monitored before and after pulsed laser irradiation of varying power density. At power densities below 30 MW / cm2, the Raman spectra, \u0393PQ, Cdlo and SEM appearance of polished surfaces changed slightly with laser activation. However, the Raman spectra of fractured GC indicated increased disorder during laser irradiation. After vigorous laser treatment, the Raman spectrum became similar to that of the polished surface, but \u0393 and Cdlo on the fractured surface did not change greatly at power densities below 30 MW / cm2. At higher power densities, both polished and fractured surfaces showed significantly higher \u0393PQ and Cdlo, and the SEMs showed evidence of local melting. After 70 MW / cm2 laser treatment, the fractured and polished surfaces were quite similar. The results support a mechanism based on thermomechanical shock below about 30 MW / cm2 and local melting above this threshold.", "author": "N. Pontikos, R. McCreery", "citations": "https://www.semanticscholar.org/paper/4064a11a6c84a04939ce16f6f4c35eb1f180caf2", "color": "blue", "doi": "10.1016/0022-0728(92)80048-9", "id": "10.1016/0022-0728(92)80048-9", "infos": "{\"Key\": \"S38UQ8CL\", \"Item Type\": \"journalArticle\", \"Publication Year\": 1992.0}", "label": "N. Pontikos 1992", "nb_citations": 36, "shape": "dot", "size": 21, "title": "Microstructural and morphological changes induced in glassy carbon electrodes by laser irradiation", "year": 1992 }, { "abstract": "Surface oxidation and/or corrosion behavior of glass-like carbons (GLCs) in concentrated H2SO4, HNO3 and H2O2 aq. were investigated with scanning electron microscopy (SEM), X-ray photoelectron spectroscopy (XPS) and by weight changes. With GLCs treated in H2SO4, formation of sulfur-containing chemical species was observed, with some weight gain. However, no change was observed in morphology. With the samples treated in HNO3, the weight initially increased and, then, decreased. No nitrogen-containing chemical species were observed. Crack formation and scaling off of the upper layers were observed. With the samples treated in H2O2 aq., rapid weight loss and void formation were observed.", "author": "Kazumasa Nakamura, Hiroki Morooka, Y. Tanabe, E. Yasuda, T. Akatsu, H. Shindo", "citations": "https://www.semanticscholar.org/paper/dfe6c7e8f1524299fdd436400ea5fb54886377b0", "color": "blue", "doi": "10.1016/J.CORSCI.2011.08.004", "id": "10.1016/j.corsci.2011.08.004", "infos": "{\"Key\": \"I8GSNX8Q\", \"Item Type\": \"journalArticle\", \"Publication Year\": 2011.0}", "label": "Kazumasa Nakamura 2011", "nb_citations": 11, "shape": "dot", "size": 20, "title": "Surface oxidation and/or corrosion behavior of glass-like carbon in sulfuric and nitric acids, and in aqueous hydrogen peroxide", "year": 2011 }, { "abstract": "Electrochemical properties of glassy carbon electrodes of two types were examined, one thermally treated at 1000\u00b0C (sample K) and another thermally treated at 2500\u00b0 (sample G). Mechanically polished or electrochemically polarized electrodes were characterized in NaOH, HClO4 and H2SO4 solutions by cyclic voltammetry (cv) at different sweep rates in the potential range between the hydrogen and oxygen evolution. The activity of the electrodes depended on the properties of the glassy carbon examined, as determined by both the temperature of thermal treatment and the mechanical or electrochemical pretreatment of the sample. It was noticed that both types of electrodes, when polished exhibited an increase in the double layer charge upon increasing the pH value of the solution. The cv charges, for both types of samples, increase upon anodic polarization. The higher the potential of oxidation, the more pronounced is the increase in charge, particularly in acidic solution. The increase in charge amounts from below 1 mC cm\u22122 for polished glassy carbon up to few hundreds of mC cm\u22122 for surfaces anodically polarized in acidic solution. Analysis of the dependence of voltammetric charge, as well as morphological changes of the electrode surface, on the time of oxidation suggests the existence of three stages in the electrochemical activation process. The first one occurs only once at the beginning of the activation, while the other two repeat themselves, reflecting a periodical activation and deactivation process. These stages were discussed and ascribed to a surface layer oxidation, graphite oxide layer growth and mechanical destruction of the surface. Independent surface analysis by AES, XPS and STM confirms the results obtained by electrochemical methods.", "author": "A. Dekanski, J. Stevanovic, Rade Stevanovi\u0107, B. Nikoli\u0107, V. Jovanovi\u0107", "citations": "https://www.semanticscholar.org/paper/7789cae5300305aa7f0183707bd25a094bb6e189", "color": "blue", "doi": "10.1016/S0008-6223(00)00228-1", "id": "10.1016/S0008-6223(00)00228-1", "infos": "{\"Key\": \"I8JCEFD6\", \"Item Type\": \"journalArticle\", \"Publication Year\": 2001.0}", "label": "A. Dekanski 2001", "nb_citations": 233, "shape": "dot", "size": 27, "title": "Glassy carbon electrodes: I. Characterization and electrochemical activation", "year": 2001 }, { "abstract": "Raman spectroscopy was used to study the melting of nitrogen from 290 to 900 K at pressures from 2.3 to 18 GPa. This work, which extends the melting by a factor of 9 over previously published results was made possible by new developments in high\u2010temperature diamond\u2010anvil cells. The \u03b2/\u03b4 phase boundary was also determined, and the \u03b2\u2013\u03b4\u2013fluid triple point was found to be at 578\u00b110 K and 9.9\u00b10.5 GPa. The Raman frequencies of the vibron in fluid N2 and the \u03bd2 vibron in \u03b4\u2010N2 were found to have the same pressure dependence and be independent of temperature to a good approximation. A temperature\u2010independent pressure scale, useful to at least 900 K is approximated by P/GPa=0.4242 \u03bd/cm\u22121 \u2212987.8, where \u03bd is the frequency of either the \u03bd2 vibron in \u03b4\u2010N2 or the vibron in fluid\u2010N2.", "author": "A. S. Zinn, D. Schiferl, M. Nicol", "citations": "https://www.semanticscholar.org/paper/830d18492967fe965c160594859417affdad3245", "color": "blue", "doi": "10.1063/1.453310", "id": "10.1063/1.453310", "infos": "{\"Key\": \"6XIT3DFD\", \"Item Type\": \"journalArticle\", \"Publication Year\": 1987.0}", "label": "A. S. Zinn 1987", "nb_citations": 60, "shape": "dot", "size": 22, "title": "Raman spectroscopy and melting of nitrogen between 290 and 900 K and 2. 3 and 18 GPa", "year": 1987 }, { "abstract": "Caracterisation par spectrometrie XPS et AES de surfaces de carbone vitreuse apres exposition a l\u0027oxygene et au dioxyde de carbone. La decomposition chimique ulterieure est etudiee par la methode de la decomposition a temperature programmee. Cette etude permet de caracteriser la premiere etape de la gazeification et de la combustion du charbon", "author": "S. Kelemen, H. Freund", "citations": "https://www.semanticscholar.org/paper/4ffbcfb532310f55379c52c69f7ebced2fa7d39d", "color": "blue", "doi": "10.1021/EF00008A001", "id": "10.1021/ef00008a001", "infos": "{\"Key\": \"QWWVGBWB\", \"Item Type\": \"journalArticle\", \"Publication Year\": 1988.0}", "label": "S. Kelemen 1988", "nb_citations": 47, "shape": "dot", "size": 21, "title": "XPS Characterization of glassy-carbon surfaces oxidized by O2, CO2, and HNO3", "year": 1988 }, { "abstract": NaN, "author": "D. Briggs", "citations": "https://www.semanticscholar.org/paper/94ba0bf1e281fbefb0e0f3516fd7ce6047d152fd", "color": "blue", "doi": "10.1002/SIA.740030412", "id": "10.1002/sia.740030412", "infos": "{\"Key\": \"D579LSTZ\", \"Item Type\": \"journalArticle\", \"Publication Year\": 1981.0}", "label": "D. Briggs 1981", "nb_citations": 367, "shape": "dot", "size": 32, "title": "Handbook of X\u2010ray Photoelectron Spectroscopy C. D. Wanger, W. M. Riggs, L. E. Davis, J. F. Moulder and G. E.Muilenberg Perkin\u2010Elmer Corp., Physical Electronics Division, Eden Prairie, Minnesota, USA, 1979. 190 pp. $195", "year": 1981 }, { "abstract": "3.6.1. Polishing and Cleaning 2663 3.6.2. Vacuum and Heat Treatments 2664 3.6.3. Carbon Electrode Activation 2665 3.7. Summary and Generalizations 2666 4. Advanced Carbon Electrode Materials 2666 4.1. Microfabricated Carbon Thin Films 2666 4.2. Boron-Doped Diamond for Electrochemistry 2668 4.3. Fibers and Nanotubes 2669 4.4. Carbon Composite Electrodes 2674 5. Carbon Surface Modification 2675 5.1. Diazonium Ion Reduction 2675 5.2. Thermal and Photochemical Modifications 2679 5.3. Amine and Carboxylate Oxidation 2680 5.4. Modification by \u201cClick\u201d Chemistry 2681 6. Synopsis and Outlook 2681 7. Acknowledgments 2682 8. References 2682", "author": "R. McCreery", "citations": "https://www.semanticscholar.org/paper/167d8a3763ad6c24ede2b72ace5b144bfe0cf0bc", "color": "red", "doi": "10.1021/cr068076m", "id": "10.1021/cr068076m", "infos": "{\"Key\": \"54CZPQ6E\", \"Item Type\": \"journalArticle\", \"Publication Year\": 2008.0}", "label": "R. McCreery 2008", "nb_citations": 2246, "shape": "dot", "size": 94, "title": "Advanced carbon electrode materials for molecular electrochemistry.", "year": 2008 }, { "abstract": "We employ an internal standard protocol to simultaneously characterise and utilise electrode materials during their electrochemical implementation. The proposed approach involves \u2018spiking\u2019 a solution containing the analyte of interest (namely, \u03b2-nicotinamide adenine dinucleotide (NADH)) with a common electrochemical redox probe (such as hexaammine-ruthenium(III) chloride), which consequently allows information on the electrochemical properties of the electrode being utilised to be obtained and monitored throughout its application. This approach is explored using a range of commonly encountered carbonaceous electrode materials, including various graphene configurations, such as monolayer, double- and few-layered graphene electrodes \u2013 the latter is reported for the first time. The variability in structural quality and stability of the graphene electrodes used (particularly between batches) highlights the necessity for implementation of such approaches within the literature. This work provides a simple, yet effective option for the in situ electrochemical characterisation of various electrode materials, essential where the quality and composition of a \u2018reported\u2019 electrode material can vary greatly depending on its fabrication (batch-to-batch quality) or during the course of experimental use.", "author": "D. A. Brownson, P. Kelly, C. Banks", "citations": "https://www.semanticscholar.org/paper/5d207993a7dbcd65a33b456b708fcf3e6cfd306b", "color": "blue", "doi": "10.1039/C5RA03049H", "id": "10.1039/C5RA03049H", "infos": "{\"Key\": \"DJGP8VA3\", \"Item Type\": \"journalArticle\", \"Publication Year\": 2015.0}", "label": "D. A. Brownson 2015", "nb_citations": 55, "shape": "dot", "size": 21, "title": "In situ electrochemical characterisation of graphene and various carbon-based electrode materials: an internal standard approach", "year": 2015 }, { "abstract": "Un pretraitement electrochimique nettoie l\u0027electrode de ses contaminants introduit au cours du polissage et entraine une oxydation superficielle qui influence certaines reactions", "author": "R. Engstrom, Vernon A. Strasser", "citations": "https://www.semanticscholar.org/paper/4b6dc6fe96db07a39a7ecc6c1b30a5705d5b13d8", "color": "blue", "doi": "10.1021/AC00266A005", "id": "10.1021/ac00266a005", "infos": "{\"Key\": \"YFNYQJN6\", \"Item Type\": \"journalArticle\", \"Publication Year\": 1984.0}", "label": "R. Engstrom 1984", "nb_citations": 389, "shape": "dot", "size": 32, "title": "Characterization of electrochemically pretreated glassy carbon electrodes", "year": 1984 }, { "abstract": "By use of Raman spectroscopy as a probe, the relationship between carbon microstructure and increases in the heterogeneous electron-transfer rate for carbon electrodes was examined. A distinctive Raman band at 1360/cm is proportional to the density of graphitic edge planes and may be used to monitor changes in edge plane density induced by carbon pretreatment procedures. It was shown that electrochemical oxidation of highly ordered pyrolytic graphite (HOPG) caused fracturing of the graphite lattice, thus increasing edge plane density. This result is consistent with other reports from laser activation of HOPG, which correlate increased edge plane density with increased electron-transfer rate. Creation of edge plane is a phenomenon common to both oxidative and nonoxidative activation procedures and is responsible for HOPG activation. Arguments about the involvement of graphitic oxide or oxygen containing functional groups in electron-transfer activation are presented. After the present results are combined with those from the literature, it appears unlikely the oxygen functional groups are involved in electron-transfer activation of several benchmark redox systems on carbon electrodes.", "author": "Robert J. Bowling, R. Packard, R. McCreery", "citations": "https://www.semanticscholar.org/paper/03c55b7d8299905a987257cf02e933818a2f5920", "color": "blue", "doi": "10.1021/LA00087A022", "id": "10.1021/la00087a022", "infos": "{\"Key\": \"BAHII6XW\", \"Item Type\": \"journalArticle\", \"Publication Year\": 1989.0}", "label": "Robert J. Bowling 1989", "nb_citations": 132, "shape": "dot", "size": 24, "title": "Mechanism of electrochemical activation of carbon electrodes: role of graphite lattice defects", "year": 1989 }, { "abstract": "The electron transfer (El\u0027) kinetics of Ru(NH~)~~+/~+, II-C~~~-/~-, Fc?(CN)~~-/~-, Feaq2+/3+, and Vaq2+l3+ were examined on several modified glassy carbon surfaces. The kinetics of the aquated ions were very sensitive to the density of surface oxides, while those of the other redox systems were not. In particular, chemical derhalization of surface carbonyl groups decreased the rate of electron transfer with Fe3+l2+ by 2-3 orders of magnitude but had little effect on Ru(NH~)~~+/~+ or Ircl~~-/~-. The electron trader rates for Fe31/2+ correlated with surface C=O density determined by resonance Raman spectroscopy. Neutral, cationic, and anionic nonspecific adsorbers decreased the rates of ET with the aquated ions ap proximately equally but had little effect on Ru(NH3)62-/3f. The redox systems studied were classified into two groups: those which are catalyzed by surface carbonyl groups and those which are not. Possible catalytic mechanisms are considered. A significant effort by many laboratories has been directed toward understanding the relationship between surface structure and electron transfer reactivity for carbon Complex surface chemistry and an often unknown level of surface impurities have made it difticult to determine the important structural variables controlling carbon electrode reactivity. At least three major phenomena affect electron transfer (m? reactivity, and these vary in importance for different redox systems and solution conditions. First, many redox systems (e.g., Fe(CN),j3-14-, ascorbic acid, dopamine) are very sensitive to surface cleanliness, and observed ET rates are strongly dependent on surface hist~ry.~.\u0027~ Second, the microstructure of the carbon has a large effect on most redox systems, with the basal plane of highly ordered pyrolytic graphite (HOPG) exhibiting much slower ET", "author": "Piehong. Chen, Mark A. Fryling, R. McCreery", "citations": "https://www.semanticscholar.org/paper/f3a59371366c71e2d6740a2acb0150effbcc5a22", "color": "blue", "doi": "10.1021/AC00114A004", "id": "10.1021/ac00114a004", "infos": "{\"Key\": \"9EHH24XD\", \"Item Type\": \"journalArticle\", \"Publication Year\": 1995.0}", "label": "Piehong. Chen 1995", "nb_citations": 282, "shape": "dot", "size": 29, "title": "Electron Transfer Kinetics at Modified Carbon Electrode Surfaces: The Role of Specific Surface Sites", "year": 1995 }, { "abstract": "The Raman spectrum of Graphon carbon black has been recorded using rotating cell techniques. Angular dependence of scattering at 1360, 1580 and 2700 cm\u22121 are reported and these data suggest that the 1360 cm\u22121 line is associated with non-planar microstructure distortions. The excitation frequency dependence of the intensity ratio of the bands at 1360 (D) and 1580 cm\u22121 (G) is interpreted in terms of resonance (vibronic) interaction. This dependence is primarily the result of an increase in the intensity of the 1360 cm \u22121 line. The disorder-associated line (D) exhibits a significant excitation-dependent shift from 1378 cmi\u22121 (457.9 nm Ar+) to 1330 cm\u22121 (647.1 nm Kr+). The \u201cgraphite\u201d (G) line position is less sensitive to changes in excitation frequency. The spectral features are discussed in terms of factor group, C6v4, and layer site symmetry, C3v. Also the possible role of localized alkene-like structure in zones of structural distortion is considered.", "author": "T. Mernagh, R. Cooney, Robert Johnson", "citations": "https://www.semanticscholar.org/paper/08e6d597c0ea8a6ade0431073f19f2bf6b4afde6", "color": "blue", "doi": "10.1016/0008-6223(84)90130-1", "id": "10.1016/0008-6223(84)90130-1", "infos": "{\"Key\": \"95NXPFV8\", \"Item Type\": \"journalArticle\", \"Publication Year\": 1984.0}", "label": "T. Mernagh 1984", "nb_citations": 148, "shape": "dot", "size": 24, "title": "Raman spectra of Graphon carbon black", "year": 1984 }, { "abstract": "We exfoliate graphite in both aqueous and non\u2010aqueous environments through mild sonication followed by centrifugation. The dispersions are enriched with monolayers. We mix them with polymers, followed by slow evaporation to produce optical quality composites. Nonlinear optical measurements show \u223c5% saturable absorption. The composites are then integrated into fiber laser cavities to generate 630\u2009fs pulses at 1.56\u2009\u00b5m. This shows the viability of solution phase processing for graphene based photonic devices.", "author": "T. Hasan, F. Torrisi, Zhipei Sun, D. Popa, V. Nicolosi, G. Privitera, F. Bonaccorso, A. Ferrari", "citations": "https://www.semanticscholar.org/paper/a61fa65570389667b2790563546ee1b64ab3e764", "color": "blue", "doi": "10.1002/pssb.201000339", "id": "10.1002/pssb.201000339", "infos": "{\"Key\": \"756AWVVU\", \"Item Type\": \"journalArticle\", \"Publication Year\": 2010.0}", "label": "T. Hasan 2010", "nb_citations": 182, "shape": "dot", "size": 26, "title": "Solution\u2010phase exfoliation of graphite for ultrafast photonics", "year": 2010 }, { "abstract": "We have used Raman spectroscopy to characterize a variety of carbon-containing particulate matter, including samples collected in ambient urban atmospheres. Based on the Raman spectra of known, commercial particles, we derive a simple empirical model that reflects their microchemistry and microphysics. This model gives information on the crystal size and morphology of the graphitic component, which correlates with the known characteristics of the commercial samples. We derive similar information about the graphitic component of the ambient particles, and suggest that this method might be used to characterize ambient particles systematically in the future.", "author": "S. Sze, N. Siddique, J. Sloan, R. Escribano", "citations": "https://www.semanticscholar.org/paper/dc6b270a4d0e8149f527488ca4a03884e25484b1", "color": "red", "doi": "10.1016/S1352-2310(00)00325-3", "id": "10.1016/S1352-2310(00)00325-3", "infos": "{\"Key\": \"U649GPQC\", \"Item Type\": \"journalArticle\", \"Publication Year\": 2001.0}", "label": "S. Sze 2001", "nb_citations": 195, "shape": "dot", "size": 26, "title": "Raman spectroscopic characterization of carbonaceous aerosols", "year": 2001 }, { "abstract": "Experimental conditions and mathematical fitting procedures for the collection and analysis of Raman spectra of soot and related carbonaceous materials have been investigated and optimised with a Raman microscope system operated at three different laser excitation wavelengths (514, 633, and 780 nm). Several band combinations for spectral analysis have been tested, and a combination of four Lorentzian-shaped bands (G, D1, D2, D4) at about 1580, 1350, 1620, and 1200 cm(-1), respectively, with a Gaussian-shaped band (W) at similar to 1500 cm(-1) was best suited for the first-order spectra. The second-order spectra were best fitted with Lorentzian-shaped bands at about 2450, 2700, 2900, and 3100 cm(-1). Spectral parameters (band positions, full widths at half maximum, and intensity ratios) are reported for several types of industrial carbon black (Degussa Printex, Cabot Monarch), diesel soot (particulate matter from modern heavy duty vehicle and passenger car engine exhaust, NIST SRM1650), spark-discharge soot (Palas GfG100), and graphite. Several parameters, in particular the width of the D1 band at similar to 1350 cm(-1), provide structural information and allow to discriminate the sample materials, but the characterisation and distinction of different types of soot is limited by the experimental reproducibility of the spectra and the statistical uncertainties of curve fitting. The results are discussed and compared with X-ray diffraction measurements and earlier Raman spectroscopic studies of comparable materials, where different measurement and fitting procedures had been applied.", "author": "A. Sadezky, H. Muckenhuber, H. Grothe, R. Niessner, U. P\u00f6schl", "citations": "https://www.semanticscholar.org/paper/42b700f94161dacc7abf48c4e0bb4e74053d7684", "color": "blue", "doi": "10.1016/J.CARBON.2005.02.018", "id": "10.1016/j.carbon.2005.02.018", "infos": "{\"Key\": \"9TD44Z57\", \"Item Type\": \"journalArticle\", \"Publication Year\": 2005.0}", "label": "A. Sadezky 2005", "nb_citations": 3580, "shape": "dot", "size": 139, "title": "Raman microspectroscopy of soot and related carbonaceous materials: Spectral analysis and structural information", "year": 2005 }, { "abstract": "Amorphous carbon films, deposited with the LASER-ARC technique, have been characterized using Raman scattering experiments at an excitation wavelength of 633 nm provided by a He-Ne laser. To distinguish between the homogeneous amorphous film and incorporated particles area resolved measurements have been carried out due to the laser spot diameter of 1 \u03bcm. Typical diamondlike (DLC) films, grown near room temperature, show a broad Raman band between 1000 cm\u22121 and 1800 cm\u22121 fitted very well by two gaussian distributions. Films deposited at higher substrate temperatures reveal more graphitic features in the spectra. The spectra of particles consists of a graphite-like portion originated from the graphitic structure of the particle and a diamond-like portion caused by the covering DLC film. The degree of disorder and diamond-likeness in the film structure is quantified by the peak position, the full width at half maximum (FWHM) and intensity relation of the fitted \u201cD\u201d- and \u201cG\u201d-peaks.", "author": "H. Scheibe, D. Drescher, P. Alers", "citations": "https://www.semanticscholar.org/paper/a0c42348ee83e7c5346e384c6ed896e299f2bc50", "color": "blue", "doi": "10.1007/BF00321352", "id": "10.1007/BF00321352", "infos": "{\"Key\": \"85R87SWV\", \"Item Type\": \"journalArticle\", \"Publication Year\": 1995.0}", "label": "H. Scheibe 1995", "nb_citations": 40, "shape": "dot", "size": 21, "title": "Raman characterization of amorphous carbon films", "year": 1995 }, { "abstract": "Raman spectroscopy is here shown to provide a powerful tool to differentiate between two different sp(2) carbon nanostructures (carbon nanotubes and graphene) which have many properties in common and others that differ. Emphasis is given to the richness of both carbon nanostructures as prototype examples of nanostructured materials. A glimpse toward future developments in this field is presented.", "author": "M. Dresselhaus, A. Jorio, M. Hofmann, G. Dresselhaus, R. Saito", "citations": "https://www.semanticscholar.org/paper/1456db2d1c42debd331304964b0d97a381076bbc", "color": "blue", "doi": "10.1021/nl904286r", "id": "10.1021/nl904286r", "infos": "{\"Key\": \"6I59IVWV\", \"Item Type\": \"journalArticle\", \"Publication Year\": 2010.0}", "label": "M. Dresselhaus 2010", "nb_citations": 2817, "shape": "dot", "size": 113, "title": "Perspectives on carbon nanotubes and graphene Raman spectroscopy.", "year": 2010 }, { "abstract": "Advances in the understanding of Raman processes in graphene have made it an essential tool for studying the properties of this one-atom-thick carbon material.", "author": "A. Ferrari, D. Basko", "citations": "https://www.semanticscholar.org/paper/5b175d4060f80d30f494bd8b6b32a37581d01773", "color": "blue", "doi": "10.1038/nnano.2013.46", "id": "10.1038/nnano.2013.46", "infos": "{\"Key\": \"XFM6KWZM\", \"Item Type\": \"journalArticle\", \"Publication Year\": 2013.0}", "label": "A. Ferrari 2013", "nb_citations": 5876, "shape": "dot", "size": 215, "title": "Raman spectroscopy as a versatile tool for studying the properties of graphene.", "year": 2013 }, { "abstract": "The use of Raman spectroscopy to reveal the remarkable structure and the unusual electronic and phonon properties of single wall carbon nanotubes (SWNTs) is reviewed comprehensively. The various types of Raman scattering processes relevant to carbon nanotubes are reviewed, and the theoretical foundations for these topics are presented. The most common experimental techniques used to probe carbon nanotubes are summarized, followed by a review of the novel experimental findings for each of the features in the first order and second order Raman spectra for single wall carbon nanotubes. These results are presented and discussed in connection with theoretical considerations. Raman spectra for bundles of SWNTs, for SWNTs surrounded by various common wrapping agents, and for isolated SWNTs at the single nanotube level are reviewed. Some of the current research challenges facing the field are briefly summarized.", "author": "M. Dresselhaus, G. Dresselhaus, R. Saito, A. Jorio", "citations": "https://www.semanticscholar.org/paper/3c7fcd2d18209100ccc46857bb33e9b7e1d31be2", "color": "blue", "doi": "10.1016/J.PHYSREP.2004.10.006", "id": "10.1016/j.physrep.2004.10.006", "infos": "{\"Key\": \"X3N5K3XP\", \"Item Type\": \"journalArticle\", \"Publication Year\": 2005.0}", "label": "M. Dresselhaus 2005", "nb_citations": 3318, "shape": "dot", "size": 130, "title": "Raman spectroscopy of carbon nanotubes", "year": 2005 }, { "abstract": "Dinitrophenylhydrazine (DNPH) was used to form hydrazone derivatives of carbonyl groups on glassy carbon (GC) and pyrolytic graphite surfaces. The DNPH adducts of benzoquinone and acetone have cross sections of 488 nm, much larger than those of either DNPH or the underivatized carbonyl group. The result of this enhancement is that the Raman spectrum of DNPH-modified GC is dominated by adduct features and is not sensitive to residual adsorbed reagents. In addition, resonance Raman active adducts were not formed from DNPH reactions with model compounds containing lactone, phenol, or carboxylate groups. Assuming that the cross section of surface carbonyl adducts on GC is comparable to that of the benzoquinone adduct, the detection limit for carbonyl groups on GC is less than 1% of a monolayer. The coverage of carbonyl groups increases significantly following electrochemical oxidation of both GC and highly ordered pyrolytic graphite. Analysis of the spectra of the benzoquinone/DNPH adduct permitted assignment of prominent resonance Raman and IR features and revealed that the electrons in the hydrazone linkage are delocalized extensively", "author": "Mark A. Fryling, Jun Zhao, R. McCreery", "citations": "https://www.semanticscholar.org/paper/8c1573ffb92582d7cefdc6fa73fa102cb8900003", "color": "blue", "doi": "10.1021/AC00101A026", "id": "10.1021/ac00101a026", "infos": "{\"Key\": \"QT4VF5TQ\", \"Item Type\": \"journalArticle\", \"Publication Year\": 1995.0}", "label": "Mark A. Fryling 1995", "nb_citations": 39, "shape": "dot", "size": 21, "title": "Resonance Raman Observation of Surface Carbonyl Groups on Carbon Electrodes Following Dinitrophenylhydrazine Derivatization", "year": 1995 }, { "abstract": "We present Raman spectroscopy measurements on single- and few-layer graphene flakes. By using a scanning confocal approach, we collect spectral data with spatial resolution, which allows us to directly compare Raman images with scanning force micrographs. Single-layer graphene can be distinguished from double- and few-layer by the width of the D\u0027 line: the single peak for single-layer graphene splits into different peaks for the double-layer. These findings are explained using the double-resonant Raman model based on ab initio calculations of the electronic structure and of the phonon dispersion. We investigate the D line intensity and find no defects within the flake. A finite D line response originating from the edges can be attributed either to defects or to the breakdown of translational symmetry.", "author": "D. Graf, F. Molitor, K. Ensslin, C. Stampfer, A. Jungen, C. Hierold, L. Wirtz", "citations": "https://www.semanticscholar.org/paper/d2f3ea2dd93be7f987e498168becea92b86424b1", "color": "blue", "doi": "10.1021/nl061702a", "id": "10.1021/nl061702a", "infos": "{\"Key\": \"WJ5HK4ZF\", \"Item Type\": \"journalArticle\", \"Publication Year\": 2007.0}", "label": "D. Graf 2006", "nb_citations": 2397, "shape": "dot", "size": 99, "title": "Spatially resolved Raman spectroscopy of single- and few-layer graphene.", "year": 2006 }, { "abstract": "Controlled covalent functionalization of multiwalled carbon nanotubes has been performed using Diels\u2013Alder reaction of various functional benzocyclobutene derivatives with the sp2 carbons of the tubes at appropriate reaction temperature and time. The use of polymer containing pendant benzocyclobutene produces cross-linked organic nanoclusters covalently connected to the surface of the MWNTs.", "author": "Georgios Sakellariou, H. Ji, J. Mays, N. Hadjichristidis, D. Baskaran", "citations": "https://www.semanticscholar.org/paper ateral dimensions between 150 nm and 9 \u03bcm. Silicon substrates primed with amine monolayers gave partial GO monolayers, but surfaces primed with Al13O4(OH)24(H2O)127+ ions gave densely tiled films that covered approximately 90% of the surface. When alkaline GO colloids were used, the monolayer assembly process selected the largest sheets (from 900 nm to 9 \u03bcm) from the suspension. In this case, many of the flexible sheets appeared folded in AFM images. Multilayer (GO/PAH)n films were invariably thicker than expected from the individual thicknesses of the sheets and the polymer monolayers, and this behavior is also attributed to folding...", "author": "N. Kovtyukhova, P. J. Ollivier, B. Martin, T. Mallouk, S. Chizhik, and Eugenia V. Buzaneva, A. Gorchinskiy", "citations": "https://www.semanticscholar.org/paper/c9a79d7606ad74a6a0e46f73d5dcf6f68026c30e", "color": "blue", "doi": "10.1021/CM981085U", "id": "10.1021/cm981085u", "infos": "{\"Key\": \"479FNCNG\", \"Item Type\": \"journalArticle\", \"Publication Year\": 1999.0}", "label": "N. Kovtyukhova 1999", "nb_citations": 3019, "shape": "dot", "size": 120, "title": "Layer-by-Layer Assembly of Ultrathin Composite Films from Micron-Sized Graphite Oxide Sheets and Polycations", "year": 1999 }]);

            <script type="text/javascript">
                function onNodeInteraction(params) {
                    const canva = document.getElementsByClassName('contenerCanvaAside')[0]; // Accès au premier élément
                    const className = 'generated-div';
                    const nodeId = params.nodes[0];

                    // Retrieve the title from the node attributes
                    const nodeData = network.body.data.nodes.get(nodeId); // Utiliser un autre nom pour éviter la confusion

                    // Check for existing aside element by ID
                    const existingIdenticalElement = document.getElementById(nodeId);

                    // If the existing aside is found, remove it
                    if (existingIdenticalElement) {
                        existingIdenticalElement.remove();
                    } else {
                        const existingElements = document.getElementsByClassName(className);
                        // Remove the first existing element if it exists
                        if (existingElements.length > 0) {
                            existingElements[0].remove();
                        }

                        if (!nodeId) {
                            existingElements[0].remove();
                        }

                        // Create a new aside element
                        const aside = document.createElement("aside");

                        // Add content to the aside, including the title
                        const titre = document.createElement("h1");
                        titre.classList.add("pTitle");
                        titre.textContent = `Titre de la publication : ${nodeData.title || "Titre non disponible"}`;
                        aside.appendChild(titre);

                        const author = document.createElement("p");
                        author.classList.add("pAuthor");
                        author.textContent = `Auteur(s), co-auteur(s) : ${nodeData.author || "Auteur(s) non disponible"}`;
                        aside.appendChild(author);

                        const year = document.createElement("p");
                        year.classList.add("pYear");
                        year.textContent = `Année de publication : ${nodeData.year || "Année non disponible"}`;
                        aside.appendChild(year);

                        const nb_citation = document.createElement("p");
                        nb_citation.classList("pCitation");
                        nb_citation.textContent = `Nombre de citations : ${nodeData.nb_citations}`;
                        aside.appendChild(nb_citation);

                        const abstract = document.createElement("p");
                        abstract.classList.add("pAbstract");
                        abstract.textContent = `Abstract : ${nodeData.abstract || "Abstract non disponible"}`;
                        aside.appendChild(abstract);

                        const doi = document.createElement("a");
                        doi.classList.add("pDOI");
                        doi.textContent = `DOI : ${nodeData.index || "DOI non disponible"}`;
                        doi.href = nodeData.doi || "#";  // Set the URL for the link, default to "#" if DOI not available
                        doi.target = "_blank";  // Open the link in a new tab
                        doi.rel = "noopener noreferrer";  // Security measure to prevent exploitation
                        aside.appendChild(doi);

                        aside.classList.add(className); // Add class for styling
                        aside.id = nodeId; // Assign unique ID

                        // Append the aside to the DOM
                        canva.appendChild(aside);
                        console.log(`Un nouvel aside a été créé pour ${nodeId} avec le titre "${nodeData.title || "Titre non disponible"}" publié en "${nodeData.year || "Année non disponible"}".`);
                    }

                    if (params.nodes.length > 0) {
                        console.log("Clicked node:", nodeId);
