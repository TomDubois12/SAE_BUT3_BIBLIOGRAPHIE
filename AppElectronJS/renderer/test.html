                  nodes = new vis.DataSet([{"abstract": "We report a novel phase of carbon possessing a monoclinic C2/m structure (8 atoms/cell) identified using an ab initio evolutionary structural search. This polymorph, which we call M-carbon, is related to the (2x1) reconstruction of the (111) surface of diamond and can also be viewed as a distorted (through sliding and buckling of the sheets) form of graphite. It is stable over cold-compressed graphite above 13.4 GPa. The simulated x-ray diffraction pattern and near K-edge spectroscopy are in satisfactory agreement with the experimental data [W. L. Mao, Science 302, 425 (2003)10.1126/science.1089713] on overcompressed graphite. The hardness and bulk modulus of this new carbon polymorph are calculated to be 83.1 and 431.2 GPa, respectively, which are comparable to those of diamond.", "author": "Quan Li, Yanming Ma, A. Oganov, Hongbo Wang, Hui Wang, Ying Xu, T. Cui, H. Mao, G. Zou", "color": "#97c2fc", "doi": "10.1103/physrevlett.102.175506", "id": "10.1103/physrevlett.102.175506", "isOrigin": true, "label": "Quan Li 2009", "nb_citations": 2103, "shape": "dot", "size": 48, "title": "Superhard monoclinic polymorph of carbon.", "url": "https://www.semanticscholar.org/paper/d6b981b8ae7e13215629acdb7c8830b33cc6c625", "year": 2009}, {"abstract": ": Through a systematic structural search we found an allotrope of carbon with Cmmm symmetry which we predict to be more stable than graphite for pressures above 10 GPa. This material, which we refer to as Z-carbon, is formed by pure sp(3) bonds and it provides an explanation to several features in experimental x-ray diffraction and Raman spectra of graphite under pressure. The transition from graphite to Z-carbon can occur through simple sliding and buckling of graphene sheets. Our calculations predict that Z-carbon is a transparent wide band-gap semiconductor with a hardness comparable to diamond.", "author": "M. Amsler, J. A. Flores-Livas, L. Lehtovaara, F. Balima, S. Ghase tron theory; two mechanisms are suggested: (1) the modulation of the two\u2010dimensional graphite band structures by the random interlayer perturbation, and (2) the excitonic screening. By assigning the value \u03b1=0.19 to be characteristic of carbon atoms associated with polynuclear aromatic rings, we show that the fraction of carbon in these rings in coal can be determined by the asymmetry of the C(1s) XPS line.", "author": "T. Cheung", "color": "#97c2fc", "doi": "10.1063/1.330025", "id": "10.1063/1.330025", "isOrigin": true, "label": "T. Cheung 1982", "nb_citations": 67, "shape": "dot", "size": 21, "title": "X\u2010ray photoemission of carbon: Lineshape analysis and application to studies of coals", "url": "https://www.semanticscholar.org/paper/d4c4c3f3af3fa0c693f93d9893a2fa62805f8459", "year": 1982}, {"abstract": "The elastic constants of pyrolytic graphite which has been highly ordered by annealing under compressive stress have been determined by ultrasonic, sonic resonance, and static test methods. Ultrasonic tests yielded the elastic constants c11, c12, c33, c44 = 1/s44, and the stress derivative of c33. The moduli 1/s11 and c44 were determined from the free flexural resonant vibrations of bars, and the shear modulus c44 also was determined from the fundamental torsional resonance of the bars and from the resonance of compound torsion oscillators composed of thin graphite disks with steel end pieces. Static tension, compression, and torsion tests on the pyrolytic graphite yielded a complete set of compliances (s11, s12, s13, s33, and s44). The following self\u2010consistent set of elastic constants (cij in units of 1011 dyn/cm2; sij in 10\u221211 cm2/dyn) has been deduced from the results: c11 = 106\u00b12, c12 = 18\u00b12, c33 = 3.65\u00b10.10, c13 = 1.5\u00b10.5, c44 = 0.018 to 0.035, 1/s11 = 102\u00b13, 1/s33 = 3.65\u00b10.10, s12 = \u22120.0016\u00b10.0006,...", "author": "O. L. Blakslee, D. G. Proctor, E. J. Seldin, G. B. Spence, T. Weng", "color": "#97c2fc", "doi": "10.1063/1.1659428", "id": "10.1063/1.1659428", "isOrigin": false, "label": "O. L. Blakslee 1970", "nb_citations": 236, "shape": "dot", "size": 24, "title": "Elastic Constants of Compression-Annealed Pyrolytic Graphite", "url": "https://www.semanticscholar.org/paper/b329fe58ddb9e3ea038521323d0a6ecfea5cd738", "year": 1970}, {"abstract": "Aper\u00e7u indisponible", "author": "S. M. Winder, Dongxia Liu, J. Bender", "color": "#97c2fc", "doi": "10.1016/j.carbon.2006.05.012", "id": "10.1016/j.carbon.2006.05.012", "isOrigin": false, "label": "S. M. Winder 2006", "nb_citations": 0, "shape": "dot", "size": 20, "title": "Synthesis and characterization of compound-curved graphite", "url": "https://www.semanticscholar.org/paper/cb5ff418f212f20023e742d4b7eb2c5a7be98ae4", "year": 2006}, {"abstract": "An effective computational scheme to calculate the complete set of independent elastic constants as well as other structural parameters including bulk modulus, shear modulus, Young\u0027s modulus, and Poisson\u0027s ratio for crystals is reported. The scheme is based on the stress\u2013strain analysis approach with the appropriate selection of strain governed by symmetry consideration. The first principles Vienna ab initio simulation package (VASP) is used in stress calculations. Comprehensive tests were performed for \u03b1-SiO2 and spinel MgAl2O4 with different exchange-correlation potentials, and different sets of computational parameters to investigate the relative accuracies of the calculations. A wide range of oxides, nitrides, and carbonate crystals with different crystal symmetries were chosen to test the scheme under both LDA and GGA approximations at zero temperature and pressure. Some of these calculations for large complex crystals are believed to be attempted for the first time. The calculated elastic constants show quite good agreement with the existing experimental data for almost all the examined systems with the exception of the relatively soft material such as \u03b1-SiO2 and the C14 parameter of some trigonal crystals expressed in the hexagonal form such as in \u03b1-Al2O3. Other structural properties derived from the elastic constants also show good agreements with the measured values.", "author": "Hongzhi Yao, L. Ouyang, W. Ching", "color": "#97c2fc", "doi": "10.1111/j.1551-2916.2007.01931.x", "id": "10.1111/j.1551-2916.2007.01931.x", "isOrigin": false, "label": "Hongzhi Yao 2007", "nb_citations": 0, "shape": "dot", "size": 20, "title": "Ab Initio Calculation of Elastic Constants of Ceramic Crystals", "url": "https://www.semanticscholar.org/paper/3a86ba3f93b47ad23db4870c3dd9a2d31e06240c", "year": 2007}, {"abstract": "Aper\u00e7u indisponible", "author": "S. Iijima", "color": "#97c2fc", "doi": "10.1038/354056a0", "id": "10.1038/354056a0", "isOrigin": true, "label": "S. Iijima 1991", "nb_citations": 576, "shape": "dot", "size": 29, "title": "Helical microtubules of graphitic carbon", "url": "https://www.semanticscholar.org/paper/2b1a1d5dc50c47baf35cf5a51c238caa5b07a474", "year": 1991}, {"abstract": "Caracterisation par spectrometrie XPS et AES de surfaces de carbone vitreuse apres exposition a l\u0027oxygene et au dioxyde de carbone. La decomposition chimique ulterieure est etudiee par la methode de la decomposition a temperature programmee. Cette etude permet de caracteriser la premiere etape de la gazeification et de la combustion du charbon", "author": "S. Kelemen, H. Freund", "color": "#97c2fc", "doi": "10.1021/ef00008a001", "id": "10.1021/ef00008a001", "isOrigin": true, "label": "S. Kelemen 1988", "nb_citations": 47, "shape": "dot", "size": 21, "title": "XPS Characterization of glassy-carbon surfaces oxidized by O2, CO2, and HNO3", "url": "https://www.semanticscholar.org/paper/4ffbcfb532310f55379c52c69f7ebced2fa7d39d", "year": 1988}, {"abstract": "Aper\u00e7u indisponible", "author": "S. Yumitori", "color": "#97c2fc", "doi": "10.1023/a:1004761103919", "id": "10.1023/a:1004761103919", "isOrigin": false, "la nt with experiment.", "author": "P. Sherwood", "color": "#97c2fc", "doi": "10.1039/f29767201791", "id": "10.1039/f29767201791", "isOrigin": false, "label": "P. Sherwood 1976", "nb_citations": 19, "shape": "dot", "size": 20, "title": "Analysis of the X-ray photoelectron spectra of transition metal compounds using approximate molecular orbital theories", "url": "https://www.semanticscholar.org/paper/761b2324ee5b95945dd5c9bcfc09b6d66fc94a71", "year": 1976}, {"abstract": "The cyclic voltammetry at electrodes composed of multiple electroactive materials, where zones of one highly active material are distributed over a substrate of a second, less active material, is investigated by simulation. The two materials are assumed to differ in terms of their electrochemical rate constants towards any given redox couple. For a one-electron oxidation or reduction, the effect on voltammetry of the size and relative surface coverages of the zones as well as the rate constant of the slower zone are considered for systems where it is much slower than the rate constant of the faster zones. The occurrence of split peak cyclic voltammetry where two peaks are observed in the forward sweep, is studied in terms of the diffusional effects present in the system. A number of surface geometries are compared: specifically the more active zones are modelled as long, thin bands, as steps in the surface, as discs, and as rings (similar to a partially blocked electrode). Similar voltammetry for the band, step and ring models is seen but the disc geometry shows significant differences. Finally, the simulation technique is applied to the modelling of highly-ordered pyrolytic graphite (HOPG) surface and experimental conditions under which it may be possible to observe split peak voltammetry are predicted.", "author": "Kristopher R. Ward, N. Lawrence, R. S. Hartshorne, R. Compton", "color": "#97c2fc", "doi": "10.1039/c2cp40412e", "id": "10.1039/c2cp40412e", "isOrigin": false, "label": "Kristopher R. Ward 2012", "nb_citations": 192, "shape": "dot", "size": 23, "title": "The theory of cyclic voltammetry of electrochemically heterogeneous surfaces: comparison of different models for surface geometry and applications to highly ordered pyrolytic graphite.", "url": "https://www.semanticscholar.org/paper/b35bc8bd2d6f5beeba50af92af23c62480fd805b", "year": 2012}, {"abstract": "The Nicholson\u0027s treatment for the evaluation of the heterogeneous standard rate constant k0 of electron transfer from cyclic voltammetric (CV) data is combined with the Klingler and Kochi method suitable to totally irreversible systems in order to use very large \u0394Epx n values, where n is the number of electrons involved in a simple electron-transfer process O+n e\u2212\u21ccR. An empirical relationship between the dimensionless parameter \u03a8=k0 [\u03c0DnvF/(RT)]\u22121/2 and \u0394Epx n which practically replaces the Nicholson\u0027s working curve up to about 200\u2005mV is reported.", "author": "Irma Lavagnini, R. Antiochia, F. Magno", "color": "#97c2fc", "doi": "10.1002/elan.200302851", "id": "10.1002/elan.200302851", "isOrigin": false, "label": "Irma Lavagnini 2004", "nb_citations": 305, "shape": "dot", "size": 25, "title": "An Extended Method for the Practical Evaluation of the Standard Rate Constant from Cyclic Voltammetric Data", "url": "https://www.semanticscholar.org/paper/3e69c84efd2f78844efa845ad62df72977c8d8bf", "year": 2004}, {"abstract": "The Raman spectrum of glassy carbon has been measured. Two broad lines are observed at 1340 and 1590 cm\u22121. These results are consistent with the turbostratic structure, which has been suggested for glassy carbon, with a particle size La of approximately 30 A.", "author": "M. Nathan, John E. Smith, K. Tu", "color": "#97c2fc", "doi": "10.1063/1.1663599", "id": "10.1063/1.1663599", "isOrigin": false, "label": "M. Nathan 1974", "nb_citations": 5522, "shape": "dot", "size": 75, "title": "Raman spectra of glassy carbon", "url": "https://www.s
