                  // parsing and collecting nodes and edges from the python
                  nodes = new vis.DataSet([{"abstract": "We report a novel phase of carbon possessing a monoclinic C2/m structure (8 atoms/cell) identified using an ab initio evolutionary structural search. This polymorph, which we call M-carbon, is related to the (2x1) reconstruction of the (111) surface of diamond and can also be viewed as a distorted (through sliding and buckling of the sheets) form of graphite. It is stable over cold-compressed graphite above 13.4 GPa. The simulated x-ray diffraction pattern and near K-edge spectroscopy are in satisfactory agreement with the experimental data [W. L. Mao, Science 302, 425 (2003)10.1126/science.1089713] on overcompressed graphite. The hardness and bulk modulus of this new carbon polymorph are calculated to be 83.1 and 431.2 GPa, respectively, which are comparable to those of diamond.", "author": "Quan Li, Yanming Ma, A. Oganov, Hongbo Wang, Hui Wang, Ying Xu, T. Cui, H. Mao, G. Zou", "citations": "https://www.semanticscholar.org/paper/d6b981b8ae7e13215629acdb7c8830b33cc6c625", "color": "red", "doi": "10.1103/PHYSREVLETT.102.175506", "id": "10.1103/PhysRevLett.102.175506", "infos": "{\"Key\": \"56TBVTMB\", \"Item Type\": \"journalArticle\", \"Publication Year\": 2009.0}", "isOrigin": true, "label": "Quan Li 2009", "nb_citations": 464, "shape": "dot", "size": 29, "title": "Superhard monoclinic polymorph of carbon.", "year": 2009}, {"abstract": "This article reviews the basic theoretical aspects of graphene, a one-atom-thick allotrope of carbon, with unusual two-dimensional Dirac-like electronic excitations. The Dirac electrons can be controlled by application of external electric and magnetic fields, or by altering sample geometry and/or topology. The Dirac electrons behave in unusual ways in tunneling, confinement, and the integer quantum Hall effect. The electronic properties of graphene stacks are discussed and vary with stacking order and number of layers. Edge (surface) states in graphene depend on the edge termination (zigzag or armchair) and affect the physical properties of nanoribbons. Different types of disorder modify the Dirac equation leading to unusual spectroscopic and transport properties. The effects of electron-electron and electron-phonon interactions in single layer and multilayer graphene are also presented.", "author": "A. Neto, F. Guinea, N. Peres, K. Novoselov, A.K. Geim", "citations": "https://www.semanticscholar.org/paper/777b4f88dec264cf4a39d80c8f0124ba8a2621be", "color": "blue", "doi": "10.1103/RevModPhys.81.109", "id": "10.1103/RevModPhys.81.109", "infos": "{\"Key\": \"XHTTU722\", \"Item Type\": \"journalArticle\", \"Publication Year\": 2009.0}", "isOrigin": false, "label": "A. Neto 2007", "nb_citations": 9999, "shape": "dot", "size": 110, "title": "The electronic properties of graphene", "year": 2007}, {"abstract": "The combination of Raman spectroscopy and high-pressure techniques provides a unique method for studying the mechanical and structural response of carbon-based materials. Existing Raman studies on graphite under pressure were restricted to the analysis of the so-called G band, because the Raman signal from the diamond anvils overlaps other characteristic Raman features, like the D band. Here, we present a Raman spectroscopy study of highly oriented pyrolytic graphite (HOPG) under uniaxial stress using moissanite anvils. The use of moissanite has allowed us to observe, for the first time, the evolution of the D band under extreme compression. We have employed several excitation wavelengths: 632.8, 532.0 and 488.0 nm, to further study dispersion effects. Our results have important implications on the interpretation of high-pressure Raman results on several families of carbon-based compounds.", "author": "E. Del Corro, Jes\u00fas D. Gonz\u00e1lez, M. Taravillo, W. Escoffier, V. Baonza", "citations": "https://www.semanticscholar.org/paper/0f8a429069bf90e8168c6256b846ee593e9ab47b", "color": "blue", "doi": "10.1080/08957950802444796", "id": "10.1080/08957950802444796", "infos": "{\"Key\": \"M6N8HW8Z\", \"Item Type\": \"journalArticle\", \"Publication Year\": 2008.0}", "isOrigin": false, "label": "E. Del Corro 2008", "nb_citations": 2, "shape": "dot", "size": 20, "title": "Graphite under non-hydrostatic conditions", "year": 2008}, {"abstract": "N. Rey,1 P. Toulemonde,1,2 D. Machon,1 L. Duclaux,3 S. Le Floch,1 V. Pischedda,1 J. P. Iti\u00e9,4 A.-M. Flank,4 P. Lagarde,4 W. A. Crichton,5 M. Mezouar,5 Th. Str\u00e4ssle,6 D. Sheptyakov,6 G. Montagnac,7 and A. San-Miguel1,* 1Laboratoire de Physique de la Mati\u00e8re Condens\u00e9e et Nanostructures, CNRS, UMR 5586, Universit\u00e9 Lyon 1, F-69622 Villeurbanne, France 2D\u00e9partement MCMF, Institut N\u00e9el, CNRS and Universit\u00e9 Joseph Fourier, 25 Avenue des Martyrs, Bo\u00eete Postale 166, F-38042 Grenoble Cedex 9, France 3Laboratoire de Chimie Mol\u00e9culaire et Environnement, Universit\u00e9 de Savoie-ESIGEC, Campus Scientifique de Savoie-Technolac, Le Bourget du Lac Cedex, France 4Synchrotron-SOLEIL, CNRS-UR1, Bo\u00eete Postale 48, 91192 Gif-sur-Yvette Cedex, France 5European Synchrotron Radiation Facility, rue 6 Jules Horowitz, Bo\u00eete Postale 220, 38043 Grenoble Cedex 09, France 6Laboratory for Neutron Scattering, ETH Zurich \u0026 Paul Scherrer Institut, CH-5232 Villigen PSI, Switzerland 7Laboratoire de Sciences de la Terre, UMR 5570, CNRS-ENSL-UCBL, 46 All\u00e9e d\u2019Italie, F-69364 Lyon Cedex 07, France Received 19 October 2007; revised manuscript received 23 January 2008; published 27 March 2008", "author": "N. Rey, P. Toulemonde, D. Machon, L. Duclaux, S. Floch, V. Pischedda, J. Iti\u00e9, A. Flank, P. Lagarde, W. Crichton, M. Mezouar, T. Stra\u0308ssle, D. Sheptyakov, G. Montagnac, Alfonso San-Miguel", "citations": "https://www.semanticscholar.org/paper/025b9a2d632ed0a06fe360375f54b5ac7c76e8dd", "color": "blue", "doi": "10.1103/physrevb.77.125433", "id": "10.1103/PhysRevB.77.125433", "infos": "{\"Key\": \"IZMQF2HP\", \"Item Type\": \"journalArticle\", \"Publication Year\": 2008.0}", "isOrigin": false, "label": "N. Rey 2008", "nb_citations": 3, "shape": "dot", "size": 20, "title": "High-pressure behavior of CsC 8 graphite intercalation compound : Lattice structures and phase-transition mechanism", "year": 2008}, {"abstract": "Interest in two-dimensional, sheet-like or flake-like carbon forms has expanded beyond monolayer graphene to include related materials with significant variations in layer number, lateral dimension, rotational faulting, and chemical modification. Describing this family of \u201cgraphene materials\u201d has been causing confusion in the Carbon journal and in the scientific literature as a whole. The international editorial team for Carbon believes that the time has come for a discussion on a rational naming system for two-dimensional carbon forms. We propose here a first nomenclature for two-dimensional carbons that could guide authors toward a more precise description of their subject materials, and could allow the field to move forward with a higher degree of common understanding.", "author": "A. Bianco, Hui\u2010Ming Cheng, T. Enoki, Y. Gogotsi, R. Hurt, N. Koratkar, T. Kyotani, M. Monthioux, C. Park, J. Tasc\u00f3n, Jin Zhang", "citations": "https://www.semanticscholar.org/paper/c3c5a00d854b908a4776b9b99d0f8583bc36949e", "color": "red", "doi": "10.1016/J.CARBON.2013.08.038", "id": "10.1016/j.carbon.2013.08.038", "infos": "{\"Key\": \"UBXIGCCI\", \"Item Type\": \"journalArticle\", \"Publication Year\": 2013.0}", "isOrigin": true, "label": "A. Bianco 2013", "nb_citations": 867, "shape": "dot", "size": 35.648274195994546, "title": "All in the graphene family - A recommended nomenclature for two-dimensional carbon materials", "year": 2013}, {"abstract": "calculations of the phonon density of states, Al-Jishi and Dresselha~s~~~~~ have attributed the second-order bands", "author": "Yan. Wang, D. Alsmeyer, R. McCreery", "citations": "https://www.semanticscholar.org/paper/6cec800cf9222c4a309547e87a45dbba9c32e8db", "color": "red", "doi": "10.1021/CM00011A018", "id": "10.1021/cm00011a018", "infos": "{\"Key\": \"WR77HG7I\", \"Item Type\": \"journalArticle\", \"Publication Year\": 1990.0}", "isOrigin": true, "label": "Yan. Wang 1990", "nb_citations": 1469, "shape": "dot", "size": 43.99214666862015, "title": "Raman Spectroscopy of Carbon Materials: Structural Basis of Observed Spectra", "year": 1990}, {"abstract": "The recent discovery of graphene has sparked much interest, thus far focused on the peculiar electronic structure of this material, in which charge carriers mimic massless relativistic particles(1-3). However, the physical structure of graphene - a single layer of carbon atoms densely packed in a honeycomb crystal lattice - is also puzzling. On the one hand, graphene appears to be a strictly two-dimensional material, exhibiting such a high crystal quality that electrons can travel submicrometre distances without scattering. On the other hand, perfect two-dimensional crystals cannot exist in the free state, according to both theory and experiment(4-9). This incompatibility can be avoided by arguing that all the graphene structures studied so far were an integral part of larger three-dimensional structures, either supported by a bulk substrate or embedded in a three-dimensional matrix(1-3,9-12). Here we report on individual graphene sheets freely suspended on a microfabricated scaffold in vacuum or air. These membranes are only one atom thick, yet they still display long-range crystalline order. However, our studies by transmission electron microscopy also reveal that these suspended graphene sheets are not perfectly flat: they exhibit intrinsic microscopic roughening such that the surface normal varies by several degrees and out-of-plane deformations reach 1 nm. The atomically thin single-crystal membranes offer ample scope for fundamental research and new technologies, whereas the observed corrugations in the third dimension may provide subtle reasons for the stability of two-dimensional crystals(13-15).", "author": "Jannik C. Meyer, A. Geim, M. Katsnelson, K. Novoselov, Tim Booth, S. Roth", "citations": "https://www.semanticscholar.org/paper/200c8711fed74965e3e944c635c6d4f4e88dcaf5", "color": "blue", "doi": "10.1038/nature05545", "id": "10.1038/nature05545", "infos": "{\"Key\": \"QHFGD5P7\", \"Item Type\": \"journalArticle\", \"Publication Year\": 2007.0}", "isOrigin": false, "label": "Jannik C. Meyer 2007", "nb_citations": 4506, "shape": "dot", "size": 74.80050714511076, "title": "The structure of suspended graphene sheets", "year": 2007}, {"abstract": "\u003cp\u003eSummary\u003cbr/\u003eCarbon is a unique and very versatile element which is capable of forming different architectures at the nanoscale. Over the last 20 years, new members of the carbon nanostructure family arose, and more are coming. This review provides a brief overview on carbon nanostructures ranging from C60 to graphene, passing through carbon nanotubes. It provides the reader with important definitions in carbon nanoscience and concentrates on novel one- and two-dimensional layered carbon (sp2 hybridized), including graphene and nanoribbons. This account presents the latest advances in their synthesis and characterization, and discusses new perspectives of tailoring their electronic, chemical, mechanical and magnetic properties based on defect control engineering. It is foreseen that some of the structures discussed in the review will have important applications in areas related to electronics, spintronics, composites, medicine and many others.\u003c/p\u003e", "author": "M. Terrones, A. Botello-M\u00e9ndez, J. Campos-Delgado, F. L\u00f3pez\u2010Ur\u00edas, Y. Vega-Cant\u00fa, F. Rodr\u00edguez-Macias, A. El\u00edas, E. Mu\u00f1oz-Sandoval, Abraham G. Cano-M\u00e1rquez, J. Charlier, H. Terrones", "citations": "https://www.semanticscholar.org/paper/f38a7c0910ba3a3afac797c02fef64a0d219f5af", "color": "blue", "doi": "10.1016/J.NANTOD.2010.06.010", "id": "10.1016/j.nantod.2010.06.010", "infos": "{\"Key\": \"ADMIET89\", \"Item Type\": \"journalArticle\", \"Publication Year\": 2010.0}", "isOrigin": false, "label": "M. Terrones 2010", "nb_citations": 822, "shape": "dot", "size": 34.971444766946576, "title": "Graphene and graphite nanoribbons: Morphology, properties, synthesis, defects and applications", "year": 2010}, {"abstract": "The transition from graphene to a fully disordered sp2 carbon material can be idealized by either cutting graphene into smaller and smaller pieces, or adding more and more point defects. In other words, from the dimensionality standpoint, defects in two-dimensional (2D) systems can be either one- (1D) or zero-dimensional (0D). From an application point of view, both in terms of bottom-up as well as top-down approaches, the discrimination between these two structural disorder in two-dimensional systems is urgently desired. In graphene, both types of defects produce changes in the Raman spectrum, but identifying separately the contribution from each defect-type has not yet been achieved. Here we show that a diagram can be built for disentangling contributions of point-like and line-like defects to the Raman spectra of graphene-related materials embracing, from the topology point of view, all possible structures from perfect to fully disordered sp2 bonded carbons. Two sets of graphene-related samples, produced by well-established protocols that generate either 0D or 1D defects in a controlled way, are analysed with our model and used to parameterize the limiting values of the phase space. We then discuss the limitations and apply our new methodology to analyse the structure of two-dimensional nanocarbons generated from renewable gas, used to produce inks and conducting coatings.", "author": "Luiz Gustavo Can\u00e7ado, Mateus Gomes da Silva, E. H. Martins Ferreira, F. Hof, Katerina Kampioti, Kai Huang, A. P\u00e9nicaud, Carlos Alberto Achete, R. Capaz, A. Jorio", "citations": "https://www.semanticscholar.org/paper/72ab286be29fab358cdaefce05abc1324c1aabe6", "color": "blue", "doi": "10.1088/2053-1583/aa5e77", "id": "10.1088/2053-1583/aa5e77", "infos": "{\"Key\": \"H9HESWFE\", \"Item Type\": \"journalArticle\", \"Publication Year\": 2017.0}", "isOrigin": false, "label": "Luiz Gustavo Can\u00e7ado 2017", "nb_citations": 183, "shape": "dot", "size": 24.08757091483791, "title": "Disentangling contributions of point and line defects in the Raman spectra of graphene-related materials", "year": 2017}, {"abstract": ": Through a systematic structural search we found an allotrope of carbon with Cmmm symmetry which we predict to be more stable than graphite for pressures above 10 GPa. This material, which we refer to as Z-carbon, is formed by pure sp(3) bonds and it provides an explanation to several features in experimental x-ray diffraction and Raman spectra of graphite under pressure. The transition from graphite to Z-carbon can occur through simple sliding and buckling of graphene sheets. Our calculations predict that Z-carbon is a transparent wide band-gap semiconductor with a hardness comparable to diamond.", "author": "M. Amsler, J. A. Flores-Livas, L. Lehtovaara, F. Balima, S. Ghasemi, D. Machon, S. Pailh\u00e8s, Alexander Willand, D. Caliste, S. Botti, A. Miguel, S. Goedecker, M. Marques", "citations": "https://www.semanticscholar.org/paper/859900aae66b40b3ec32af0580955f7261961753", "color": "blue", "doi": "10.1103/PHYSREVLETT.108.065501", "id": "10.1103/PhysRevLett.108.065501", "infos": "{\"Key\": \"RVIAUN5U\", \"Item Type\": \"journalArticle\", \"Publication Year\": 2012.0}", "isOrigin": false, "label": "M. Amsler 2012", "nb_citations": 216, "shape": "dot", "size": 24.73534150246384, "title": "Crystal Structure of Cold Compressed Graphite", "year": 2012}, {"abstract": "Crystalline graphite with compound curvature has been produced by precipitation of carbon from metal carbide solutions. Nearly spherical graphitic shells hundreds of microns thick have been synthesized on top of millimeter-sized spherical transition metal cores in high vacuum. Raman spectroscopy, backscatter electron diffraction and X-ray analysis shows the shell to be composed of highly crystalline graphite. Upon cooling, these graphite-like shells routinely undergo a reversible transformation in which the initially smooth surface forms striking geometric facets bounded by ridges of triangular cross section. Evaporation rates and other factors suggest that this transformation represents a phase transition from graphite composed of randomly oriented layers of graphene to fully crystalline graphite having layers in registry. (c) 2006 Elsevier Ltd. All rights reserved.", "author": "S. M. Winder, Dongxia Liu, J. Bender", "citations": "https://www.semanticscholar.org/paper/cb5ff418f212f20023e742d4b7eb2c5a7be98ae4", "color": "blue", "doi": "10.1016/J.CARBON.2006.05.012", "id": "10.1016/j.carbon.2006.05.012", "infos": "{\"Key\": \"K4TZKNZW\", \"Item Type\": \"journalArticle\", \"Publication Year\": 2006.0}", "isOrigin": false, "label": "S. M. Winder 2006", "nb_citations": 8, "shape": "dot", "size": 20.194679629823376, "title": "Synthesis and characterization of compound-curved graphite", "year": 2006}, {"abstract": "The Raman spectrum of glassy carbon has been measured. Two broad lines are observed at 1340 and 1590 cm\u22121. These results are consistent with the turbostratic structure, which has been suggested for glassy carbon, with a particle size La of approximately 30 A.", "author": "M. Nathan, John E. Smith, K. Tu", "citations": "https://www.semanticscholar.org/paper/92aca12e2a778b2244684f9f85d0d9c908bf7d7b", "color": "blue", "doi": "10.1063/1.1663599", "id": "10.1063/1.1663599", "infos": "{\"Key\": \"9RKW8G7G\", \"Item Type\": \"journalArticle\", \"Publication Year\": 1974.0}", "isOrigin": false, "label": "M. Nathan 1974", "nb_citations": 145, "shape": "dot", "size": 23.320627421358804, "title": "Raman spectra of glassy carbon", "year": 1974}, {"abstract": "Graphene-based materials exhibit remarkable electronic, optical, and mechanical properties, which has resulted in both high scientific interest and huge potential for a variety of applications. Furthermore, the family of graphene-based materials is growing because of developments in preparation methods. Raman spectroscopy is a versatile tool to identify and characterize the chemical and physical properties of these materials, both at the laboratory and mass-production scale. This technique is so important that most of the papers published concerning these materials contain at least one Raman spectrum. Thus, here, we systematically review the developments in Raman spectroscopy of graphene-based materials from both fundamental research and practical (i.e., device applications) perspectives. We describe the essential Raman scattering processes of the entire first- and second-order modes in intrinsic graphene. Furthermore, the shear, layer-breathing, G and 2D modes of multilayer graphene with different stacking orders are discussed. Techniques to determine the number of graphene layers, to probe resonance Raman spectra of monolayer and multilayer graphenes and to obtain Raman images of graphene-based materials are also presented. The extensive capabilities of Raman spectroscopy for the investigation of the fundamental properties of graphene under external perturbations are described, which have also been extended to other graphene-based materials, such as graphene quantum dots, carbon dots, graphene oxide, nanoribbons, chemical vapor deposition-grown and SiC epitaxially grown graphene flakes, composites, and graphene-based van der Waals heterostructures. These fundamental properties have been used to probe the states, effects, and mechanisms of graphene materials present in the related heterostructures and devices. We hope that this review will be beneficial in all the aspects of graphene investigations, from basic research to material synthesis and device applications.", "author": "Jiang-Bin Wu, Miao\u2010Ling Lin, Xin Cong, He-Nan Liu, P. Tan", "citations": "https://www.semanticscholar.org/paper/44f510905efea9027dfd7f587e98225798f039a3", "color": "blue", "doi": "10.1039/c6cs00915h", "id": "10.1039/C6CS00915H", "infos": "{\"Key\": \"595Z5ZLE\", \"Item Type\": \"journalArticle\", \"Publication Year\": 2018.0}", "isOrigin": false, "label": "Jiang-Bin Wu 2018", "nb_citations": 1094, "shape": "dot", "size": 38.93905816890415, "title": "Raman spectroscopy of graphene-based materials and its applications in related devices.", "year": 2018}, {"abstract": "A review of double resonance Raman spectroscopy is presented. Non-zone centre phonon modes in solids can be observed in the double resonance Raman spectra, in which weak Raman signals appear in a wide frequency region and their combination or overtone modes can be assigned. By changing the excitation laser energy, we can derive the phonon dispersion relations of a single nanotube.", "author": "Riichiro Saito, A. Gr\u00fcneis, G. Samsonidze, Victor W. Brar, G. Dresselhaus, M. Dresselhaus, A. Jorio, L. G. Can\u00e7ado, C. Fantini, M. Pimenta, A. G. S. Filho", "citations": "https://www.semanticscholar.org/paper/ffc8dfcabbcb460010f25911d15f5db6f0829fbc", "color": "blue", "doi": "10.1088/1367-2630/5/1/157", "id": "10.1088/1367-2630/5/1/157", "infos": "{\"Key\": \"299WXTKI\", \"Item Type\": \"journalArticle\", \"Publication Year\": 2003.0}", "isOrigin": false, "label": "Riichiro Saito 2003", "nb_citations": 231, "shape": "dot", "size": 25.024882836225295, "title": "Double resonance Raman spectroscopy of single-wall carbon nanotubes", "year": 2003}, {"abstract": "High sensitivity surface Raman spectroscopy was used to acquire spectra from monolayers of nitrophenyl groups covalently bonded to glassy carbon (GC) and ordered graphite. 4-Nitrophenyl radical was generated by electroreduction of 4-nitrophenyl diazonium ion in acetonitrile, then the radical covalently bonded to the carbon surface. Raman spectroscopy with a 488 nm laser and a CCD spectrograph revealed spectral features characteristic of the nitrophenyl group. Voltammetry, XPS, and Raman spectroscopic data established that the surface coverage was 6.5 x mol/cm2 on the basal plane of highly ordered pyrolytic graphite (HOPG). Electrochemical reduction of the nitrophenyl surface yielded significant spectral changes, perhaps due to formation of an amine. The similarity of the Raman results for modified HOPG and GC surface indicates that the nitrophenyl radical is quite aggressive, apparently attacking both edge plane and basal plane sites.", "author": "Yi-chun Liu, R. McCreery", "citations": "https://www.semanticscholar.org/paper/8563ce515bb737f2412c86a944c084a90ca36519", "color": "blue", "doi": "10.1021/JA00150A024", "id": "10.1021/ja00150a024", "infos": "{\"Key\": \"AQVC4XKB\", \"Item Type\": \"journalArticle\", \"Publication Year\": 1995.0}", "isOrigin": false, "label": "Yi-chun Liu 1995", "nb_citations": 262, "shape": "dot", "size": 25.614529102508047, "title": "Reactions of Organic Monolayers on Carbon Surfaces Observed with Unenhanced Raman Spectroscopy", "year": 1995}]);
