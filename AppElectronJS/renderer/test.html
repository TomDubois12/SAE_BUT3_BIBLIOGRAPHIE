and glassy carbon electrodes", "year": 1992.0}, {"abstract": NaN, "author": "Cline, K. K.; McDermott, Mark T.; McCreery, Richard L.", "color": "red", "doi": "https://pubs-acs-org.budistant.univ-orleans.fr/doi/abs/10.1021/j100071a023", "id": "10.1021/j100071a023", "infos": "{\"Key\": \"3F5FJXV4\", \"Item Type\": \"journalArticle\", \"Publication Year\": 1994.0}", "label": "10.1021/j100071a023", "shape": "dot", "size": 10, "title": "Anomalously Slow Electron Transfer at Ordered Graphite Electrodes: Influence of Electronic Factors and Reactive Sites", "year": 1994.0}, {"abstract": NaN, "author": "Rice, Ronald J.; McCreery, Richard L.", "color": "red", "doi": "http://pubs.acs.org/doi/abs/10.1021/ac00190a010", "id": "10.1021/ac00190a010", "infos": "{\"Key\": \"GBGXB2US\", \"Item Type\": \"journalArticle\", \"Publication Year\": 1989.0}", "label": "10.1021/ac00190a010", "shape": "dot", "size": 10, "title": "Quantitative relationship between electron transfer rate and surface microstructure of laser-modified graphite electrodes", "year": 1989.0}, {"abstract": "Heterogeneous electron transfer kinetics for several catechols were examined on glassy carbon (GC) electrodes in aqueous solution. Electrode preparations yielded GC surfaces with low levels of oxides or adsorbed impurities, which exhibited strong adsorption of dopamine (DA) and related catechols. Conversely, modification of GC with an organic monolayer suppressed DA adsorption and in many cases prevented electron transfer. By relating catechol adsorption to observed electron transfer, it was concluded that an adsorbed layer of catechol acts as an electrocatalyst for solution-phase redox components. Physisorbed or chemisorbed monolayers of several quinones, including duroquinone, anthraquinone, and dopamine itself, are catalytic toward dopamine oxidation and reduction, but nitrophenyl, trifluoromethylphenyl, and methylene blue monolayers severely inhibit electron transfer. The magnitude of inhibition was affected by electrostatic attraction or repulsion between the surface and the redox system, but the major factor controlling electron-transfer kinetics is not electrostatic in origin. The most plausible mechanism is \u201cself-catalysis\u201d by an adsorbed quinone, which remained adsorbed during electron transfer to a redox couple in solution. The results are inconsistent with a redox mediation mechanism involving a redox cross-reaction between adsorbed and solution quinone couples. An interaction between the adsorbed and solution quinone species during electron transfer appears to catalyze one or more of the steps in the \u201cscheme of squares\u201d mechanism for hydroquinone/quinone redox systems. The results explain a variety of observations about catechol and hydroquinone electrochemistry, as well as provide more fundamental insights into quinone electron-transfer mechanisms.", "author": "DuVall, Stacy H.; McCreery, Richard L.", "color": "red", "doi": "http://dx.doi.org/10.1021/ja000227u", "id": "10.1021/ja000227u", "infos": "{\"Key\": \"I9NVBJNU\", \"Item Type\": \"journalArticle\", \"Publication Year\": 2000.0}", "label": "10.1021/ja000227u", "shape": "dot", "size": 10, "title": "Self-catalysis by Catechols and Quinones during Heterogeneous Electron Transfer at Carbon Electrodes", "year": 2000.0}, {"abstract": "The electrochemical oxidation of dopamine, 4-methylcatechol, dihydroxyphenylacetic acid, dihydroxyphenyl ethylene glycol, and hydroquinone was examined on several native and modified glassy carbon (GC) surfaces. Treatment of polished GC with pyridine yielded small \u0394Ep values for cyclic voltammetry of all systems studied, implying fast electron-transfer kinetics. Changes in surface oxide coverage had little effect on kinetics, nor did the charge of the catechol species or the solution pH. Small \u0394Ep values correlated with catechol adsorption, and surface pretreatments that decreased adsorption also increased \u0394Ep. Electron transfer from catechols was profoundly inhibited by a monolayer of nitrophenyl or (trifluoromethyl)phenyl (TFMP) groups on the GC surface, so that voltammetric waves were not observed. The \u0394Ep increased monotonically with surface coverage of TFMP groups. The results indicate that catechol adsorption to GC is required for fast electron transfer for the redox systems studied. Unlike Ru(NH3)63+/2+, chlorpromazine, methyl viologen, and several others, electron tunneling through monolayer films was not observed for the catechols. The results are not consistent with an electron-transfer mechanism involving proton transfer or electrostatic interactions between the catechols and surface sites on the GC surface. The vital role of adsorption in the electron-transfer process is currently under study but appears to involve changes in the inner-sphere reorganization energy.", "author": "DuVall, Stacy Hunt; McCreery, Richard L.", "color": "red", "doi": "https://doi.org/10.1021/ac990399d", "id": "10.1021/ac990399d", "infos": "{\"Key\": \"64SHMCRF\", \"Item Type\": \"journalArticle\", \"Publication Year\": 1999.0}", "label": "10.1021/ac990399d", "shape": "dot", "size": 10, "title": "Control of Catechol and Hydroquinone Electron-Transfer Kinetics on Native and Modified Glassy Carbon Electrodes", "year": 1999.0}, {"abstract": "Glassy carbon (GC) surfaces modified with monolayers of biphenyl and nitrobiphenyl molecules were examined as voltammetric electrodes for ferrocene, benzoquinone, and tetracyanoquinodimethane electrochemistry in acetonitrile. The modified electrodes exhibited slower electron transfer than unmodified GC, by factors that varied with the monolayer and redox system. However, after a negative potential excursion to \u223c\u22122.0 V versus Ag+/Ag, the modified electrodes exhibited much faster electron-transfer kinetics, approaching those observed on unmodified GC. The effect is attributed to an apparently irreversible structural change in the biphenyl or nitrobiphenyl monolayer, which increases the rate of electron tunneling. The transition to the \u201cON\u201d state is associated with electron injection into the monolayer similar to that observed in previous spectroscopic investigations and causes a significant decrease in the calculated HOMO\u2212LUMO gap for the monolayer molecule. Once the monolayer is switched ON, it supports rapid electron exchange with outer-sphere redox systems, but not with dopamine, which requires adsorption to the GC surface. The increase in electron-transfer rate with electron injection is consistent with an increase in electron tunneling rate through the monolayer, caused by a significant decrease in tunneling barrier height. The ON electrode can reduce biphenyl- or nitrobiphenyldiazonium reagent in solution to permit formation of a second modification layer of biphenyl or nitrobiphenyl molecules. This \u201cdouble derivatization\u201d procedure was used to prepare tetraphenyl- and nitrotetraphenyl-modified electrodes, which exhibit significantly slower electron transfer than their biphenyl and nitrobiphenyl counterparts. A \u201cswitching\u201d electrode may have useful properties for electroanalytical applications and possibly in electrocatalysis. In addition, the ON state represents an \u201corganic electrode\u201d in which electron transfer occurs at an interface between an organic conductor and a solution rather than an interface between a solution and a metal or carbon electrode.", "author": "Solak, Ali Osman; Eichorst, Laura R.; Clark, William J.; McCreery, Richard L.", "color": "red", "doi": "https://doi.org/10.1021/ac026107h", "id": "10.1021/ac026107h", "infos": "{\"Key\": \"TA7CJ7WN\", \"Item Type\": \"journalArticle\", \"Publication Year\": 2003.0}", "label": "10.1021/ac026107h", "shape": "dot", "size": 10, "title": "Modified Carbon Surfaces as \u201cOrganic Electrodes\u201d That Exhibit Conductance Switching", "year": 2003.0}, {"abstract": "Various well-established and novel surface modification procedures were used on glassy carbon (GC) electrodes to yield surfaces with low oxide content or which lack specific oxide functional groups. In addition, monolayers of several different adsorbates were formed on GC surfaces before electrochemical evaluation. Both the nonspecific monolayer adsorbates and reagents which chemisorb to specific functional groups were observed on the surface with Raman and photoelectron spectroscopy. The various GC surfaces were then evaluated for their electron transfer reactivity with nine redox systems in aqueous electrolyte, including Ru(NH3)62+/3+, Fe(CN6)3-/4-, ascorbic acid, and Feaq3+/2+. The nine systems were categorized according to their kinetic sensitivity to surface modification. Several, including Ru(NH3)62+/3+, are insensitive to surface modifications and are considered outer sphere. Feaq3+/2+, Vaq2+/3+, and Euaq2+/3+ are catalyzed by surface carbonyl groups and are very sensitive to the removal of surface oxides or derivatization of CO groups. Ascorbic acid and Fe(CN)63-/4- constitute a third group which are not catalyzed by oxides but which do require a specific surface interaction. A procedure for classifying redox systems by their kinetics on modified carbon surfaces is proposed.", "author": "Chen, Peihong; McCreery, Richard L.", "color": "red", "doi": "http://dx.doi.org/10.1021/ac960492r", "id": "10.1021/ac960492r", "infos": "{\"Key\": \"ZFQQPH9W\", \"Item Type\": \"journalArticle\", \"Publication Year\": 1996.0}", "label": "10.1021/ac960492r", "shape": "dot", "size": 10, "title": "Control of Electron Transfer Kinetics at Glassy Carbon Electrodes by Specific Surface Modification", "year": 1996.0}, {"abstract": "Physicochemical and electrochemical characterization of carbon films obtained by pyrolyzing a commercially available photoresist has been performed. Photoresist spin-coated on to a silicon wafer was pyrolyzed at 1000 \u00b0C in a reducing atmosphere (95% nitrogen and 5% hydrogen) to produce conducting carbon films. The pyrolyzed photoresist films (PPF) show unusual surface properties compared to other carbon electrodes. The surfaces are nearly atomically smooth with a root-mean-square roughness of \u003c0.5 nm. PPF have a very low background current and oxygen/carbon atomic ratio compared to conventional glassy carbon and show relatively weak adsorption of methylene blue and anthraquinone-2,6-disulfonate. The low oxygen/carbon ratio and the relative stability of PPF indicate that surfaces may be partially hydrogen terminated. The pyrolyzed films were compared to glassy carbon (GC) heat treated under the same conditions as pyrolysis to evaluate the electroanalytical utility of PPF. Heterogeneous electron-transfer kinetics of various redox systems were evaluated. For Ru(NH3)63+/2+, Fe(CN)63-/4-, and chlorpromazine, fresh PPF surfaces show electron-transfer rates similar to those on GC, but for redox systems such as Fe3+/2+, ascorbic acid, dopamine, and oxygen, the kinetics on PPF are slower. Very weak interactions between the PPF surface and these redox systems lead to their slow electron-transfer kinetics. Electrochemical anodization results in a simultaneous increase in background current, adsorption, and electron-transfer kinetics. The PPF surfaces can be chemically modified via diazonium ion reduction to yield a covalently attached monolayer. Such a modification could help in the preparation of low-cost, high-volume analyte-specific electrodes for diverse electroanalytical applications. Overall, pyrolysis of the photoresist yields an electrode surface with properties similar to a very smooth version of glassy carbon, with some important differences in surface chemistry.", "author": "Ranganathan, Srikanth; McCreery, Richard L.", "color": "red", "doi": "https://doi.org/10.1021/ac0007534", "id": "10.1021/ac0007534", "infos": "{\"Key\": \"6BMNNT92\", \"Item Type\": \"journalArticle\", \"Publication Year\": 2001.0}", "label": "10.1021/ac0007534", "shape": "dot", "size": 10, "title": "E             const existingIdenticalElement = document.getElementById(nodeId);
            
            // If the existing aside is found, remove it
            if (existingIdenticalElement) {
                existingIdenticalElement.remove();
            } else {
                const existingElements = document.getElementsByClassName(className);
                // Remove the first existing element if it exists
                if (existingElements.length > 0) {
                    existingElements[0].remove();
                }
                
                if (!nodeId) {
                    existingElements[0].remove();
                }

                // Create a new aside element
                const aside = document.createElement("aside");

                // Add content to the aside, including the title
                const titre = document.createElement("h1");
                titre.classList.add("pTitle");
                titre.textContent = `Titre de la publication : ${nodeData.title || "Titre non disponible"}`;
                aside.appendChild(titre);
                
                const author = document.createElement("p");
                author.classList.add("pAuthor");
                author.textContent = `Auteur(s), co-auteur(s) : ${nodeData.author || "Auteur(s) non disponible"}`;
                aside.appendChild(author);
            
                const year = document.createElement("p");
                year.classList.add("pYear");
                year.textContent = `Année de publication : ${nodeData.year || "Année non disponible"}`;
                aside.appendChild(year);
            
                const abstract = document.createElement("p");
                abstract.classList.add("pAbstract");
                abstract.textContent = `Abstract : ${nodeData.abstract || "Abstract non disponible"}`;
                aside.appendChild(abstract);
                
                const doi = document.createElement("a");
                doi.classList.add("pDOI");
                doi.textContent = `DOI : ${nodeData.doi || "DOI non disponible"}`;
                doi.href = nodeData.doi || "#";  // Set the URL for the link, default to "#" if DOI not available
                doi.target = "_blank";  // Open the link in a new tab
                doi.rel = "noopener noreferrer";  // Security measure to prevent exploitation
                aside.appendChild(doi);
     
                aside.classList.add(className); // Add class for styling
                aside.id = nodeId; // Assign unique ID

                // Append the aside to the DOM
                canva.appendChild(aside);
                console.log(`Un nouvel aside a été créé pour ${nodeId} avec le titre "${nodeData.title || "Titre non disponible"}" publié en "${nodeData.year || "Année non disponible"}".`);
            }

            if (params.nodes.length > 0) {
                console.log("Clicked node:", nodeId);
                // Here you can add more functionality, like fetching data
            }
        }
        
        network.on("click", onNodeInteraction);
        network.on("hoverNode", onNodeInteraction);
    </script></div>
</div>
