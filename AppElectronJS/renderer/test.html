        <script type="text/javascript">

            function drawGraph() {
                var container = document.getElementById('mynetwork');



                // parsing and collecting nodes and edges from the python
                nodes = new vis.DataSet([{ "abstract": "Interest in two-dimensional, sheet-like or flake-like carbon forms has expanded beyond monolayer graphene to include related materials with significant variations in layer number, lateral dimension, rotational faulting, and chemical modification. Describing this family of \u201cgraphene materials\u201d has been causing confusion in the Carbon journal and in the scientific literature as a whole. The international editorial team for Carbon believes that the time has come for a discussion on a rational naming system for two-dimensional carbon forms. We propose here a first nomenclature for two-dimensional carbons that could guide authors toward a more precise description of their subject materials, and could allow the field to move forward with a higher degree of common understanding.", "author": "Bianco, Alberto; Cheng, Hui-Ming; Enoki, Toshiaki; Gogotsi, Yury; Hurt, Robert H.; Koratkar, Nikhil; Kyotani, Takashi; Monthioux, Marc; Park, Chong Rae; Tascon, Juan M. D.; Zhang, Jin", "color": "red", "doi": "https://www.sciencedirect.com/science/article/pii/S0008622313008002", "id": "10.1016/j.carbon.2013.08.038", "infos": "{\"Key\": \"UBXIGCCI\", \"Item Type\": \"journalArticle\", \"Publication Year\": 2013.0}", "label": "10.1016/j.carbon.2013.08.038", "shape": "dot", "size": 10, "title": "All in the graphene family \u2013 A recommended nomenclature for two-dimensional carbon materials", "year": 2013.0 }, { "abstract": "The recent discovery of graphene has sparked much interest, thus far focused on the peculiar electronic structure of this material, in which charge carriers mimic massless relativistic particles(1-3). However, the physical structure of graphene - a single layer of carbon atoms densely packed in a honeycomb crystal lattice - is also puzzling. On the one hand, graphene appears to be a strictly two-dimensional material, exhibiting such a high crystal quality that electrons can travel submicrometre distances without scattering. On the other hand, perfect two-dimensional crystals cannot exist in the free state, according to both theory and experiment(4-9). This incompatibility can be avoided by arguing that all the graphene structures studied so far were an integral part of larger three-dimensional structures, either supported by a bulk substrate or embedded in a three-dimensional matrix(1-3,9-12). Here we report on individual graphene sheets freely suspended on a microfabricated scaffold in vacuum or air. These membranes are only one atom thick, yet they still display long-range crystalline order. However, our studies by transmission electron microscopy also reveal that these suspended graphene sheets are not perfectly flat: they exhibit intrinsic microscopic roughening such that the surface normal varies by several degrees and out-of-plane deformations reach 1 nm. The atomically thin single-crystal membranes offer ample scope for fundamental research and new technologies, whereas the observed corrugations in the third dimension may provide subtle reasons for the stability of two-dimensional crystals(13-15).", "author": "Meyer, JC; Geim, AK; Katsnelson, MI; Novoselov, KS; Booth, TJ; Roth, S", "color": "blue", "doi": "http://apps.isiknowledge.com/full_record.do?product=WOS\u0026search_mode=AdvancedSearch\u0026qid=18\u0026SID=R2fBgh487aLhj76p8a9\u0026page=1\u0026doc=2", "id": "10.1038/nature05545", "infos": "{\"Key\": \"QHFGD5P7\", \"Item Type\": \"journalArticle\", \"Publication Year\": 2007.0}", "label": "10.1038/nature05545", "shape": "dot", "size": 10, "title": "The structure of suspended graphene sheets", "year": 2007.0 }, { "abstract": "\u003cp\u003eSummary\u003cbr/\u003eCarbon is a unique and very versatile element which is capable of forming different architectures at the nanoscale. Over the last 20 years, new members of the carbon nanostructure family arose, and more are coming. This review provides a brief overview on carbon nanostructures ranging from C60 to graphene, passing through carbon nanotubes. It provides the reader with important definitions in carbon nanoscience and concentrates on novel one- and two-dimensional layered carbon (sp2 hybridized), including graphene and nanoribbons. This account presents the latest advances in their synthesis and characterization, and discusses new perspectives of tailoring their electronic, chemical, mechanical and magnetic properties based on defect control engineering. It is foreseen that some of the structures discussed in the review will have important applications in areas related to electronics, spintronics, composites, medicine and many others.\u003c/p\u003e", "author": "Terrones, Mauricio; Botello-M\u00e9ndez, Andr\u00e9s R.; Campos-Delgado, Jessica; L\u00f3pez-Ur\u00edas, Florentino; Vega-Cant\u00fa, Yadira I.; Rodr\u00edguez-Mac\u00edas, Fernando J.; El\u00edas, Ana Laura; Mu\u00f1oz-Sandoval, Emilio; Cano-M\u00e1rquez, Abraham G.; Charlier, Jean-Christophe; Terrones, Humberto", "color": "blue", "doi": "http://www.sciencedirect.com/science/article/B82X8-50NY967-1/2/7977d5139e934d79885b87bc9724ebaf", "id": "10.1016/j.nantod.2010.06.010", "infos": "{\"Key\": \"ADMIET89\", \"Item Type\": \"journalArticle\", \"Publication Year\": 2010.0}", "label": "10.1016/j.nantod.2010.06.010", "shape": "dot", "size": 10, "title": "Graphene and graphite nanoribbons: Morphology, properties, synthesis, defects and applications", "year": 2010.0 }, { "abstract": "The transition from graphene to a fully disordered sp2 carbon material can be idealized by either cutting graphene into smaller and smaller pieces, or adding more and more point defects. In other words, from the dimensionality standpoint, defects in two-dimensional (2D) systems can be either one- (1D) or zero-dimensional (0D). From an application point of view, both in terms of bottom-up as well as top-down approaches, the discrimination between these two structural disorder in two-dimensional systems is urgently desired. In graphene, both types of defects produce changes in the Raman spectrum, but identifying separately the contribution from each defect-type has not yet been achieved. Here we show that a diagram can be built for disentangling contributions of point-like and line-like defects to the Raman spectra of graphene-related materials embracing, from the topology point of view, all possible structures from perfect to fully disordered sp2 bonded carbons. Two sets of graphene-related samples, produced by well-established protocols that generate either 0D or 1D defects in a controlled way, are analysed with our model and used to parameterize the limiting values of the phase space. We then discuss the limitations and apply our new methodology to analyse the structure of two-dimensional nanocarbons generated from renewable gas, used to produce inks and conducting coatings.", "author": "Can\u00e7ado, Luiz Gustavo; Silva, Mateus Gomes da; Ferreira, Erlon H. Martins; Hof, Ferdinand; Kampioti, Katerina; Huang, Kai; P\u00e9nicaud, Alain; Achete, Carlos Alberto; Capaz, Rodrigo B.; Jorio, Ado", "color": "blue", "doi": "https://doi.org/10.1088/2053-1583/aa5e77", "id": "10.1088/2053-1583/aa5e77", "infos": "{\"Key\": \"H9HESWFE\", \"Item Type\": \"journalArticle\", \"Publication Year\": 2017.0}", "label": "10.1088/2053-1583/aa5e77", "shape": "dot", "size": 10, "title": "Disentangling contributions of point and line defects in the Raman spectra of graphene-related materials", "year": 2017.0 }, { "abstract": "This article reviews the basic theoretical aspects of graphene, a one-atom-thick allotrope of carbon, with unusual two-dimensional Dirac-like electronic excitations. The Dirac electrons can be controlled by application of external electric and magnetic fields, or by altering sample geometry and/or topology. The Dirac electrons behave in unusual ways in tunneling, confinement, and the integer quantum Hall effect. The electronic properties of graphene stacks are discussed and vary with stacking order and number of layers. Edge (surface) states in graphene depend on the edge termination (zigzag or armchair) and affect the physical properties of nanoribbons. Different types of disorder modify the Dirac equation leading to unusual spectroscopic and transport properties. The effects of electron-electron and electron-phonon interactions in single layer and multilayer graphene are also presented.", "author": "Castro Neto, A. H.; Guinea, F.; Peres, N. M. R.; Novoselov, K. S.; Geim, A. K.", "color": "blue", "doi": "http://link.aps.org/doi/10.1103/RevModPhys.81.109", "id": "10.1103/RevModPhys.81.109", "infos": "{\"Key\": \"XHTTU722\", \"Item Type\": \"journalArticle\", \"Publication Year\": 2009.0}", "label": "10.1103/RevModPhys.81.109", "shape": "dot", "size": 10, "title": "The electronic properties of graphene", "year": 2009.0 }, { "abstract": "This review on graphene, a one-atom thick, two-dimensional sheet of carbon atoms, starts with a general description of the graphene electronic structure as well as a basic experimental toolkit for identifying and handling this material. Owing to the versatility of graphene properties and projected applications, several production techniques are summarized, ranging from the mechanical exfoliation of high-quality graphene to the direct growth on carbides or metal substrates and from the chemical routes using graphene oxide to the newly developed approach at the molecular level. The most promising and appealing properties of graphene are summarized from an exponentially growing literature, with a particular attention to matching production methods to characteristics and to applications. In particular, we report on the high carrier mobility value in suspended and annealed samples for electronic devices, on the thickness-dependent optical transparency and, in the mechanical section, on the high robustness and full integration of graphene in sensing device applications. Finally, we emphasize on the high potential of graphene not only as a post-silicon materials for CMOS device application but more ambitiously as a platform for post-CMOS molecular architecture in electronic information processing.", "author": "Soldano, Caterina; Mahmood, Ather; Dujardin, Erik", "color": "blue", "doi": "http://www.sciencedirect.com/science/article/pii/S0008622310000928", "id": "10.1016/j.carbon.2010.01.058", "infos": "{\"Key\": \"PMBKDWMC\", \"Item Type\": \"journalArticle\", \"Publication Year\": 2010.0}", "label": "10.1016/j.carbon.2010.01.058", "shape": "dot", "size": 10, "title": "Production, properties and potential of graphene", "year": 2010.0 }, { "abstract": "We report a novel phase of carbon possessing a monoclinic C2/m structure (8 atoms/cell) identified using an ab initio evolutionary structural search. This polymorph, which we call M-carbon, is related to the (2x1) reconstruction of the (111) surface of diamond and can also be viewed as a distorted (through sliding and buckling of the sheets) form of graphite. It is stable over cold-compressed graphite above 13.4 GPa. The simulated x-ray diffraction pattern and near K-edge spectroscopy are in satisfactory agreement with the experimental data [W. L. Mao , Science 302, 425 (2003)] on overcompressed graphite. The hardness and bulk modulus of this new carbon polymorph are calculated to be 83.1 and 431.2 GPa, respectively, which are comparable to those of diamond.", "author": "Li, Q; Ma, YM; Oganov, AR; Wang, HB; Wang, H; Xu, Y; Cui, T; Mao, HK; Zou, GT", "color": "red", "doi": "http://apps.isiknowledge.com/full_record.do?product=WOS\u0026search_mode=AdvancedSearch\u0026qid=178\u0026SID=P2Mj6Ejfic43ddho6g8\u0026page=1\u0026doc=1", "id": "10.1103/PhysRevLett.102.175506", "infos": "{\"Key\": \"56TBVTMB\", \"Item Type\": \"journalArticle\", \"Publication Year\": 2009.0}", "label": "10.1103/PhysRevLett.102.175506", "shape": "dot", "size": 10, "title": "Superhard Monoclinic Polymorph of Carbon", "year": 2009.0 }, { "abstract": "Through a systematic structural search we found an allotrope of carbon with Cmmm symmetry which we predict to be more stable than graphite for pressures above 10 GPa. This material, which we refer to as Z-carbon, is formed by pure sp3 bonds and it provides an explanation to several features in experimental x-ray diffraction and Raman spectra of graphite under pressure. The transition from graphite to Z-carbon can occur through simple sliding and buckling of graphene sheets. Our calculations predict that Z-carbon is a transparent wide band-gap semiconductor with a hardness comparable to diamond.", "author": "Amsler, Maximilian; Flores-Livas, Jos\u00e9 A.; Lehtovaara, Lauri; Balima, Felix; Ghasemi, S. Alireza; Machon, Denis; Pailh\u00e8s, St\u00e9phane; Willand, Alexander; Caliste, Damien; Botti, Silvana; San Miguel, Alfonso; Goedecker, Stefan; Marques, Miguel A. L.", "color": "blue", "doi": "http://link.aps.org/doi/10.1103/PhysRevLett.108.065501", "id": "10.1103/PhysRevLett.108.065501", "infos": "{\"Key\": \"RVIAUN5U\", \"Item Type\": \"journalArticle\", \"Publication Year\": 2012.0}", "label": "10.1103/PhysRevLett.108.065501", "shape": "dot", "size": 10, "title": "Crystal Structure of Cold Compressed Graphite", "year": 2012.0 }, { "abstract": "The combination of Raman spectroscopy and high-pressure techniques provides a unique method for studying the mechanical and structural response of carbon-based materials. Existing Raman studies on graphite under pressure were restricted to the analysis of the so-called G band, because the Raman signal from the diamond anvils overlaps other characteristic Raman features, like the D band. Here, we present a Raman spectroscopy study of highly oriented pyrolytic graphite (HOPG) under uniaxial stress using moissanite anvils. The use of moissanite has allowed us to observe, for the first time, the evolution of the D band under extreme compression. We have employed several excitation wavelengths: 632.8, 532.0 and 488.0nm, to further study dispersion effects. Our results have important implications on the interpretation of high-pressure Raman results on several families of carbon-based compounds.", "author": "del Corro, E; Gonzalez, J; Taravillo, M; Escoffier, W; Baonza, VG", "color": "blue", "doi": "http://apps.isiknowledge.com/full_record.do?product=WOS\u0026search_mode=AdvancedSearch\u0026qid=825\u0026SID=Z1f6aokMhch58fHAAog\u0026page=1\u0026doc=1", "id": "10.1080/08957950802444796", "infos": "{\"Key\": \"M6N8HW8Z\", \"Item Type\": \"journalArticle\", \"Publication Year\": 2008.0}", "label": "10.1080/08957950802444796", "shape": "dot", "size": 10, "title": "Graphite under non-hydrostatic conditions", "year": 2008.0 }, { "abstract": "The high-pressure phase diagram of CsC8 graphite intercalation compound has been investigated at ambient temperature up to 32 GPa. Combining x-ray and neutron diffraction and Raman and x-ray absorption spectroscopies, we report that CsC8 when pressurized undergoes phase transitions around 2.0, 4.8, and 8 GPa. Possible candidate lattice structures and the transition mechanism involved are proposed. We show that the observed transitions involve structural rearrangements in the Cs subnetwork, while the distance between the graphitic layers is continuously reduced at least up to 8.9 GPa. Around 8 GPa, important modifications of signatures of the electronic structure measured by Raman and x-ray absorption spectroscopies evidence the onset of a transition which could imply a change of stage. Finally, we also provide the c-axis compressibility of CsC8 between 0 and 8.9 GPa.", "author": "Rey, N; Toulemonde, P; Machon, D; Duclaux, L; Le Floch, S; Pischedda, V; Itie, JP; Flank, AM; Lagarde, P; Crichton, WA; Mezouar, M; Strassle, T; Sheptyakov, D; Montagnac, G; San-Miguel, A", "color": "blue", "doi": "http://apps.isiknowledge.com/full_record.do?product=WOS\u0026search_mode=AdvancedSearch\u0026qid=1\u0026SID=Z197Oc4bOo@lOpP371k\u0026page=1\u0026doc=1", "id": "10.1103/PhysRevB.77.125433", "infos": "{\"Key\": \"IZMQF2HP\", \"Item Type\": \"journalArticle\", \"Publication Year\": 2008.0}", "label": "10.1103/PhysRevB.77.125433", "shape": "dot", "size": 10, "title": "High-pressure behavior of CsC8 graphite intercalation compound: Lattice structures and phase-transition mechanism", "year": 2008.0 }, { "abstract": "Crystalline graphite with compound curvature has been produced by precipitation of carbon from metal carbide solutions. Nearly spherical graphitic shells hundreds of microns thick have been synthesized on top of millimeter-sized spherical transition metal cores in high vacuum. Raman spectroscopy, backscatter electron diffraction and X-ray analysis shows the shell to be composed of highly crystalline graphite. Upon cooling, these graphite-like shells routinely undergo a reversible transformation in which the initially smooth surface forms striking geometric facets bounded by ridges of triangular cross section. Evaporation rates and other factors suggest that this transformation represents a phase transition from graphite composed of randomly oriented layers of graphene to fully crystalline graphite having layers in registry. (c) 2006 Elsevier Ltd. All rights reserved.", "author": "Winder, SM; Liu, DX; Bender, JW", "color": "blue", "doi": "http://apps.isiknowledge.com/full_record.do?product=WOS\u0026search_mode=AdvancedSearch\u0026qid=510\u0026SID=Z1f6aokMhch58fHAAog\u0026page=1\u0026doc=1", "id": "10.1016/j.carbon.2006.05.012", "infos": "{\"Key\": \"K4TZKNZW\", \"Item Type\": \"journalArticle\", \"Publication Year\": 2006.0}", "label": "10.1016/j.carbon.2006.05.012", "shape": "dot", "size": 10, "title": "Synthesis and characterization of compound-curved graphite", "year": 2006.0 }, { "abstract": "In order to accommodate an increasing demand for glassy carbon products with tailored characteristics, one has to understand the origin of their structure-related properties. In this work, through the use of high-resolution transmission electron microscopy, Raman spectroscopy, and electron energy loss spectroscopy it has been demonstrated that the structure of glassy carbon at different stages of the carbonization process resembles the curvature observed in fragments of nanotubes, fullerenes, or nanoonions. The measured nanoindentation hardness and reduced Young\u2019s modulus change as a function of the pyrolysis temperature from the range of 600\u20132500 \u00b0C and reach maximum values for carbon pyrolyzed at around 1000 \u00b0C. Essentially, the highest values of the mechanical parameters for glassy carbon manufactured at that temperature can be related to the greatest amount of non-planar sp 2 -hybridized carbon atoms involved in the formation of curved graphene-like layers. Such complex labyrinth-like structure with sp 2 -type bonding would be rigid and hard to break that explains the glassy carbon high strength and hardness.", "author": "Jurkiewicz, K.; Pawlyta, M.; Zygad\u0142o, D.; Chrobak, D.; Duber, S.; Wrzalik, R.; Ratuszna, A.; Burian, A.", "color": "blue", "doi": "https://doi.org/10.1007/s10853-017-1753-7", "id": "10.1007/s10853-017-1753-7", "infos": "{\"Key\": \"QE6QTHM5\", \"Item Type\": \"journalArticle\", \"Publication Year\": 2018.0}", "label": "10.1007/s10853-017-1753-7", "shape": "dot", "size": 10, "title": "Evolution of glassy carbon under heat treatment: correlation structure\u2013mechanical properties", "year": 2018.0 }, { "abstract": "Porous carbons that are three-dimensionally periodic on the scale of optical wavelengths were made by a synthesis route resembling the geological formation of natural opal. Porous silica opal crystals were sintered to form an intersphere interface through which the silica was removed after infiltration with carbon or a carbon precursor. The resulting porous carbons had different structures depending on synthesis conditions. Both diamond and glassy carbon inverse opals resulted from volume filling. Graphite inverse opals, comprising 40-angstrom-thick layers of graphite sheets tiled on spherical surfaces, were produced by surface templating. The carbon inverse opals provide examples of both dielectric and metallic optical photonic crystals. They strongly diffract light and may provide a route toward photonic band-gap materials.", "author": "Zakhidov, Anvar A.; Baughman, Ray H.; Iqbal, Zafar; Cui, Changxing; Khayrullin, Ilyas; Dantas, Socrates O.; Marti, Jordi; Ralchenko, Victor G.", "color": "red", "doi": "https://science-sciencemag-org.budistant.univ-orleans.fr/content/282/5390/897", "id": "10.1126/science.282.5390.897", "infos": "{\"Key\": \"JJMCPXHX\", \"Item Type\": \"journalArticle\", \"Publication Year\": 1998.0}", "label": "10.1126/science.282.5390.897", "shape": "dot", "size": 10, "title": "Carbon Structures with Three-Dimensional Periodicity at Optical Wavelengths", "year": 1998.0 }, { "abstract": NaN, "author": "Wang, Yan; Alsmeyer, Daniel C.; McCreery, Richard L.", "color": "red", "doi": "http://dx.doi.org/10.1021/cm00011a018", "id": "10.1021/cm00011a018", "infos": "{\"Key\": \"WR77HG7I\", \"Item Type\": \"journalArticle\", \"Publication Year\": 1990.0}", "label": "10.1021/cm00011a018", "shape": "dot", "size": 10, "title": "Raman spectroscopy of carbon materials: structural basis of observed spectra", "year": 1990.0 }, { "abstract": NaN, "author": "Nathan, Marshall I.", "color": "red", "doi": "http://scitation.aip.org/content/aip/journal/jap/45/5/10.1063/1.1663599", "id": "10.1063/1.1663599", "infos": "{\"Key\": \"9RKW8G7G\", \"Item Type\": \"journalArticle\", \"Publication Year\": 1974.0}", "label": "10.1063/1.1663599", "shape": "dot", "size": 10, "title": "Raman spectra of glassy carbon", "year": 1974.0 }, { "abstract": NaN, "author": "Wu, Jiang-Bin; Lin, Miao-Ling; Cong, Xin; Liu, He-Nan; Tan, Ping-Heng", "color": "blue", "doi": "http://pubs.rsc.org/en/content/articlelanding/2018/cs/c6cs00915h", "id": "10.1039/C6CS00915H", "infos": "{\"Key\": \"595Z5ZLE\", \"Item Type\": \"journalArticle\", \"Publication Year\": 2018.0}", "label": "10.1039/C6CS00915H", "shape": "dot", "size": 10, "title": "Raman spectroscopy of graphene-based materials and its applications in related devices", "year": 2018.0 }, { "abstract": NaN, "author": "Saito, R; Gr\u00fcneis, A; Samsonidze, Ge G; Brar, V W; Dresselhaus, G; Dresselhaus, M S; Jorio, A; Can\u00e7ado, L G; Fantini, C; Pimenta, M A; Filho, A G Souza", "color": "blue", "doi": "http://iopscience.iop.org/1367-2630/5/1/157", "id": "10.1088/1367-2630/5/1/157", "infos": "{\"Key\": \"299WXTKI\", \"Item Type\": \"journalArticle\", \"Publication Year\": 2003.0}", "label": "10.1088/1367-2630/5/1/157", "shape": "dot", "size": 10, "title": "Double resonance Raman spectroscopy of single-wall carbon nanotubes", "year": 2003.0 }, { "abstract": NaN, "author": "Liu, Yi-Chun; McCreery, Richard L.", "color": "red", "doi": "http://dx.doi.org/10.1021/ja00150a024", "id": "10.1021/ja00150a024", "infos": "{\"Key\": \"AQVC4XKB\", \"Item Type\": \"journalArticle\", \"Publication Year\": 1995.0}", "label": "10.1021/ja00150a024", "shape": "dot", "size": 10, "title": "Reactions of Organic Monolayers on Carbon Surfaces Observed with Unenhanced Raman Spectroscopy", "year": 1995.0 }, { "abstract": NaN, "author": "Martins Ferreira, E. H.", "color": "blue", "doi": NaN, "id": "10.1103/PhysRevB.82.125429", "infos": "{\"Key\": \"SD6Q5J26\", \"Item Type\": \"journalArticle\", \"Publication Year\": 2010.0}", "label": "10.1103/PhysRevB.82.125429", "shape": "dot", "size": 10, "title": "Evolution of the Raman spectra from single-, few-, and many-layer graphene with increasing disorder", "year": 2010.0 }, { "abstract": NaN, "author": "Branca, C.; Frusteri, F.; Magaz\u00f9, V.; Mangione, A.", "color": "red", "doi": "https://pubs-acs-org.budistant.univ-orleans.fr/doi/abs/10.1021/jp0372183", "id": "10.1021/jp0372183", "infos": "{\"Key\": \"INCW39BX\", \"Item Type\": \"journalArticle\", \"Publication Year\": 2004.0}", "label": "10.1021/jp0372183", "shape": "dot", "size": 10, "title": "Characterization of Carbon Nanotubes by TEM and Infrared Spectroscopy", "year": 2004.0 }, { "abstract": NaN, "author": "Cheung, T. T. P.", "color": "red", "doi": "http://aip.scitation.org/doi/10.1063/1.330025", "id": "10.1063/1.330025", "infos": "{\"Key\": \"2CXY33YA\", \"Item Type\": \"journalArticle\", \"Publication Year\": 1982.0}", "label": "10.1063/1.330025", "shape": "dot", "size": 10, "title": "X\u2010ray photoemission of carbon: Lineshape analysis and application to studies of coals", "year": 1982.0 }, { "abstract": NaN, "author": "Iijima, Sumio", "color": "red", "doi": "http://dx.doi.org/10.1038/354056a0", "id": "10.1038/354056a0", "infos": "{\"Key\": \"VEDXAWWU\", \"Item Type\": \"journalArticle\", \"Publication Year\": 1991.0}", "label": "10.1038/354056a0", "shape": "dot", "size": 10, "title": "Helical microtubules of graphitic carbon", "year": 1991.0 }, { "abstract": NaN, "author": "Katz, Eugenii; Willner, Itamar", "color": "red", "doi": "https://onlinelibrary-wiley-com.ezproxy.univ-orleans.fr/doi/abs/10.1002/cphc.200400193", "id": "10.1002/cphc.200400193", "infos": "{\"Key\": \"9ZAJS8BE\", \"Item Type\": \"journalArticle\", \"Publication Year\": 2004.0}", "label": "10.1002/cphc.200400193", "shape": "dot", "size": 10, "title": "Biomolecule\u2010Functionalized Carbon Nanotubes: Applications in Nanobioelectronics", "year": 2004.0 }, { "abstract": NaN, "author": "Wood, Jonathan R.; Frogley, Mark D.; Meurs, Erwin R.; Prins, Andrew D.; Peijs, Ton; Dunstan, David J.; Wagner, H. Daniel", "color": "blue", "doi": "http://dx.doi.org/10.1021/jp992136t", "id": "10.1021/jp992136t", "infos": "{\"Key\": \"P23AGKI8\", \"Item Type\": \"journalArticle\", \"Publication Year\": 1999.0}", "label": "10.1021/jp992136t", "shape": "dot", "size": 10, "title": "Mechanical Response of Carbon Nanotubes under Molecular and Macroscopic Pressures", "year": 1999.0 }, { "abstract": NaN, "author": "Koenig, Steven P.; Boddeti, Narasimha G.; Dunn, Martin L.; Bunch, J. Scott", "color": "blue", "doi": "http://dx.doi.org/10.1038/nnano.2011.123", "id": "10.1038/nnano.2011.123", "infos": "{\"Key\": \"2PDI89PA\", \"Item Type\": \"journalArticle\", \"Publication Year\": 2011.0}", "label": "10.1038/nnano.2011.123", "shape": "dot", "size": 10, "title": "Ultrastrong adhesion of graphene membranes", "year": 2011.0 }, { "abstract": NaN, "author": "Tasis, Dimitrios; Tagmatarchis, Nikos; Bianco, Alberto; Prato, Maurizio", "color": "red", "doi": "http://dx.doi.org/10.1021/cr050569o", "id": "10.1021/cr050569o", "infos": "{\"Key\": \"G98JRHBI\", \"Item Type\": \"journalArticle\", \"Publication Year\": 2006.0}", "label": "10.1021/cr050569o", "shape": "dot", "size": 10, "title": "Chemistry of Carbon Nanotubes", "year": 2006.0 }, { "abstract": NaN, "author": "Mecklenburg, Matthias; Schuchardt, Arnim; Mishra, Yogendra Kumar; Kaps, S\u00f6ren; Adelung, Rainer; Lotnyk, Andriy; Kienle, Lorenz; Schulte, Karl", "color": "red", "doi": "http://onlinelibrary.wiley.com/doi/10.1002/adma.201200491/abstract", "id": "10.1002/adma.201200491", "infos": "{\"Key\": \"HBDRJ6F9\", \"Item Type\": \"journalArticle\", \"Publication Year\": 2012.0}", "label": "10.1002/adma.201200491", "shape": "dot", "size": 10, "title": "Aerographite: Ultra Lightweight, Flexible Nanowall, Carbon Microtube Material with Outstanding Mechanical Performance", "year": 2012.0 }, { "abstract": NaN, "author": "Bahr, Jeffrey L.; Tour, James M.", "color": "blue", "doi": "http://dx.doi.org/10.1021/cm0109903", "id": "10.1021/cm0109903", "infos": "{\"Key\": \"T3T7FHUC\", \"Item Type\": \"journalArticle\", \"Publication Year\": 2001.0}", "label": "10.1021/cm0109903", "shape": "dot", "size": 10, "title": "Highly Functionalized Carbon Nanotubes Using in Situ Generated Diazonium Compounds", "year": 2001.0 }, { "abstract": NaN, "author": "Duan, R.-G.; Mukherjee, A. K.", "color": "blue", "doi": "http://onlinelibrary.wiley.com/doi/10.1002/adma.200306564/abstract", "id": "10.1002/adma.200306564", "infos": "{\"Key\": \"PUSKPM43\", \"Item Type\": \"journalArticle\", \"Publication Year\": 2004.0}", "label": "10.1002/adma.200306564", "shape": "dot", "size": 10, "title": "Synthesis of SiCNO Nanowires Through Heat-Treatment of Polymer-Functionalized Single-Walled Carbon Nanotubes", "year": 2004.0 }, { "abstract": "The results of studies of physical properties such as density, electrical and thermal conductivity, bending strength and elastic modulus for glassy carbon are presented as a function of its heattreatment temperature. The diameters of aromatic planes as estimated from X-ray diffraction patterns are included. It is found that glassy carbon is resistant to thermal shock and to oxidizing agents, and is useful in many fields of industry. Its various applications are briefly summarized.", "author": "Yamada, S; Sato, H; Ishii, T", "color": "red", "doi": "http://www.sciencedirect.com/science/article/pii/0008622364900399", "id": "10.1016/0008-6223(64)90039-9", "infos": "{\"Key\": \"JXH76KA2\", \"Item Type\": \"journalArticle\", \"Publication Year\": 1964.0}", "label": "10.1016/0008-6223(64)90039-9", "shape": "dot", "size": 10, "title": "Eigenschaften und Verwendung von glasartigem Kohlenstoff", "year": 1964.0 }, { "abstract": "An XPS study of anodic oxidized glass-like carbon (GC) was conducted in order to investigate the inconsistency between O1s/C1s and oxygen concentration (Ocal.) calculated from the curve fitting results of the C1s spectrum. Consideration of the asymmetric peak shape of the C1s spectrum is normally done in order to obtain precise curve fitting results. However, it was found that the 2nd-carbon peak should also be taken into consideration in the curve fitting process in addition to the effect of asymmetric peak shape of carbon to obtain a consistent value of O1s/C1s. The 2nd graphitic peak is normally located +0.7\u2013+0.8 eV away from the original C1s spectrum. The ratio of the 2nd graphitic peak area in the C1s spectrum increased as the electrical charge increased. However, the peak shapes of C1s spectra of anodic oxidized GC after heat treatment at 1500 \u00b0C in argon atmosphere were almost the same as the C1s of untreated GC. Although the origin of the 2nd graphitic peak is not well understood, it may be related to the amount of oxygen on the GC surface.", "author": "Yumitori, Shuji", "color": "blue", "doi": "https://doi.org/10.1023/A:1004761103919", "id": "10.1023/A:1004761103919", "infos": "{\"Key\": \"B4B5A9LW\", \"Item Type\": \"journalArticle\", \"Publication Year\": 2000.0}", "label": "10.1023/A:1004761103919", "shape": "dot", "size": 10, "title": "Correlation of C1s chemical state intensities with the O1s intensity in the XPS analysis of anodically oxidized glass-like carbon samples", "year": 2000.0 }, { "abstract": "Raman spectra, phenanthrenequinone adsorption, differential capacitance and scanning electron micrographs on fractured and polished glassy carbon (GC) surfaces were monitored before and after pulsed laser irradiation of varying power density. At power densities below 30 MW / cm2, the Raman spectra, \u0393PQ, Cdlo and SEM appearance of polished surfaces changed slightly with laser activation. However, the Raman spectra of fractured GC indicated increased disorder during laser irradiation. After vigorous laser treatment, the Raman spectrum became similar to that of the polished surface, but \u0393 and Cdlo on the fractured surface did not change greatly at power densities below 30 MW / cm2. At higher power densities, both polished and fractured surfaces showed significantly higher \u0393PQ and Cdlo, and the SEMs showed evidence of local melting. After 70 MW / cm2 laser treatment, the fractured and polished surfaces were quite similar. The results support a mechanism based on thermomechanical shock below about 30 MW / cm2 and local melting above this threshold.", "author": "Pontikos, Nicholas M.; McCreery, Richard L.", "color": "blue", "doi": "http://www.sciencedirect.com/science/article/pii/0022072892800489", "id": "10.1016/0022-0728(92)80048-9", "infos": "{\"Key\": \"S38UQ8CL\", \"Item Type\": \"journalArticle\", \"Publication Year\": 1992.0}", "label": "10.1016/0022-0728(92)80048-9", "shape": "dot", "size": 10, "title": "Microstructural and morphological changes induced in glassy carbon electrodes by laser irradiation", "year": 1992.0 }, { "abstract": "Surface oxidation and/or corrosion behavior of glass-like carbons (GLCs) in concentrated H2SO4, HNO3 and H2O2 aq. were investigated with scanning electron microscopy (SEM), X-ray photoelectron spectroscopy (XPS) and by weight changes. With GLCs treated in H2SO4, formation of sulfur-containing chemical species was observed, with some weight gain. However, no change was observed in morphology. With the samples treated in HNO3, the weight initially increased and, then, decreased. No nitrogen-containing chemical species were observed. Crack formation and scaling off of the upper layers were observed. With the samples treated in H2O2 aq., rapid weight loss and void formation were observed.", "author": "Nakamura, Kazumasa; Morooka, Hiroki; Tanabe, Yasuhiro; Yasuda, Eiichi; Akatsu, Takashi; Shindo, Hitoshi", "color": "blue", "doi": "http://www.sciencedirect.com/science/article/pii/S0010938X11004161", "id": "10.1016/j.corsci.2011.08.004", "infos": "{\"Key\": \"I8GSNX8Q\", \"Item Type\": \"journalArticle\", \"Publication Year\": 2011.0}", "label": "10.1016/j.corsci.2011.08.004", "shape": "dot", "size": 10, "title": "Surface oxidation and/or corrosion behavior of glass-like carbon in sulfuric and nitric acids, and in aqueous hydrogen peroxide", "year": 2011.0 }, { "abstract": "Electrochemical properties of glassy carbon electrodes of two types were examined, one thermally treated at 1000\u00b0C (sample K) and another thermally treated at 2500\u00b0 (sample G). Mechanically polished or electrochemically polarized electrodes were characterized in NaOH, HClO4 and H2SO4 solutions by cyclic voltammetry (cv) at different sweep rates in the potential range between the hydrogen and oxygen evolution. The activity of the electrodes depended on the properties of the glassy carbon examined, as determined by both the temperature of thermal treatment and the mechanical or electrochemical pretreatment of the sample. It was noticed that both types of electrodes, when polished exhibited an increase in the double layer charge upon increasing the pH value of the solution. The cv charges, for both types of samples, increase upon anodic polarization. The higher the potential of oxidation, the more pronounced is the increase in charge, particularly in acidic solution. The increase in charge amounts from below 1 mC cm\u22122 for polished glassy carbon up to few hundreds of mC cm\u22122 for surfaces anodically polarized in acidic solution. Analysis of the dependence of voltammetric charge, as well as morphological changes of the electrode surface, on the time of oxidation suggests the existence of three stages in the electrochemical activation process. The first one occurs only once at the beginning of the activation, while the other two repeat themselves, reflecting a periodical activation and deactivation process. These stages were discussed and ascribed to a surface layer oxidation, graphite oxide layer growth and mechanical destruction of the surface. Independent surface analysis by AES, XPS and STM confirms the results obtained by electrochemical methods.", "author": "Dekanski, Aleksandar; Stevanovi\u0107, Jasna; Stevanovi\u0107, Rade; Nikoli\u0107, Branislav \u017d; Jovanovi\u0107, Vladislava M", "color": "blue", "doi": "http://www.sciencedirect.com/science/article/pii/S0008622300002281", "id": "10.1016/S0008-6223(00)00228-1", "infos": "{\"Key\": \"I8JCEFD6\", \"Item Type\": \"journalArticle\", \"Publication Year\": 2001.0}", "label": "10.1016/S0008-6223(00)00228-1", "shape": "dot", "size": 10, "title": "Glassy carbon electrodes: I. Characterization and electrochemical activation", "year": 2001.0 }, { "abstract": NaN, "author": "Zinn, A. S.; Schiferl, D.; Nicol, M. F.", "color": "blue", "doi": "http://link.aip.org/link/JCPSA6/v87/i2/p1267/s1\u0026Agg=doi", "id": "10.1063/1.453310", "infos": "{\"Key\": \"6XIT3DFD\", \"Item Type\": \"journalArticle\", \"Publication Year\": 1987.0}", "label": "10.1063/1.453310", "shape": "dot", "size": 10, "title": "Raman spectroscopy and melting of nitrogen between 290 and 900 K and 2.3 and 18 GPa", "year": 1987.0 }, { "abstract": NaN, "author": "Kelemen, S. R.; Freund, H.", "color": "blue", "doi": "https://pubs-acs-org.budistant.univ-orleans.fr/doi/abs/10.1021/ef00008a001", "id": "10.1021/ef00008a001", "infos": "{\"Key\": \"QWWVGBWB\", \"Item Type\": \"journalArticle\", \"Publication Year\": 1988.0}", "label": "10.1021/ef00008a001", "shape": "dot", "size": 10, "title": "XPS characterization of glassy-carbon surfaces oxidized by O2, CO2, and HNO3", "year": 1988.0 }, { "abstract": NaN, "author": "Briggs, D.", "color": "blue", "doi": "http://onlinelibrary.wiley.com/doi/abs/10.1002/sia.740030412", "id": "10.1002/sia.740030412", "infos": "{\"Key\": \"D579LSTZ\", \"Item Type\": \"journalArticle\", \"Publication Year\": 1981.0}", "label": "10.1002/sia.740030412", "shape": "dot", "size": 10, "title": "Handbook of X-ray Photoelectron Spectroscopy C. D. Wanger, W. M. Riggs, L. E. Davis, J. F. Moulder and G. E.Muilenberg Perkin-Elmer Corp., Physical Electronics Division, Eden Prairie, Minnesota, USA, 1979. 190 pp. $195", "year": 1981.0 }, { "abstract": NaN, "author": "McCreery, Richard L.", "color": "red", "doi": "https://pubs-acs-org.budistant.univ-orleans.fr/doi/abs/10.1021/cr068076m", "id": "10.1021/cr068076m", "infos": "{\"Key\": \"54CZPQ6E\", \"Item Type\": \"journalArticle\", \"Publication Year\": 2008.0}", "label": "10.1021/cr068076m", "shape": "dot", "size": 10, "title": "Advanced Carbon Electrode Materials for Molecular Electrochemistry", "year": 2008.0 }, { "abstract": NaN, "author": "C.\u00a0Brownson, Dale A.; J.\u00a0Kelly, Peter; E.\u00a0Banks, Craig", "color": "blue", "doi": "http://pubs.rsc.org/en/content/articlelanding/2015/ra/c5ra03049h", "id": "10.1039/C5RA03049H", "infos": "{\"Key\": \"DJGP8VA3\", \"Item Type\": \"journalArticle\", \"Publication Year\": 2015.0}", "label": "10.1039/C5RA03049H", "shape": "dot", "size": 10, "title": "In situ electrochemical characterisation of graphene and various carbon-based electrode materials: an internal standard approach", "year": 2015.0 }, { "abstract": NaN, "author": "Engstrom, Royce C.; Strasser, Vernon A.", "color": "blue", "doi": "https://doi.org/10.1021/ac00266a005", "id": "10.1021/ac00266a005", "infos": "{\"Key\": \"YFNYQJN6\", \"Item Type\": \"journalArticle\", \"Publication Year\": 1984.0}", "label": "10.1021/ac00266a005", "shape": "dot", "size": 10, "title": "Characterization of electrochemically pretreated glassy carbon electrodes", "year": 1984.0 }, { "abstract": NaN, "author": "Bowling, Robert; Packard, Richard T.; McCreery, Richard L.", "color": "blue", "doi": "https://doi.org/10.1021/la00087a022", "id": "10.1021/la00087a022", "infos": "{\"Key\": \"BAHII6XW\", \"Item Type\": \"journalArticle\", \"Publication Year\": 1989.0}", "label": "10.1021/la00087a022", "shape": "dot", "size": 10, "title": "Mechanism of electrochemical activation of carbon electrodes: role of graphite lattice defects", "year": 1989.0 }, { "abstract": NaN, "author": "Chen, Piehong.; Fryling, Mark A.; McCreery, Richard L.", "color": "blue", "doi": "https://pubs-acs-org.budistant.univ-orleans.fr/doi/abs/10.1021/ac00114a004", "id": "10.1021/ac00114a004", "infos": "{\"Key\": \"9EHH24XD\", \"Item Type\": \"journalArticle\", \"Publication Year\": 1995.0}", "label": "10.1021/ac00114a004", "shape": "dot", "size": 10, "title": "Electron Transfer Kinetics at Modified Carbon Electrode Surfaces: The Role of Specific Surface Sites", "year": 1995.0 }, { "abstract": "The Raman spectrum of Graphon carbon black has been recorded using rotating cell techniques. Angular dependence of scattering at 1360, 1580 and 2700 cm\u22121 are reported and these data suggest that the 1360 cm\u22121 line is associated with non-planar microstructure distortions. The excitation frequency dependence of the intensity ratio of the bands at 1360 (D) and 1580 cm\u22121 (G) is interpreted in terms of resonance (vibronic) interaction. This dependence is primarily the result of an increase in the intensity of the 1360 cm \u22121 line. The disorder-associated line (D) exhibits a significant excitation-dependent shift from 1378 cmi\u22121 (457.9 nm Ar+) to 1330 cm\u22121 (647.1 nm Kr+). The \u201cgraphite\u201d (G) line position is less sensitive to changes in excitation frequency. The spectral features are discussed in terms of factor group, C6v4, and layer site symmetry, C3v. Also the possible role of localized alkene-like structure in zones of structural distortion is considered.", "author": "Mernagh, Terrence P.; Cooney, Ralph P.; Johnson, Robert A.", "color": "blue", "doi": "http://www.sciencedirect.com/science/article/pii/0008622384901301", "id": "10.1016/0008-6223(84)90130-1", "infos": "{\"Key\": \"95NXPFV8\", \"Item Type\": \"journalArticle\", \"Publication Year\": 1984.0}", "label": "10.1016/0008-6223(84)90130-1", "shape": "dot", "size": 10, "title": "Raman spectra of Graphon carbon black", "year": 1984.0 }, { "abstract": "We exfoliate graphite in both aqueous and non-aqueous environments through mild sonication followed by centrifugation. The dispersions are enriched with monolayers. We mix them with polymers, followed by slow evaporation to produce optical quality composites. Nonlinear optical measurements show \u223c5% saturable absorption. The composites are then integrated into fiber laser cavities to generate 630\u2009fs pulses at 1.56\u2009\u00b5m. This shows the viability of solution phase processing for graphene based photonic devices.", "author": "Hasan, T.; Torrisi, F.; Sun, Z.; Popa, D.; Nicolosi, V.; Privitera, G.; Bonaccorso, F.; Ferrari, A. C.", "color": "blue", "doi": "http://onlinelibrary.wiley.com/doi/10.1002/pssb.201000339/abstract", "id": "10.1002/pssb.201000339", "infos": "{\"Key\": \"756AWVVU\", \"Item Type\": \"journalArticle\", \"Publication Year\": 2010.0}", "label": "10.1002/pssb.201000339", "shape": "dot", "size": 10, "title": "Solution-phase exfoliation of graphite for ultrafast photonics", "year": 2010.0 }, { "abstract": "We have used Raman spectroscopy to characterize a variety of carbon-containing particulate matter, including samples collected in ambient urban atmospheres. Based on the Raman spectra of known, commercial particles, we derive a simple empirical model that reflects their microchemistry and microphysics. This model gives information on the crystal size and morphology of the graphitic component, which correlates with the known characteristics of the commercial samples. We derive similar information about the graphitic component of the ambient particles, and suggest that this method might be used to characterize ambient particles systematically in the future.", "author": "Sze, S. -K.; Siddique, N.; Sloan, J. J.; Escribano, R.", "color": "red", "doi": "http://www.sciencedirect.com/science/article/pii/S1352231000003253", "id": "10.1016/S1352-2310(00)00325-3", "infos": "{\"Key\": \"U649GPQC\", \"Item Type\": \"journalArticle\", \"Publication Year\": 2001.0}", "label": "10.1016/S1352-2310(00)00325-3", "shape": "dot", "size": 10, "title": "Raman spectroscopic characterization of carbonaceous aerosols", "year": 2001.0 }, { "abstract": "Experimental conditions and mathematical fitting procedures for the collection and analysis of Raman spectra of soot and related carbonaceous materials have been investigated and optimised with a Raman microscope system operated at three different laser excitation wavelengths (514, 633, and 780 nm). Several band combinations for spectral analysis have been tested, and a combination of four Lorentzian-shaped bands (G, D1, D2, D4) at about 1580, 1350, 1620, and 1200 cm(-1), respectively, with a Gaussian-shaped band (W) at similar to 1500 cm(-1) was best suited for the first-order spectra. The second-order spectra were best fitted with Lorentzian-shaped bands at about 2450, 2700, 2900, and 3100 cm(-1). Spectral parameters (band positions, full widths at half maximum, and intensity ratios) are reported for several types of industrial carbon black (Degussa Printex, Cabot Monarch), diesel soot (particulate matter from modern heavy duty vehicle and passenger car engine exhaust, NIST SRM1650), spark-discharge soot (Palas GfG100), and graphite. Several parameters, in particular the width of the D1 band at similar to 1350 cm(-1), provide structural information and allow to discriminate the sample materials, but the characterisation and distinction of different types of soot is limited by the experimental reproducibility of the spectra and the statistical uncertainties of curve fitting. The results are discussed and compared with X-ray diffraction measurements and earlier Raman spectroscopic studies of comparable materials, where different measurement and fitting procedures had been applied.", "author": "Sadezky, A; Muckenhuber, H; Grothe, H; Niessner, R; Poschl, U", "color": "blue", "doi": NaN, "id": "10.1016/j.carbon.2005.02.018", "infos": "{\"Key\": \"9TD44Z57\", \"Item Type\": \"journalArticle\", \"Publication Year\": 2005.0}", "label": "10.1016/j.carbon.2005.02.018", "shape": "dot", "size": 10, "title": "Raman micro spectroscopy of soot and related carbonaceous materials: Spectral analysis and structural information", "year": 2005.0 }, { "abstract": "Amorphous carbon films, deposited with the LASER-ARC technique, have been characterized using Raman scattering experiments at an excitation wavelength of 633 nm provided by a He-Ne laser. To distinguish between the homogeneous amorphous film and incorporated particles area resolved measurements have been carried out due to the laser spot diameter of 1 \u03bcm. Typical diamondlike (DLC) films, grown near room temperature, show a broad Raman band between 1000 cm\u22121 and 1800 cm\u22121 fitted very well by two gaussian distributions. Films deposited at higher substrate temperatures reveal more graphitic features in the spectra. The spectra of particles consists of a graphite-like portion originated from the graphitic structure of the particle and a diamond-like portion caused by the covering DLC film. The degree of disorder and diamond-likeness in the film structure is quantified by the peak position, the full width at half maximum (FWHM) and intensity relation of the fitted \u201cD\u201d- and \u201cG\u201d-peaks.", "author": "Scheibe, H.-J.; Drescher, D.; Alers, P.", "color": "blue", "doi": "https://doi.org/10.1007/BF00321352", "id": "10.1007/BF00321352", "infos": "{\"Key\": \"85R87SWV\", \"Item Type\": \"journalArticle\", \"Publication Year\": 1995.0}", "label": "10.1007/BF00321352", "shape": "dot", "size": 10, "title": "Raman characterization of amorphous carbon films", "year": 1995.0 }, { "abstract": "Raman spectroscopy is here shown to provide a powerful tool to differentiate between two different sp2 carbon nanostructures (carbon nanotubes and graphene) which have many properties in common and others that differ. Emphasis is given to the richness of both carbon nanostructures as prototype examples of nanostructured materials. A glimpse toward future developments in this field is presented.", "author": "Dresselhaus, Mildred S.; Jorio, Ado; Hofmann, Mario; Dresselhaus, Gene; Saito, Riichiro", "color": "blue", "doi": "http://dx.doi.org/10.1021/nl904286r", "id": "10.1021/nl904286r", "infos": "{\"Key\": \"6I59IVWV\", \"Item Type\": \"journalArticle\", \"Publication Year\": 2010.0}", "label": "10.1021/nl904286r", "shape": "dot", "size": 10, "title": "Perspectives on Carbon Nanotubes and Graphene Raman Spectroscopy", "year": 2010.0 }, { "abstract": "Advances in the understanding of Raman processes in graphene have made it an essential tool for studying the properties of this one-atom-thick carbon material.", "author": "Ferrari, Andrea C.; Basko, Denis M.", "color": "blue", "doi": "http://www.nature.com/articles/nnano.2013.46", "id": "10.1038/nnano.2013.46", "infos": "{\"Key\": \"XFM6KWZM\", \"Item Type\": \"journalArticle\", \"Publication Year\": 2013.0}", "label": "10.1038/nnano.2013.46", "shape": "dot", "size": 10, "title": "Raman spectroscopy as a versatile tool for studying the properties of graphene", "year": 2013.0 }, { "abstract": "The use of Raman spectroscopy to reveal the remarkable structure and the unusual electronic and phonon properties of single wall carbon nanotubes (SWNTs) is reviewed comprehensively. The various types of Raman scattering processes relevant to carbon nanotubes are reviewed, and the theoretical foundations for these topics are presented. The most common experimental techniques used to probe carbon nanotubes are summarized, followed by a review of the novel experimental findings for each of the features in the first order and second order Raman spectra for single wall carbon nanotubes. These results are presented and discussed in connection with theoretical considerations. Raman spectra for bundles of SWNTs, for SWNTs surrounded by various common wrapping agents, and for isolated SWNTs at the single nanotube level are reviewed. Some of the current research challenges facing the field are briefly summarized.", "author": "Dresselhaus, M.S.; Dresselhaus, G.; Saito, R.; Jorio, A.", "color": "blue", "doi": "http://www.sciencedirect.com/science/article/pii/S0370157304004570", "id": "10.1016/j.physrep.2004.10.006", "infos": "{\"Key\": \"X3N5K3XP\", \"Item Type\": \"journalArticle\", \"Publication Year\": 2005.0}", "label": "10.1016/j.physrep.2004.10.006", "shape": "dot", "size": 10, "title": "Raman spectroscopy of carbon nanotubes", "year": 2005.0 }, { "abstract": NaN, "author": "Fryling, Mark A.; Zhao, Jun.; McCreery, Richard L.", "color": "blue", "doi": "https://pubs-acs-org.budistant.univ-orleans.fr/doi/abs/10.1021/ac00101a026", "id": "10.1021/ac00101a026", "infos": "{\"Key\": \"QT4VF5TQ\", \"Item Type\": \"journalArticle\", \"Publication Year\": 1995.0}", "label": "10.1021/ac00101a026", "shape": "dot", "size": 10, "title": "Resonance Raman Observation of Surface Carbonyl Groups on Carbon Electrodes Following Dinitrophenylhydrazine Derivatization", "year": 1995.0 }, { "abstract": NaN, "author": "Graf, D.; Molitor, F.; Ensslin, K.; Stampfer, C.; Jungen, A.; Hierold, C.; Wirtz, L.", "color": "blue", "doi": "http://dx.doi.org/10.1021/nl061702a", "id": "10.1021/nl061702a", "infos": "{\"Key\": \"WJ5HK4ZF\", \"Item Type\": \"journalArticle\", \"Publication Year\": 2007.0}", "label": "10.1021/nl061702a", "shape": "dot", "size": 10, "title": "Spatially Resolved Raman Spectroscopy of Single- and Few-Layer Graphene", "year": 2007.0 }, { "abstract": NaN, "author": "Sakellariou, Georgios; Ji, Haining; Mays, Jimmy W.; Hadjichristidis, Nikos; Baskaran, Durairaj", "color": "blue", "doi": "http://dx.doi.org/10.1021/cm702470x", "id": "10.1021/cm702470x", "infos": "{\"Key\": \"9XUENC2X\", \"Item Type\": \"journalArticle\", \"Publication Year\": 2007.0}", "label": "10.1021/cm702470x", "shape": "dot", "size": 10, "title": "Controlled Covalent Functionalization of Multiwalled Carbon Nanotubes using [4 + 2] Cycloaddition of Benzocyclobutenes", "year": 2007.0 }, { "abstract": NaN, "author": "Blake, Peter; Brimicombe, Paul D.; Nair, Rahul R.; Booth, Tim J.; Jiang, Da; Schedin, Fred; Ponomarenko, Leonid A.; Morozov, Sergey V.; Gleeson, Helen F.; Hill, Ernie W.; Geim, Andre K.; Novoselov, Kostya S.", "color": "blue", "doi": "http://dx.doi.org/10.1021/nl080649i", "id": "10.1021/nl080649i", "infos": "{\"Key\": \"KQPFX7VT\", \"Item Type\": \"journalArticle\", \"Publication Year\": 2008.0}", "label": "10.1021/nl080649i", "shape": "dot", "size": 10, "title": "Graphene-Based Liquid Crystal Device", "year": 2008.0 }, { "abstract": NaN, "author": "Kovtyukhova, Nina I.; Ollivier, Patricia         <script type="text/javascript">
            function onNodeInteraction(params) {
                const className = 'generated-div';
                const nodeId = params.nodes[0];

                // Retrieve the title from the node attributes
                const node = network.body.data.nodes.get(nodeId);

                // Check for existing aside element by ID
                const existingIdenticalElement = document.getElementById(nodeId);

                // If the existing aside is found, remove it
                if (existingIdenticalElement) {
                    existingIdenticalElement.remove();
                } else {
                    const existingElements = document.getElementsByClassName(className);
                    // Remove the first existing element if it exists
                    if (existingElements.length > 0) {
                        existingElements[0].remove();
                    }

                    // Create a new aside element
                    const aside = document.createElement("aside");

                    // Add content to the aside, including the title
                    const titre = document.createElement("h1");
                    titre.textContent = `Titre de la publication : ${node.title}`;
                    aside.appendChild(titre);

                    const year = document.createElement("p");
                    year.textContent = `Année de publication : ${node.year}`;
                    aside.appendChild(year);

                    const author = document.createElement("p");
                    author.textContent = `Auteurs : ${node.author}`;
                    aside.appendChild(author);

                    const abstract = document.createElement("p");
                    abstract.textContent = `Abstract : ${node.abstract}`;
                    aside.appendChild(abstract);

                    const doi = document.createElement("a");
                    doi.textContent = `DOI : ${node.doi}`;
                    doi.href = node.doi;  // Set the URL for the link
                    doi.target = "_blank";  // Open the link in a new tab
                    doi.rel = "noopener noreferrer";  // Security measure to prevent exploitation
                    aside.appendChild(doi);

                    aside.classList.add(className); // Add class for styling
                    aside.id = nodeId; // Assign unique ID

                    // Append the aside to the DOM
                    document.body.appendChild(aside);
                    console.log(`Un nouvel aside a été créé pour ${nodeId} avec le titre "${title} publié en "${year}".`);
                }

                if (params.nodes.length > 0) {
                    console.log("Clicked node:", nodeId);
                    // Here you can add more functionality, like fetching data no
                }
            }

            network.on("click", onNodeInteraction);
            network.on("hoverNode", onNodeInteraction);
        </script>
