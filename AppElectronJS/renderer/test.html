                  // parsing and collecting nodes and edges from the python
                  nodes = new vis.DataSet([{"abstract": "Caracterisation par spectrometrie XPS et AES de surfaces de carbone vitreuse apres exposition a l\u0027oxygene et au dioxyde de carbone. La decomposition chimique ulterieure est etudiee par la methode de la decomposition a temperature programmee. Cette etude permet de caracteriser la premiere etape de la gazeification et de la combustion du charbon", "author": "S. Kelemen, H. Freund", "color": "#97c2fc", "doi": "10.1021/ef00008a001", "id": "10.1021/ef00008a001", "isOrigin": true, "label": "S. Kelemen 1988", "nb_citations": 47, "shape": "dot", "size": 21, "title": "XPS Characterization of glassy-carbon surfaces oxidized by O2, CO2, and HNO3", "url": "https://www.semanticscholar.org/paper/4ffbcfb532310f55379c52c69f7ebced2fa7d39d", "year": 1988}, {"abstract": "Le traitement thermique d\u0027une electrode de carbone vitreux, a 725\u00b0C sous vide pousse (\u003c2.10 \u22126 Torr) permet d\u0027obtenir une electrode active vis-a-vis de l\u0027oxydoreduction du ferro-ferricyanure et pour l\u0027oxydation d\u0027acide ascorbique", "author": "D. T. Fagan, Ing-Feng Hu, T. Kuwana", "color": "#97c2fc", "doi": "10.1021/ac00291a006", "id": "10.1021/ac00291a006", "isOrigin": true, "label": "D. T. Fagan 1985", "nb_citations": 242, "shape": "dot", "size": 24, "title": "Vacuum heat-treatment for activation of glassy carbon electrodes", "url": "https://www.semanticscholar.org/paper/b30d37c1b9f84ff29ff2bec45bad8c12e1c8e2bc", "year": 1985}, {"abstract": "Etudes de l\u0027activation des electrodes de carbones vitreux vis\u2015a-vis du transfert d\u0027electrons faisant intervenir un transfert d\u0027electron couple au proton. L\u0027activation oxydative des electrodes de carbone vitreux conduit a la catalyse du transfert de charge heterogene pour les couples redox comprenant du pyrocatechol, (bpy) 2 (H 2 O)Ru(OH) 2+ avec bpy=bipyridyle-2,2\u0027 et (NH 3 ) 5 Ru(OH) 2+ , ou il y a changement du taux de protons lors de l\u0027oxydation", "author": "G. Cabaniss, A. Diamantis, W. R. Murphy, R. W. Linton, T. Meyer", "color": "#97c2fc", "doi": "10.1021/ja00293a007", "id": "10.1021/ja00293a007", "isOrigin": true, "label": "G. Cabaniss 1985", "nb_citations": 291, "shape": "dot", "size": 25, "title": "Electrocatalysis of proton-coupled electron-transfer reactions at glassy carbon electrodes", "url": "https://www.semanticscholar.org/paper/f184da7c1b01579e88388cf26c6c54ec1ad20b23", "year": 1985}, {"abstract": "The singularity index \u03b1 of the asymmetric C(1s) x\u2010ray photoelectron spectrum (XPS) of vitreous carbon is determined to be 0.19\u00b10.01, independent of the interlayer separation of the graphitic layers. This result is interpreted within the framework of the many\u2010electron theory; two mechanisms are suggested: (1) the modulation of the two\u2010dimensional graphite band structures by the random interlayer perturbation, and (2) the excitonic screening. By assigning the value \u03b1=0.19 to be characteristic of carbon atoms associated with polynuclear aromatic rings, we show that the fraction of carbon in these rings in coal can be determined by the asymmetry of the C(1s) XPS line.", "author": "T. Cheung", "color": "#97c2fc", "doi": "10.1063/1.330025", "id": "10.1063/1.330025", "isOrigin": true, "label": "T. Cheung 1982", "nb_citations": 67, "shape": "dot", "size": 21, "title": "X\u2010ray photoemission of carbon: Lineshape analysis and application to studies of coals", "url": "https://www.semanticscholar.org/paper/d4c4c3f3af3fa0c693f93d9893a2fa62805f8459", "year": 1982}, {"abstract": "The reduction of oxygen on rotating disk glassy carbon electrodes was studied in 0.1M HCl. Reproducible single waves with constant limiting currents over a potential range of 0.5V were obtained after the samples were electrochemically treated: anodic polarization at 2.0V vs. SCE and subsequent cathodic reduction. The number of electrons transferred in the oxygen reduction reaction was calculated to be 2.3. The surface of the glassy carbon was examined by XPS at different stages of the electrochemical treatment. After the anodic treatment, the ratio of oxidized carbon vs. graphitic carbon was higher than 1. The predominant oxygen species were carbonyl groups. Following reduction, the surface had an oxidized vs. graphitic carbon ratio below 0.5 with the oxygen distributed between phenolic and carboxylic groups. The role of the chloride ion in the formation of the carbonyl groups is discussed.", "author": "K. Sundberg, W. Smyrl, Ljiljana Atanasoska, R. T. Atanasoski", "color": "#97c2fc", "doi": "10.1149/1.2096650", "id": "10.1149/1.2096650", "isOrigin": false, "label": "K. Sundberg 1989", "nb_citations": 52, "shape": "dot", "size": 21, "title": "Surface modification and oxygen reduction on glassy carbon in chloride media", "url": "https://www.semanticscholar.org/paper/748095c1714cbc4f50400d8fe0d7a82f6c2c490f", "year": 1989}, {"abstract": "Divers oxydes metalliques (Mox) sont disperses a la surface du carbone vitreux pour catalyser l\u0027oxydation de l\u0027acide ascorbique (AH 2 ). L\u0027etude realisee sur 37 Mox montre que c\u0027est les oxydes dont le metal est de valence+3 ou plus qui presentent le plus grand degre d\u0027activation", "author": "S. Dong, T. Kuwana", "color": "#97c2fc", "doi": "10.1149/1.2115705", "id": "10.1149/1.2115705", "isOrigin": false, "label": "S. Dong 1984", "nb_citations": 66, "shape": "dot", "size": 21, "title": "Activation of Glassy Carbon Electrodes by Dispersed Metal Oxide Particles I . Ascorbic Acid Oxidation", "url": "https://www.semanticscholar.org/paper/94aba24c3ca628dd24b3de33b90d8be9ca3bbe16", "year": 1984}, {"abstract": "We report a novel phase of carbon possessing a monoclinic C2/m structure (8 atoms/cell) identified using an ab initio evolutionary structural search. This polymorph, which we call M-carbon, is related to the (2x1) reconstruction of the (111) surface of diamond and can also be viewed as a distorted (through sliding and buckling of the sheets) form of graphite. It is stable over cold-compressed graphite above 13.4 GPa. The simulated x-ray diffraction pattern and near K-edge spectroscopy are in satisfactory agreement with the experimental data [W. L. Mao, Science 302, 425 (2003)10.1126/science.1089713] on overcompressed graphite. The hardness and bulk modulus of this new carbon polymorph are calculated to be 83.1 and 431.2 GPa, respectively, which are comparable to those of diamond.", "author": "Quan Li, Yanming Ma, A. Oganov, Hongbo Wang, Hui Wang, Ying Xu, T. Cui, H. Mao, G. Zou", "color": "#97c2fc", "doi": "10.1103/physrevlett.102.175506", "id": "10.1103/physrevlett.102.175506", "isOrigin": true, "label": "Quan Li 2009", "nb_citations": 464, "shape": "dot", "size": 28, "title": "Superhard monoclinic polymorph of carbon.", "url": "https://www.semanticscholar.org/paper/d6b981b8ae7e13215629acdb7c8830b33cc6c625", "year": 2009}, {"abstract": ": Through a systematic structural search we found an allotrope of carbon with Cmmm symmetry which we predict to be more stable than graphite for pressures above 10 GPa. This material, which we refer to as Z-carbon, is formed by pure sp(3) bonds and it provides an explanation to several features in experimental x-ray diffraction and Raman spectra of graphite under pressure. The transition from graphite to Z-carbon can occur through simple sliding and buckling of graphene sheets. Our calculations predict that Z-carbon is a transparent wide band-gap semiconductor with a hardness comparable to diamond.", "author": "M. Amsler, J. A. Flores-Livas, L. Lehtovaara, F. Balima, S. Ghasemi, D. Machon, S. Pailh\u00e8s, Alexander Willand, D. Caliste, S. Botti, A. Miguel, S. Goedecker, M. Marques", "color": "#97c2fc", "doi": "10.1103/physrevlett.108.065501", "id": "10.1103/physrevlett.108.065501", "isOrigin": true, "label": "M. Amsler 2012", "nb_citations": 216, "shape": "dot", "size": 24, "title": "Crystal Structure of Cold Compressed Graphite", "url": "https://www.semanticscholar.org/paper/859900aae66b40b3ec32af0580955f7261961753", "year": 2012}, {"abstract": "Porous carbons that are three-dimensionally periodic on the scale of optical wavelengths were made by a synthesis route resembling the geological formation of natural opal. Porous silica opal crystals were sintered to form an intersphere interface through which the silica was removed after infiltration with carbon or a carbon precursor. The resulting porous carbons had different structures depending on synthesis conditions. Both diamond and glassy carbon inverse opals resulted from volume filling. Graphite inverse opals, comprising 40-angstrom-thick layers of graphite sheets tiled on spherical surfaces, were produced by surface templating. The carbon inverse opals provide examples of both dielectric and metallic optical photonic crystals. They strongly diffract light and may provide a route toward photonic band-gap materials.", "author": "A. Zakhidov, R. Baughman, Z. Iqbal, C. Cui, I. Khayrullin, S. Dantas, Jordi Marti, V. Ralchenko", "color": "#97c2fc", "doi": "10.1126/science.282.5390.897", "id": "10.1126/science.282.5390.897", "isOrigin": true, "label": "A. Zakhidov 1998", "nb_citations": 851, "shape": "dot", "size": 33, "title": "Carbon structures with three-dimensional periodicity at optical wavelengths", "url": "https://www.semanticscholar.org/paper/3b876b2375142afe7ee2f05acebfe56b90b01f66", "year": 1998}, {"abstract": "The elastic constants of pyrolytic graphite which has been highly ordered by annealing under compressive stress have been determined by ultrasonic, sonic resonance, and static test methods. Ultrasonic tests yielded the elastic constants c11, c12, c33, c44 = 1/s44, and the stress derivative of c33. The moduli 1/s11 and c44 were determined from the free flexural resonant vibrations of bars, and the shear modulus c44 also was determined from the fundamental torsional resonance of the bars and from the resonance of compound torsion oscillators composed of thin graphite disks with steel end pieces. Static tension, compression, and torsion tests on the pyrolytic graphite yielded a complete set of compliances (s11, s12, s13, s33, and s44). The following self\u2010consistent set of elastic constants (cij in units of 1011 dyn/cm2; sij in 10\u221211 cm2/dyn) has been deduced from the results: c11 = 106\u00b12, c12 = 18\u00b12, c33 = 3.65\u00b10.10, c13 = 1.5\u00b10.5, c44 = 0.018 to 0.035, 1/s11 = 102\u00b13, 1/s33 = 3.65\u00b10.10, s12 = \u22120.0016\u00b10.0006,...", "author": "O. L. Blakslee, D. G. Proctor, E. J. Seldin, G. B. Spence, T. Weng", "color": "#97c2fc", "doi": "10.1063/1.1659428", "id": "10.1063/1.1659428", "isOrigin": false, "label": "O. L. Blakslee 1970", "nb_citations": 815, "shape": "dot", "size": 33, "title": "Elastic Constants of Compression-Annealed Pyrolytic Graphite", "url": "https://www.semanticscholar.org/paper/b329fe58ddb9e3ea038521323d0a6ecfea5cd738", "year": 1970}, {"abstract": "The lattice dynamics of pristine graphite is presented with the use of a Born\\char22{}von K\\\u0027arm\\\u0027an model. With the consideration of interactions to fourth neighbor both intraplane and interplane, good agreement is simultaneously obtained with ir, Raman, and inelastic neutron scattering measurements of lattice modes and with the measured elastic constants. The second-order Raman spectrum is also calculated and compared with experiment.", "author": "R. Al-jishi, G. Dresselhaus", "color": "#97c2fc", "doi": "10.1103/physrevb.26.4514", "id": "10.1103/physrevb.26.4514", "isOrigin": false, "label": "R. Al-jishi 1982", "nb_citations": 410, "shape": "dot", "size": 27, "title": "Lattice-dynamical model for graphite", "url": "https://www.semanticscholar.org/paper/5288a4ebf408a74a34dd1a85a9c78a712a9ba2eb", "year": 1982}, {"abstract": "Un pretraitement electrochimique nettoie l\u0027electrode de ses contaminants introduit au cours du polissage et entraine une oxydation superficielle qui influence certaines reactions", "author": "R. Engstrom, Vernon A. Strasser", "color": "#97c2fc", "doi": "10.1021/ac00266a005", "id": "10.1021/ac00266a005", "isOrigin": false, "label": "R. Engstrom 1984", "nb_citations": 389, "shape": "dot", "size": 27, "title": "Characterization of electrochemically pretreated glassy carbon electrodes", "url": "https://www.semanticscholar.org/paper/4b6dc6fe96db07a39a7ecc6c1b30a5705d5b13d8", "year": 1984}, {"abstract": "Raman spectra, capacitance (C{degree}), phenanthrenequinone (PQ) adsorption, and heterogeneous electron-transfer rates for ferri/ferrocyanide, dopamine, and ascorbic acid were monitored after fracturing, polishing, and laser activating glassy carbon electrodes (GC-30). Alterations in the Raman spectrum indicate changes in carbon microstructure, while PQ adsorption and C{degree} provide measures of microscopic surface area. It was observed that polishing caused minor changes in carbon disorder and microscopic surface area, but the polished surface had poor electron-transfer kinetics. A k{degree} of above 0.5 cm s{sup {minus}1} was observed for Fe(CN){sub 6} for the first time. A clean, fractured GC surface exhibited a k{degree} of 0.5 cm s{sup {minus}1} and was very active toward ascorbic acid and dopamine oxidation. The results are consistent with a surface-cleaning mechanism for laser activation, accompanied by little or no observable surface restructuring or roughening.", "author": "R. J. Rice, N. Pontikos, R. McCreery", "color": "#97c2fc", "doi": "10.1021/ja00168a001", "id": "10.1021/ja00168a001", "isOrigin": false, "label": "R. J. Rice 1990", "nb_citations": 139, "shape": "dot", "size": 22, "title": "Quantitative correlations of heterogeneous electron-transfer kinetics with surface properties of glassy carbon electrodes", "url": "https://www.semanticscholar.org/paper/c9ee0c3b125a50832eda317582257f69c5aa8469", "year": 1990}, {"abstract": "The cyclic voltammetry at electrodes composed of multiple electroactive materials, where zones of one highly active material are distributed over a substrate of a second, less active material, is investigated by simulation. The two materials are assumed to differ in terms of their electrochemical rate constants towards any given redox couple. For a one-electron oxidation or reduction, the effect on voltammetry of the size and relative surface coverages of the zones as well as the rate constant of the slower zone are considered for systems where it is much slower than the rate constant of the faster zones. The occurrence of split peak cyclic voltammetry where two peaks are observed in the forward sweep, is studied in terms of the diffusional effects present in the system. A number of surface geometries are compared: specifically the more active zones are modelled as long, thin bands, as steps in the surface, as discs, and as rings (similar to a partially blocked electrode). Similar voltammetry for the band, step and ring models is seen but the disc geometry shows significant differences. Finally, the simulation technique is applied to the modelling of highly-ordered pyrolytic graphite (HOPG) surface and experimental conditions under which it may be possible to observe split peak voltammetry are predicted.", "author": "Kristopher R. Ward, N. Lawrence, R. S. Hartshorne, R. Compton", "color": "#97c2fc", "doi": "10.1039/c2cp40412e", "id": "10.1039/c2cp40412e", "isOrigin": false, "label": "Kristopher R. Ward 2012", "nb_citations": 34, "shape": "dot", "size": 20, "title": "The theory of cyclic voltammetry of electrochemically heterogeneous surfaces: comparison of different models for surface geometry and applications to highly ordered pyrolytic graphite.", "url": "https://www.semanticscholar.org/paper/b35bc8bd2d6f5beeba50af92af23c62480fd805b", "year": 2012}, {"abstract": "The Raman spectrum of glassy carbon has been measured. Two broad lines are observed at 1340 and 1590 cm\u22121. These results are consistent with the turbostratic structure, which has been suggested for glassy carbon, with a particle size La of approximately 30 A.", "author": "M. Nathan, John E. Smith, K. Tu", "color": "#97c2fc", "doi": "10.1063/1.1663599", "id": "10.1063/1.1663599", "isOrigin": true, "label": "M. Nathan 1974", "nb_citations": 145, "shape": "dot", "size": 22, "title": "Raman spectra of glassy carbon", "url": "https://www.semanticscholar.org/paper/92aca12e2a778b2244684f9f85d0d9c908bf7d7b", "year": 1974}, {"abstract": "We measured the dispersion of the graphite optical phonons in the in-plane Brillouin zone by inelastic x-ray scattering. The longitudinal and transverse optical branches cross along the \ufffd -K as well as the \ufffd -M direction. The dispersion of the optical phonons was, in general, stronger than expected from the literature. At the K point the transverse optical mode has a minimum and is only \ufffd 70 cm \ufffd 1 higher in frequency than the longitudinal mode. We show that first-principles calculations describe very well the vibrational properties of graphene once the long-range character of the dynamical matrix is taken into account.", "author": "J. Maultzsch, S. Reich, C. Thomsen, H. Requardt, P. Ordej\u00f3n", "color": "#97c2fc", "doi": "10.1103/physrevlett.92.075501", "id": "10.1103/physrevlett.92.075501", "isOrigin": false, "label": "J. Maultzsch 2004", "nb_citations": 331, "shape": "dot", "size": 26, "title": "Phonon Dispersion in Graphite", "url": "https://www.semanticscholar.org/paper/8a8bd34e2372876862f8db3999b93fa0115953be", "year": 2004}, {"abstract": "The application of approximate molecular orbital calculations within the framework of the charge potential model to the analysis of X-ray photoelectron spectroscopic binding energies is evaluated. Most of the calculations and experimental data refer to chromium compounds. The approximate molecular orbital calculations used are CNDO, extended Huckel, and charge iterated extended Huckel (using both CNDO and gross atomic charges). Calculations are carried out using both the ground and relaxation potential models (GPM and RPM). The results suggest that the CNDO charges in the RPM model provide the best agreement with experiment.", "author": "P. Sherwood", "color": "#97c2fc", "doi": "10.1039/f29767201791", "id": "10.1039/f29767201791", "isOrigin": false, "label": "P. Sherwood 1976", "nb_citations": 19, "shape": "dot", "size": 20, "title": "Analysis of the X-ray photoelectron spectra of transition metal compounds using approximate molecular orbital theories", "url": "https://www.semanticscholar.org/paper/761b2324ee5b95945dd5c9bcfc09b6d66fc94a71", "year": 1976}, {"abstract": "s 207", "author": "R. Weiland, D. Lupton, B. Fischer, J. Merker, C. Scheckenbach, J. Witte", "color": "#97c2fc", "doi": "10.1595/147106706x154198", "id": "10.1595/147106706x154198", "isOrigin": true, "label": "R. Weiland 2006", "nb_citations": 96, "shape": "dot", "size": 22, "title": "High-Temperature Mechanical Properties of the Platinum Group Metals", "url": "https://www.semanticscholar.org/paper/b18c92801fbdcb8c3d34512a4ec9b87aa334ccd6", "year": 2006}, {"abstract": "Aper\u00e7u indisponible", "author": "C. Maiti", "color": "#97c2fc", "doi": "10.1016/j.sse.2004.03.001", "id": "10.1016/j.sse.2004.03.001", "isOrigin": false, "label": "C. Maiti 2004", "nb_citations": 5, "shape": "dot", "size": 20, "title": "EditorialSpecial issue on strained-si heterostructures and devices", "url": "https://www.semanticscholar.org/paper/b85f1a377cb9f8b9c58c2cf78b4a994ca8f1f493", "year": 2004}, {"abstract": "Aper\u00e7u indisponible", "author": "Y. Baskin, L. Meyer", "color": "#97c2fc", "doi": "10.1103/physrev.100.544", "id": "10.1103/physrev.100.544", "isOrigin": false, "label": "Y. Baskin 1955", "nb_citations": 433, "shape": "dot", "size": 27, "title": "Lattice Constants of Graphite at Low Temperatures", "url": "https://www.semanticscholar.org/paper/ab1a8496dab46526f27199948527d09c76df7d14", "year": 1955}, {"abstract": "Aper\u00e7u indisponible", "author": "S. Yamada, H. Sato, T. Ishii", "color": "#97c2fc", "doi": "10.1016/0008-6223(64)90039-9", "id": "10.1016/0008-6223(64)90039-9", "isOrigin": true, "label": "S. Yamada 1964", "nb_citations": 40, "shape": "dot", "size": 20, "title": "Eigenschaften und Verwendung von glasartigem Kohlenstoff", "url": "https://www.semanticscholar.org/paper/6330fe85679d76a180ec894ccba30fe1d8a4ae78", "year": 1964}, {"abstract": "Aper\u00e7u indisponible", "author": "J. Grace, G. Kennedy", "color": "#97c2fc", "doi": "10.1016/0022-3697(67)90214-4", "id": "10.1016/0022-3697(67)90214-4", "isOrigin": true, "label": "J. Grace 1967", "nb_citations": 41, "shape": "dot", "size": 20, "title": "The melting curve of five gases to 30 KB", "url": "https://www.semanticscholar.org/paper/5fff269ab4bbbe0f0f440a5dc85a345e68da5fe8", "year": 1967}, {"abstract": "Aper\u00e7u indisponible", "author": "S. Narendar, D. Mahapatra, S. Gopalakrishnan", "color": "#97c2fc", "doi": "10.1016/j.compstruct.2011.02.023", "id": "10.1016/j.compstruct.2011.02.023", "isOrigin": false, "label": "S. Narendar 2011", "nb_citations": 16, "shape": "dot", "size": 20, "title": "ULTRASONIC WAVE CHARACTERISTICS OF A MONOLAYER GRAPHENE ON SILICON SUBSTRATE", "url": "https://www.semanticscholar.org/paper/8e791501577dec58377125359fa1db834576de87", "year": 2011}, {"abstract": "The combination of Raman spectroscopy and high-pressure techniques provides a unique method for studying the mechanical and structural response of carbon-based materials. Existing Raman studies on graphite under pressure were restricted to the analysis of the so-called G band, because the Raman signal from the diamond anvils overlaps other characteristic Raman features, like the D band. Here, we present a Raman spectroscopy study of highly oriented pyrolytic graphite (HOPG) under uniaxial stress using moissanite anvils. The use of moissanite has allowed us to observe, for the first time, the evolution of the D band under extreme compression. We have employed several excitation wavelengths: 632.8, 532.0 and 488.0 nm, to further study dispersion effects. Our results have important implications on the interpretation of high-pressure Raman results on several families of carbon-based compounds.", "author": "E. Del Corro, Jes\u00fas D. Gonz\u00e1lez, M. Taravillo, W. Escoffier, V. Baonza", "color": "#97c2fc", "doi": "10.1080/08957950802444796", "id": "10.1080/08957950802444796", "isOrigin": false, "label": "E. Del Corro 2008", "nb_citations": 2, "shape": "dot", "size": 20, "title": "Graphite under non-hydrostatic conditions", "url": "https://www.semanticscholar.org/paper/0f8a429069bf90e8168c6256b846ee593e9ab47b", "year": 2008}, {"abstract": "The behavior of a number of commonly used pressure media, including nitrogen, argon, 2-propanol, a 4:1 methanol\u2013ethanol mixture, glycerol and various grades of silicone oil, has been examined by measuring the X-ray diffraction maxima from quartz single crystals loaded in a diamond-anvil cell with each of these pressure media in turn. In all cases, the onset of non-hydrostatic stresses within the medium is detectable as the broadening of the rocking curves of X-ray diffraction peaks from the single crystals. The onset of broadening of the rocking curves of quartz is detected at \u223c9.8\u2005GPa in a 4:1 mixture of methanol and ethanol and at \u223c4.2\u2005GPa in 2-propanol, essentially at the same pressures as the previously reported hydrostatic limits determined by other techniques. Gigahertz ultrasonic interferometry was also used to detect the onset of the glass transition in 4:1 methanol\u2013ethanol and 16:3:1 methanol\u2013ethanol\u2013water, which were observed to support shear waves above \u223c9.2 and \u223c10.5\u2005GPa, respectively, at 0.8\u20131.2\u2005GHz. By contrast, peak broadening is first detected at \u223c3\u2005GPa in nitrogen, \u223c1.9\u2005GPa in argon, \u223c1.4\u2005GPa in glycerol and \u223c0.9\u2005GPa in various grades of silicone oil. These pressures, which are significantly lower than hydrostatic limits quoted in the literature, should be considered as the practical maximum limits to the hydrostatic behavior of these pressure media at room temperature.", "author": "Ross J. Angel, M. Bujak, J. Zhao, G. D. Gatta, Steven D. Jacobsen", "color": "#97c2fc", "doi": "10.1107/s0021889806045523", "id": "10.1107/s0021889806045523", "isOrigin": false, "label": "Ross J. Angel 2007", "nb_citations": 436, "shape": "dot", "size": 27, "title": "Effective hydrostatic limits of pressure media for high-pressure crystallographic studies", "url": "https://www.semanticscholar.org/paper/77c51f9a2bb9bd31ca5a83ccef97331796a11647", "year": 2007}, {"abstract": "Aper\u00e7u indisponible", "author": "J. Figueiredo, M. Pereira, M. Freitas, J. \u00d3rf\u00e3o", "color": "#97c2fc", "doi": "10.1016/s0008-6223(98)00333-9", "id": "10.1016/s0008-6223(98)00333-9", "isOrigin": true, "label": "J. Figueiredo 1999", "nb_citations": 2628, "shape": "dot", "size": 53, "title": "Modification of the surface chemistry of activated carbons", "url": "https://www.semanticscholar.org/paper/8d50ec0f78ff210ff48debaaedd9f6a6e0072e6d", "year": 1999}, {"abstract": "Aper\u00e7u indisponible", "author": "Ing-Feng Hu, T. Kuwana", "color": "#97c2fc", "doi": "10.1021/ac00127a069", "id": "10.1021/ac00127a069", "isOrigin": false, "label": "Ing-Feng Hu 1986", "nb_citations": 177, "shape": "dot", "size": 23, "title": "Oxidative mechanism of ascorbic acid at glassy carbon electrodes", "url": "https://www.semanticscholar.org/paper/33cf79988207587efdb20658e293795e277af896", "year": 1986}, {"abstract": "Aper\u00e7u indisponible", "author": "Ing-Feng Hu, D. Karweik, T. Kuwana", "color": "#97c2fc", "doi": "10.1016/s0022-0728(85)80050-4", "id": "10.1016/s0022-0728(85)80050-4", "isOrigin": true, "label": "Ing-Feng Hu 1985", "nb_citations": 308, "shape": "dot", "size": 25, "title": "Activation and deactivation of glassy carbon electrodes", "url": "https://www.semanticscholar.org/paper/ddc26855a3799627c879a23283edaef90d23f87a", "year": 1985}, {"abstract": "Aper\u00e7u indisponible", "author": "S. Yumitori", "color": "#97c2fc", "doi": "10.1023/a:1004761103919", "id": "10.1023/a:1004761103919", "isOrigin": false, "label": "S. Yumitori 2000", "nb_citations": 298, "shape": "dot", "size": 25, "title": "Correlation of C1s chemical state intensities with the O1s intensity in the XPS analysis of anodically oxidized glass-like carbon samples", "url": "https://www.semanticscholar.org/paper/13dfe0324c569f27602c2341afea3022d077a4ea", "year": 2000}, {"abstract": "Aper\u00e7u indisponible", "author": "M. Delamar, Rachid Hitmi, J. Pinson, J. Sav\u00e9ant", "color": "#97c2fc", "doi": "10.1021/ja00040a074", "id": "10.1021/ja00040a074", "isOrigin": false, "label": "M. Delamar 1992", "nb_citations": 811, "shape": "dot", "size": 33, "title": "Covalent Modification of Carbon Surfaces by Grafting of Functionalized Aryl Radicals Produced from Electrochemical Reduction of Diazonium Salts", "url": "https://www.semanticscholar.org/paper/b1bdc7e98f6c8ccd5274951f2298becb065d357b", "year": 1992}, {"abstract": "Aper\u00e7u indisponible", "author": "J. Hlinka, I. Gregora, J. Pokorny, C. H\u00e9rold, N. Emery, J. Mar\u00each\u00e9, P. Lagrange", "color": "#97c2fc", "doi": "10.1103/physrevb.76.144512", "id": "10.1103/physrevb.76.144512", "isOrigin": false, "label": "J. Hlinka 2007", "nb_citations": 15, "shape": "dot", "size": 20, "title": "Lattice dynamics ofCaC6by Raman spectroscopy", "url": "https://www.semanticscholar.org/paper/ad80fa8a7a0e6e6fe2235c367668e3f7d4b701c9", "year": 2007}, {"abstract": "Using 514 nm radiation and a careful experimental protocol allowing us to make quantitative intensity analyses, we have examined the first- and second-order Raman spectra of five varieties of graphite. These include single-crystal graphite and highly oriented pyrolytic graphite as references, then two with a significant content of c-axis translation faults introduced through grinding and exfoliation, and a last sample which is purely turbostratic. We show that full c-axis stacking disorder results in a strong increase of the scattered E2g-mode intensity. We have further shown that even in those strongly disordered stacking sequences, but in which the AB sequence persists over only a few layers, the doublet around 2700 cm\u22121 is resolved. We argue against assigning the peak around 1355 cm\u22121 to \u201cdisorder,\u201d as is so often done, but to the finite in-plane domain size as proposed a number of years ago; moreover, we suggest that this peak is a more sensitive probe of such small domains than is x-ray diffraction.", "author": "H. Wilhelm, M. Lelaurain, E. Mcrae, B. Humbert", "color": "#97c2fc", "doi": "10.1063/1.369027", "id": "10.1063/1.369027", "isOrigin": false, "label": "H. Wilhelm 1998", "nb_citations": 165, "shape": "dot", "size": 23, "title": "Raman spectroscopic studies on well-defined carbonaceous materials of strong two-dimensional character", "url": "https://www.semanticscholar.org/paper/e7fcde0908998ebe69d8344b8a221271e3f08155", "year": 1998}, {"abstract": "The room-temperature Raman signatures from graphene layers on sapphire and glass substrates were compared with those from graphene on GaAs substrate and on the standard Si/SiO2 substrate, which served as a reference. It was found that while G peak of graphene on Si/SiO2 and GaAs is positioned at 1580 cm -1 it is down-shifted by ~5 cm -1 for graphene-on-sapphire (GOS) and, in many cases, splits into doublets for graphene-on-glass (GOG) with the central frequency around 1580 cm -1 . The obtained results are important for graphene characterization and its proposed graphene applications in electronic devices.", "author": "I. Calizo, W. Bao, F. Miao, C. N. Lau, A. Balandin", "color": "#97c2fc", "doi": "10.1063/1.2805024", "id": "10.1063/1.2805024", "isOrigin": false, "label": "I. Calizo 2007", "nb_citations": 181, "shape": "dot", "size": 23, "title": "Graphene-on-Sapphire and Graphene-on-Glass: Raman Spectroscopy Study", "url": "https://www.semanticscholar.org/paper/a257f8287712c94ee0c9767df2c29c690c50723f", "year": 2007}, {"abstract": "We present a review of the Raman spectra of graphite from an experimental and theoretical point of view. The disorder\u2013induced Raman bands in this material have been a puzzling Raman problem for almost 30 years. Double\u2013resonant Raman scattering explains their origin as well as the excitation\u2013energy dependence, the overtone spectrum and the difference between Stokes and anti\u2013Stokes scattering. We develop the symmetry\u2013imposed selection rules for double\u2013resonant Raman scattering in graphite and point out misassignments in previously published works. An excellent agreement is found between the graphite phonon dispersion from double\u2013resonant Raman scattering and other experimental methods.", "author": "S. Reich, C. Thomsen", "color": "#97c2fc", "doi": "10.1098/rsta.2004.1454", "id": "10.1098/rsta.2004.1454", "isOrigin": false, "label": "S. Reich 2004", "nb_citations": 1143, "shape": "dot", "size": 37, "title": "Raman spectroscopy of graphite", "url": "https://www.semanticscholar.org/paper/593e8367b9921c7b7bd5138f0532f68068e877d9", "year": 2004}, {"abstract": "Graphene-based materials exhibit remarkable electronic, optical, and mechanical properties, which has resulted in both high scientific interest and huge potential for a variety of applications. Furthermore, the family of graphene-based materials is growing because of developments in preparation methods. Raman spectroscopy is a versatile tool to identify and characterize the chemical and physical properties of these materials, both at the laboratory and mass-production scale. This technique is so important that most of the papers published concerning these materials contain at least one Raman spectrum. Thus, here, we systematically review the developments in Raman spectroscopy of graphene-based materials from both fundamental research and practical (i.e., device applications) perspectives. We describe the essential Raman scattering processes of the entire first- and second-order modes in intrinsic graphene. Furthermore, the shear, layer-breathing, G and 2D modes of multilayer graphene with different stacking orders are discussed. Techniques to determine the number of graphene layers, to probe resonance Raman spectra of monolayer and multilayer graphenes and to obtain Raman images of graphene-based materials are also presented. The extensive capabilities of Raman spectroscopy for the investigation of the fundamental properties of graphene under external perturbations are described, which have also been extended to other graphene-based materials, such as graphene quantum dots, carbon dots, graphene oxide, nanoribbons, chemical vapor deposition-grown and SiC epitaxially grown graphene flakes, composites, and graphene-based van der Waals heterostructures. These fundamental properties have been used to probe the states, effects, and mechanisms of graphene materials present in the related heterostructures and devices. We hope that this review will be beneficial in all the aspects of graphene investigations, from basic research to material synthesis and device applications.", "author": "Jiang-Bin Wu, Miao\u2010Ling Lin, Xin Cong, He-Nan Liu, P. Tan", "color": "#97c2fc", "doi": "10.1039/c6cs00915h", "id": "10.1039/c6cs00915h", "isOrigin": false, "label": "Jiang-Bin Wu 2018", "nb_citations": 1105, "shape": "dot", "size": 36, "title": "Raman spectroscopy of graphene-based materials and its applications in related devices.", "url": "https://www.semanticscholar.org/paper/44f510905efea9027dfd7f587e98225798f039a3", "year": 2018}, {"abstract": "Raman spectroscopy has historically played an important role in the structural characterization of graphitic materials, in particular providing valuable information about defects, stacking of the graphene layers and the finite sizes of the crystallites parallel and perpendicular to the hexagonal axis. Here we review the defect-induced Raman spectra of graphitic materials from both experimental and theoretical standpoints and we present recent Raman results on nanographites and graphenes. The disorder-induced D and D\u0027 Raman features, as well as the G\u0027-band (the overtone of the D-band which is always observed in defect-free samples), are discussed in terms of the double-resonance (DR) Raman process, involving phonons within the interior of the 1st Brillouin zone of graphite and defects. In this review, experimental results for the D, D\u0027 and G\u0027 bands obtained with different laser lines, and in samples with different crystallite sizes and different types of defects are presented and discussed. We also present recent advances that made possible the development of Raman scattering as a tool for very accurate structural analysis of nano-graphite, with the establishment of an empirical formula for the in- and out-of-plane crystalline size and even fancier Raman-based information, such as for the atomic structure at graphite edges, and the identification of single versus multi-graphene layers. Once established, this knowledge provides a powerful machinery to understand newer forms of sp(2) carbon materials, such as the recently developed pitch-based graphitic foams. Results for the calculated Raman intensity of the disorder-induced D-band in graphitic materials as a function of both the excitation laser energy (E(laser)) and the in-plane size (L(a)) of nano-graphites are presented and compared with experimental results. The status of this research area is assessed, and opportunities for future work are identified.", "author": "Marcos A. Pimenta, G. Dresselhaus, M. Dresselhaus, L. G. Can\u00e7ado, A. Jorio, Riichiro Saito", "color": "#97c2fc", "doi": "10.1039/b613962k", "id": "10.1039/b613962k", "isOrigin": false, "label": "Marcos A. Pimenta 2007", "nb_citations": 3548, "shape": "dot", "size": 61, "title": "Studying disorder in graphite-based systems by Raman spectroscopy.", "url": "https://www.semanticscholar.org/paper/7a5dd48a99595df65b929ec95ef40bc93a7e0b0b", "year": 2007}, {"abstract": "Aper\u00e7u indisponible", "author": "S. Iijima", "color": "#97c2fc", "doi": "10.1038/354056a0", "id": "10.1038/354056a0", "isOrigin": true, "label": "S. Iijima 1991", "nb_citations": 9998, "shape": "dot", "size": 99, "title": "Helical microtubules of graphitic carbon", "url": "https://www.semanticscholar.org/paper/2b1a1d5dc50c47baf35cf5a51c238caa5b07a474", "year": 1991}, {"abstract": "Aper\u00e7u indisponible", "author": "K. Jurkiewicz, K. Jurkiewicz, M. Pawlyta, Dorota Zygad\u0142o, Dorota Zygad\u0142o, D. Chrobak, D. Chrobak, S. Duber, R. Wrzalik, R. Wrzalik, A. Ratuszna, A. Ratuszna, A. Burian, A. Burian", "color": "#97c2fc", "doi": "10.1007/s10853-017-1753-7", "id": "10.1007/s10853-017-1753-7", "isOrigin": true, "label": "K. Jurkiewicz 2018", "nb_citations": 118, "shape": "dot", "size": 22, "title": "Evolution of glassy carbon under heat treatment: correlation structure\u2013mechanical properties", "url": "https://www.semanticscholar.org/paper/e5e7cd06acecd446ebc2e244d4b05db21fed8e82", "year": 2018}, {"abstract": "Aper\u00e7u indisponible", "author": "G. Savini, G. Savini, Y. Dappe, S. \u00d6berg, Jean-Christophe Charlier, M. Katsnelson, Annalisa Fasolino", "color": "#97c2fc", "doi": "10.1016/j.carbon.2010.08.042", "id": "10.1016/j.carbon.2010.08.042", "isOrigin": false, "label": "G. Savini 2010", "nb_citations": 144, "shape": "dot", "size": 22, "title": "Bending modes, elastic constants and mechanical stability of graphitic systems", "url": "https://www.semanticscholar.org/paper/e029e5864364e949d65444cd1b4ec28a16610670", "year": 2010}, {"abstract": "Aper\u00e7u indisponible", "author": "P. V. Attekum, G. Wertheim", "color": "#97c2fc", "doi": "10.1103/physrevlett.43.1896", "id": "10.1103/physrevlett.43.1896", "isOrigin": false, "label": "P. V. Attekum 1979", "nb_citations": 107, "shape": "dot", "size": 22, "title": "Excitonic Effects in Core-Hole Screening", "url": "https://www.semanticscholar.org/paper/3cd27c7f5ad2cc193b1caf7154d17d23398a3d5c", "year": 1979}, {"abstract": "3.6.1. Polishing and Cleaning 2663 3.6.2. Vacuum and Heat Treatments 2664 3.6.3. Carbon Electrode Activation 2665 3.7. Summary and Generalizations 2666 4. Advanced Carbon Electrode Materials 2666 4.1. Microfabricated Carbon Thin Films 2666 4.2. Boron-Doped Diamond for Electrochemistry 2668 4.3. Fibers and Nanotubes 2669 4.4. Carbon Composite Electrodes 2674 5. Carbon Surface Modification 2675 5.1. Diazonium Ion Reduction 2675 5.2. Thermal and Photochemical Modifications 2679 5.3. Amine and Carboxylate Oxidation 2680 5.4. Modification by \u201cClick\u201d Chemistry 2681 6. Synopsis and Outlook 2681 7. Acknowledgments 2682 8. References 2682", "author": "R. McCreery", "color": "#97c2fc", "doi": "10.1021/cr068076m", "id": "10.1021/cr068076m", "isOrigin": true, "label": "R. McCreery 2008", "nb_citations": 2259, "shape": "dot", "size": 49, "title": "Advanced carbon electrode materials for molecular electrochemistry.", "url": "https://www.semanticscholar.org/paper/167d8a3763ad6c24ede2b72ace5b144bfe0cf0bc", "year": 2008}, {"abstract": "We employ an internal standard protocol to simultaneously characterise and utilise electrode materials during their electrochemical implementation. The proposed approach involves \u2018spiking\u2019 a solution containing the analyte of interest (namely, \u03b2-nicotinamide adenine dinucleotide (NADH)) with a common electrochemical redox probe (such as hexaammine-ruthenium(III) chloride), which consequently allows information on the electrochemical properties of the electrode being utilised to be obtained and monitored throughout its application. This approach is explored using a range of commonly encountered carbonaceous electrode materials, including various graphene configurations, such as monolayer, double- and few-layered graphene electrodes \u2013 the latter is reported for the first time. The variability in structural quality and stability of the graphene electrodes used (particularly between batches) highlights the necessity for implementation of such approaches within the literature. This work provides a simple, yet effective option for the in situ electrochemical characterisation of various electrode materials, essential where the quality and composition of a \u2018reported\u2019 electrode material can vary greatly depending on its fabrication (batch-to-batch quality) or during the course of experimental use.", "author": "D. A. Brownson, P. Kelly, C. Banks", "color": "#97c2fc", "doi": "10.1039/c5ra03049h", "id": "10.1039/c5ra03049h", "isOrigin": false, "label": "D. A. Brownson 2015", "nb_citations": 54, "shape": "dot", "size": 21, "title": "In situ electrochemical characterisation of graphene and various carbon-based electrode materials: an internal standard approach", "url": "https://www.semanticscholar.org/paper/5d207993a7dbcd65a33b456b708fcf3e6cfd306b", "year": 2015}, {"abstract": "Glassy carbon (GC) surfaces modified with monolayers of biphenyl and nitrobiphenyl molecules were examined as voltammetric electrodes for ferrocene, benzoquinone, and tetracyanoquinodimethane electrochemistry in acetonitrile. The modified electrodes exhibited slower electron transfer than unmodified GC, by factors that varied with the monolayer and redox system. However, after a negative potential excursion to approximately -2.0 V versus Ag+/Ag, the modified electrodes exhibited much faster electron-transfer kinetics, approaching those observed on unmodified GC. The effect is attributed to an apparently irreversible structural change in the biphenyl or nitrobiphenyl monolayer, which increases the rate of electron tunneling. The transition to the \"ON\" state is associated with electron injection into the monolayer similar to that observed in previous spectroscopic investigations and causes a significant decrease in the calculated HOMO-LUMO gap for the monolayer molecule. Once the monolayer is switched ON, it supports rapid electron exchange with outer-sphere redox systems, but not with dopamine, which requires adsorption to the GC surface. The increase in electron-transfer rate with electron injection is consistent with an increase in electron tunneling rate through the monolayer, caused by a significant decrease in tunneling barrier height. The ON electrode can reduce biphenyl- or nitrobiphenyldiazonium reagent in solution to permit formation of a second modification layer of biphenyl or nitrobiphenyl molecules. This \"double derivatization\" procedure was used to prepare tetraphenyl- and nitrotetraphenyl-modified electrodes, which exhibit significantly slower electron transfer than their biphenyl and nitrobiphenyl counterparts. A \"switching\" electrode may have useful properties for electroanalytical applications and possibly in electrocatalysis. In addition, the ON state represents an \"organic electrode\" in which electron transfer occurs at an interface between an organic conductor and a solution rather than an interface between a solution and a metal or carbon electrode.", "author": "A. Solak, Laura R Eichorst, W. J. Clark, R. McCreery", "color": "#97c2fc", "doi": "10.1021/ac026107h", "id": "10.1021/ac026107h", "isOrigin": false, "label": "A. Solak 2003", "nb_citations": 103, "shape": "dot", "size": 22, "title": "Modified carbon surfaces as \"organic electrodes\" that exhibit conductance switching.", "url": "https://www.semanticscholar.org/paper/a34167ad6a538064984564a935a65bce78d22404", "year": 2003}, {"abstract": "The use of graphene, a one atom thick individual planar carbon layer, has exploded in a plethora of scientific disciplines since it was reported to possess a range of unique and exclusive properties. Despite graphene being explored theoretically since the 1940s and known to exist since the 1960s, the recent burst of interest from a large proportion of scientists globally can be correlated with work by Geim and Novoselov in 2004/5, who reported the so-called \"scotch tape method\" for the production of graphene in addition to identifying its unique electronic properties which has escalated into graphene being reported to be superior in a superfluity of areas. Consequently, many are involved in the pursuit of producing new methodologies to fabricate pristine graphene on an industrial scale in order to meet the current world-wide appetite for graphene. One area which receives considerable interest is the field of electrochemistry, where graphene has been reported to be beneficial in various applications ranging from sensing through to energy storage and generation and carbon based molecular electronics. Electrochemistry is an interfacial technique which is dominated by processes that occur at the solid-liquid interface and thus with the correct understanding can be beneficially utilised to characterise the surface under investigation. In this tutorial review we overview fundamental concepts of Graphene Electrochemistry, making electrochemical characterisation accessible to those who are working on new methodologies to fabricate graphene, bridging the gap between materials scientists and electrochemists and also assisting those exploring graphene in electrochemical areas, or that wish to start to. An overview of the recent understanding of graphene modified electrodes is also provided, highlighting prominent applications reported in the current literature.", "author": "D. A. Brownson, Dimitrios K. Kampouris, C. Banks", "color": "#97c2fc", "doi": "10.1039/c2cs35105f", "id": "10.1039/c2cs35105f", "isOrigin": false, "label": "D. A. Brownson 2012", "nb_citations": 531, "shape": "dot", "size": 29, "title": "Graphene electrochemistry: fundamental concepts through to prominent applications.", "url": "https://www.semanticscholar.org/paper/9dba57520c26e27c65f159441ed5e416d05ff6eb", "year": 2012}, {"abstract": "We critically evaluate the reported electro-catalysis of graphene using inner-sphere and outer-sphere electrochemical redox probes, namely potassium ferrocyanide (II) and hexaammine-ruthenium(III) chloride, in addition to L-ascorbic acid and \u03b2-nicotinamide adenine dinucleotide. Well characterised commercially available graphene is utilised which has not been chemically treated, is free from surfactants, and as a result of its fabrication has an extremely low oxygen content allowing the electronic properties to be properly de-convoluted. Surprisingly we observe that graphene exhibits slow electron transfer towards the electrochemical probes studied, effectively blocking underlying electron transfer of the supporting electrode substrate likely due to its large basal and low edge plane content. Such observations, never reported before, suggest that graphene may not be such a beneficial electrode material as widely reported in the literature. Density Functional Theory is conducted on symmetric graphene flakes of varying sizes indicating that the HOMO and LUMO energies are concentrated around the edge of the graphene sheet, at the edge plane sites, rather than the central basal plane region, consistent with experimental observations. We define differentiating coverage-based working regions for the electrochemical utilisation of graphene: \u2018Zone I\u2019, where graphene additions do not result in complete coverage of the underlying electrode and thus increasing basal contribution from graphene modification leads to increasingly reduced electron transfer and electrochemical activity; \u2018Zone II\u2019, once complete single-layer coverage is achieved, layered graphenevizgraphite materialises with increased edge plane content and thus an increase in heterogeneous electron transfer is observed with increased layering. We offer insight into the electrochemical properties of these carbon materials, invaluable where electrode design for electrochemical sensing applications is sought.", "author": "D. A. Brownson,
