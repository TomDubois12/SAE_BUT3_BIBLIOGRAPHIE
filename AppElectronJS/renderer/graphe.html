chanical properties", "url": "https://www.semanticscholar.org/paper/e5e7cd06acecd446ebc2e244d4b05db21fed8e82", "year": 2018}, {"abstract": "Aper\u00e7u indisponible", "author": "J. Figueiredo, M. Pereira, M. Freitas, J. \u00d3rf\u00e3o", "color": "#97c2fc", "doi": "10.1016/s0008-6223(98)00333-9", "id": "10.1016/s0008-6223(98)00333-9", "isOrigin": true, "label": "J. Figueiredo 1999", "nb_citations": 2638, "shape": "dot", "size": 53, "title": "Modification of the surface chemistry of activated carbons", "url": "https://www.semanticscholar.org/paper/8d50ec0f78ff210ff48debaaedd9f6a6e0072e6d", "year": 1999}, {"abstract": "The post-synthesis chemical modification of various porous carbon materials with unsaturated organic compounds is reported. By this method, amine, alcohol, carboxylate, and sulfonic acid functional groups can be easily incorporated into the materials. Different carbonaceous materials with surface areas ranging from 240 to 1500\u2005m(2)g(-1) and pore sizes between 3.0 and 7.0\u2005nm have been studied. The resulting materials were analyzed by elemental analysis, nitrogen sorption, FTIR spectroscopy, zeta-potential measurements, thermogravimetric analysis, photoelectron spectroscopy, and small-angle X-ray scattering. These analyses indicated that the degree of functionalization is dependent on the nature of the dienophile (reactivity, steric hindrance) and the porosity of the carbon material. As possible applications, the functionalized carbonaceous materials were studied as catalysts in the Knoevenagel reaction and as adsorbents for Pb(2+) from aqueous solution.", "author": "H. Kaper, A. Grandjean, C. Weidenthaler, F. Sch\u00fcth, F. Goettmann", "color": "#97c2fc", "doi": "10.1002/chem.201102718", "id": "10.1002/chem.201102718", "isOrigin": false, "label": "H. Kaper 2012", "nb_citations": 24, "shape": "dot", "size": 20, "title": "Surface Diels-Alder reactions as an effective method to synthesize functional carbon materials.", "url": "https://www.semanti ayers. This result is interpreted within the framework of the many\u2010electron theory; two mechanisms are suggested: (1) the modulation of the two\u2010dimensional graphite band structures by the random interlayer perturbation, and (2) the excitonic screening. By assigning the value \u03b1=0.19 to be characteristic of carbon atoms associated with polynuclear aromatic rings, we show that the fraction of carbon in these rings in coal can be determined by the asymmetry of the C(1s) XPS line.", "author": "T. Cheung", "color": "#97c2fc", "doi": "10.1063/1.330025", "id": "10.1063/1.330025", "isOrigin": true, "label": "T. Cheung 1982", "nb_citations": 67, "shape": "dot", "size": 21, "title": "X\u2010ray photoemission of carbon: Lineshape analysis and application to studies of coals", "url": "https://www.semanticscholar.org/paper/d4c4c3f3af3fa0c693f93d9893a2fa62805f8459", "year": 1982}, {"abstract": "Aper\u00e7u indisponible", "author": "H. Estrade-szwarckopf", "color": "#97c2fc", "doi": "10.1016/j.carbon.2004.03.005", "id": "10.1016/j.carbon.2004.03.005", "isOrigin": false, "label": "H. Estrade-szwarckopf 2004", "nb_citations": 676, "shape": "dot", "size": 31, "title": "XPS photoemission in carbonaceous materials: A \u201cdefect\u201d peak beside the graphitic asymmetric peak", "url": "https://www.semanticscholar.org/paper/6a0edc1456cc5731a442d2a0dcc7fab865757c94", "year": 2004}, {"abstract": "The Raman spectrum of glassy carbon has been measured. Two broad lines are observed at 1340 and 1590 cm\u22121. These results are consistent with the turbostratic structure, which has been suggested for glassy carbon, with a particle size La of approximately 30 A.", "author": "M. Nathan, John E. Smith, K. Tu", "color": "#97c2fc", "doi": "10.1063/1.1663599", "id": "10.1063/1.1663599", "isOrigin": true, "label": "M. Nathan 1974", "nb_citations": 146, "shape": "dot", "size": 23, "title": "Raman spectra of glassy carbon", "url": "https://www.semanticscholar.org/paper/92aca12e2a778b2244 rbon electrodes", "url": "https://www.semanticscholar.org/paper/4b6dc6fe96db07a39a7ecc6c1b30a5705d5b13d8", "year": 1984}, {"abstract": "Aper\u00e7u indisponible", "author": "S. Iijima", "color": "#97c2fc", "doi": "10.1038/354056a0", "id": "10.1038/354056a0", "isOrigin": true, "label": "S. Iijima 1991", "nb_citations": 9998, "shape": "dot", "size": 99, "title": "Helical microtubules of graphitic carbon", "url": "https://www.semanticscholar.org/paper/2b1a1d5dc50c47baf35cf5a51c238caa5b07a474", "year": 1991}, {"abstract": "Aper\u00e7u indisponible", "author": "G. Savini, G. Savini, Y. Dappe, S. \u00d6berg, Jean-Christophe Charlier, M. Katsnelson, Annalisa Fasolino", "color": "#97c2fc", "doi": "10.1016/j.carbon.2010.08.042", "id": "10.1016/j.carbon.2010.08.042", "isOrigin": false, "label": "G. Savini 2010", "nb_citations": 145, "shape": "dot", "size": 22, "title": "Bending modes, elastic constants and mechanical stability of graphitic systems", "url": "https://www.semanticscholar.org/paper/e029e5864364e949d65444cd1b4ec28a16610670", "year": 2010}, {"abstract": "Department of Materials Science, University of Patras, 26504 Rio Patras, Greece, Theoretical and Physical Chemistry Institute, National Hellenic Research Foundation, 48 Vass. Constantinou Avenue, 116 35 Athens, Greece, Institut de Biologie Moleculaire et Cellulaire, UPR9021 CNRS, Immunologie et Chimie Therapeutiques, 67084 Strasbourg, France, and Dipartimento di Scienze Farmaceutiche, Universita di Trieste, Piazzale Europa 1, 34127 Trieste, Italy", "author": "D. Tasis, N. Tagmatarchis, A. Bianco, M. Prato", "color": "#97c2fc", "doi": "10.1021/cr050569o", "id": "10.1021/cr050569o", "isOrigin": false, "label": "D. Tasis 2006", "nb_citations": 3715, "shape": "dot", "size": 62, "title": "Chemistry of carbon nanotubes.", "url": "https://www.semanticscholar.org/paper/4137c7569c18fd130dab7e500a8c2292cade4bab", "year": 2006}, {"abstract": "Aper\u00e7u indisponible", "author": "N. Pontikos, R. McCreery", "color": "#97c2fc", "doi": "10.1016/0022-0728(92)80048-9", "id": "10.1016/0022-0728(92)80048-9", "isOrigin": true, "label": "N. Pontikos 1992", "nb_citations": 36, "shape": "dot", "size": 20, "title": "Microstructural and morphological changes induced in glassy carbon electrodes by laser irradiation", "url": "https://www.semanticscholar.org/paper/4064a11a6c84a04939ce16f6f4c35eb1f180caf2", "year": 1992}, {"abstract": "Aper\u00e7u indisponible", "author": "S. Yamada, H. Sato, T. Ishii", "color": "#97c2fc", "doi": "10.1016/0008-6223(64)90039-9", "id": "10.1016/0008-6223(64)90039-9", "isOrigin": true, "label": "S. Yamada 1964", "nb_citations": 40, "shape": "dot", "size": 20, "title": "Eigenschaften und Verwendung von glasartigem Kohlenstoff", "url": "https://www.semanticscholar.org/paper/6330fe85679d76a180ec894ccba30fe1d8a4ae78", "year": 1964}, {"abstract": "Unter der Voraussetzung, das die Elektrode nur einen potentialbestimmenden Vorgang enthalt und die Diffusionsvorgange durch die eindimensional einseitig unendlich ausgedehnte, ruhende Phase verlaufen, wird die theoretische Analyse der Stromspannungskurve der Randles-Sevcikschen Kathodenstrahl-Polarographie durchgefuhrt. Gemas der Grose der Reaktionsgeschwindigkeit des Elektrodenvorganges beim Gleichgewichtspotential kG konnen die Stromspannungskurven in drei Falle, namlich in reversible, \u201equasi\u201d-reversible und irreversible Falle, eingeteilt werden. Man erhalt bei 25\u00b0C \n \n1. den reversiblen Fall, wenn kG \u003e 0,3 \u221a n v (cm \u00b7 sec\u22121), \n \n2. den \u201equasi\u201d-reversiblen Fall, wenn 0, 3 \u221a n v \u003e kG \u003e 2.10\u22125 \u221a n v (cm \u00b7 sec\u22121), \n \n3. den irreversiblen Fall, wenn kG \u003c 2 \u00b7 10\u22125 \u221an v (cm \u00b7 sec\u22121). \n \n(n = Zahl der Elektronen, die bei dem Elektrodenvorgang aufgenommen bzw. abgegeben werden, v = Geschwindigkeit der Spannungsanderung.) Fur jeden Fall wird die allgemeine Formel der Stromspannungskurve abgeleitet. Weiterhin ergeben sich auch die Ausdrucke fur die Spitzenstromstarke, das Spitzenpotential und die Differenz zwischen dem Halbspitzen- und Spitzenpotential. \n \nZuletzt zeigt es sich, das man den Durchtrittsfaktor und die Reaktionsgeschwindigkeit des Elektrodenvorganges aus den experimentellen Daten fur diese drei charakteristischen Werte ermitteln kann. Als Beispiele werden fur einige Ionen die Auswertungen durchgefuhrt.", "author": "H. Matsuda, Y. Ayabe", "color": "#97c2fc", "doi": "10.1002/bbpc.19550590605", "id": "10.1002/bbpc.19550590605", "isOrigin": false, "label": "H. Matsuda 1955", "nb_citations": 104, "shape": "dot", "size": 22, "title": "Zur Theorie der Randles\u2010Sev\u010dikschen Kathodenstrahl\u2010Polarographie", "url": "https://www.semanticscholar.org/paper/bf81224f6be18254ada27d98d4bbaf7f56273489", "year": 1955}, {"abstract": "Thermodynamics drive the spontaneous dissolution of a graphite intercalation compound (GIC) KC(8) in NMP to form stable solutions. Reduction potential of graphene is measured at +22 mV vs. SCE. Single layer graphene flakes (ca. 1 \u03bcm(2)) have been unambiguously identified by electron diffraction.", "author": "Am\u00e9lie Catheline, C. Vall\u00e9s, C. Drummond, L. Ortolani, V. Morandi, M. Marcaccio, Matteo Iurlo, F. Paolucci, A. P\u00e9nicaud", "color": "#97c2fc", "doi": "10.1039/c1cc11100k", "id": "10.1039/c1cc11100k", "isOrigin": true, "label": "Am\u00e9lie Catheline 2011", "nb_citations": 23, "shape": "dot", "size": 20, "title": "Graphene solutions.", "url": "https://www.semanticscholar.org/paper/d08ae499235ef69f1ba66309e034e8ced1134da8", "year": 2011}, {"abstract": "Growing interest in graphene over past few years has prompted researchers to find new routes for producing this material other than mechanical exfoliation or growth from silicon carbide. Chemical vapor deposition on metallic substrates now allows researchers to produce continuous graphene films over large areas. In parallel, researchers will need liquid, large scale, formulations of graphene to produce functional graphene materials that take advantage of graphene\u0027s mechanical, electrical, and barrier properties. In this Account, we describe methods for creating graphene solutions from graphite. Graphite provides a cheap source of carbon, but graphite is insoluble. With extensive sonication, it can be dispersed in organic solvents or water with adequate additives. Nevertheless, this process usually creates cracks and defects in the graphite. On the other hand, graphite intercalation compounds (GICs) provide a means to dissolve rather than disperse graphite. GICS can be obtained through the reaction of alkali metals with graphite. These compounds are a source of graphenide salts and also serve as an excellent electronic model of graphene due to the decoupling between graphene layers. The graphenide macroions, negatively charged graphene sheets, form supple two-dimensional polyelectrolytes that spontaneously dissolve in some organic solvents. The entropic gain from the dissolution of counterions and the increased degrees of freedom of graphene in solution drives this process. Notably, we can obtain graphenide solutions in easily processable solvents with low boiling points such as tetrahydrofuran or cyclopentylmethylether. We performed a statistical analysis of high resolution transmission electronic micrographs of graphene sheets deposited on grids from GICs solution to show that the dissolved material has been fully exfoliated. The thickness distribution peaks with single layers and includes a few double- or triple-layer objects. Light scattering analysis of the solutions shows the presence of two-dimensional objects. The typical size of the dissolved flakes can be determined by either static or dynamic light scattering (DLS) using models available in the literature for disk-shape objects. A mean lateral size of ca. 1 \u03bcm is typically observed. We also used DLS to monitor the reaggregation that occurs as these sensitive solutions are exposed to air. The graphenide solutions reported in this Account can be used to deposit random arrays of graphene flakes and large single flakes of a lateral size of tens of micrometers onto different substrates. Using the graphenide solutions described in this Account, we foresee the large-scale production of graphene-based printings, coatings, and composites.", "author": "A. P\u00e9nicaud, C. Drummond", "color": "#97c2fc", "doi": "10.1021/ar300141s", "id": "10.1021/ar300141s", "isOrigin": false, "label": "A. P\u00e9nicaud 2013", "nb_citations": 88, "shape": "dot", "size": 21, "title": "Deconstructing graphite: graphenide solutions.", "url": "https://www.semanticscholar.org/paper/225b8e3a99cf7f50f1e939bc362fbad3ab0bdcc3", "year": 2013}, {"abstract": "We synthesized KC8 by simply mixing molten potassium and graphite at 180 \u00b0C under inert atmosphere. The KC8 shows typical shiny bronze color, Raman characteristics and XRD pattern of an efficiently intercalated stage 1 GIC, and is of sufficient quality to produce fully exfoliated graphenide solutions in tetrahydrofuran (THF) and subsequently single layer graphene in water as \u201deau de graphene\u201d (EdG). The evolution of absorption and Raman spectroscopic signatures of the EdG as a function of processing conditions give key indications on the number of layers of the graphene flakes dispersed in EdG. (\u00a9 2016 WILEY\u2010VCH Verlag GmbH \u0026Co. KGaA, Weinheim)", "author": "G. Bepete, F. Hof, Kai Huang, Katerina Kampioti, E. Anglaret, C. Drummond, A. P\u00e9nicaud", "color": "#97c2fc", "doi": "10.1002/pssr.201600167", "id": "10.1002/pssr.201600167", "isOrigin": false, "label": "G. Bepete 2016", "nb_citations": 19, "shape": "dot", "size": 20, "title": "\u201dEau de graphene\u201d from a KC8 graphite intercalation compound prepared by a simple mixing of graphite and molten potassium", "url": "https://www.semanticscholar.org/paper/d5e83dc6e1cda36804ca83fdde7ee7dd565ae76c", "year": 2016}, {"abstract": "Graphene is a 2D sheet of sp 2 -hybridized carbon with interesting properties, including exceptionally high thermal/electrical conductivity, surface area, and mechanical strength. [ 1\u20135 ] Many fabrication methods have been proposed to obtain graphene so as to utilize these interesting properties. The approaches to fabricate graphene can be roughly categorized into two classes: i) top-down exfoliation of multilayer graphene or graphite by breaking pi-bonding between carbon atoms, [ 6\u201310 ] and ii) bottom-up formation of sp 2 -bonding between carbon atoms in a monolayer. [ 11\u201316 ] Mechanical and chemical exfoliation methods fall into the fi rst category, while chemical vapor deposition (CVD) and epitaxial growth from silicon carbide (SiC) belong to the second. Flake-types of graphene promise potential applications in the fi elds of transparent electrodes, energy storage, electromagnetic (EM) shields, etc. [ 17\u201319 ] Dispersed graphene fl akes are mostly produced by a chemical exfoliation method, through chemical oxidation and reduction, known as Hummers\u2019 method. [ 20 ] Hummers\u2019 method is a lowcost process applicable to mass production. However, the quality of the achieved graphene is often below desired levels, mainly due to the presence of residual oxygen, even after a suffi cient reduction process. [ 21 ] Here, we fi rstly introduce a new method to acquire high-quality graphene fl akes by simply using metal salts without oxidation. Graphite intercalation compounds (GICs) are typically formed by the insertion of atomic or molecular species, called intercalants, between layers in a graphite host. The formation of GICs has been an active fi eld of research especially in relation to lithium ion batteries because graphite can store a large amount", "author": "Jiyoung Kwon, Sun Hwa Lee, Kwang-Hyun Park, D. Seo, Jinsup Lee, Byung-Seon Kong, K. Kang, Seokwoo Jeon", "color": "#97c2fc", "doi": "10.1002/smll.201002005", "id": "10.1002/smll.201002005", "isOrigin": false, "label": "Jiyoung Kwon 2011", "nb_citations": 70, "shape": "dot", "size": 21, "title": "Simple preparation of high-quality graphene flakes without oxidation using potassium salts.", "url": "https://www.semanticscholar.org/paper/d99035f082fee113497d74127ebec35dcfd7658c", "year": 2011}, {"abstract": "We have developed a solvothermal reduction method that affords more effective reduction of chemically derived graphene sheets and graphite oxide than low-temperature reduction methods. Solvothermal reduction removed oxygen and defects from graphene sheets, increased the size of sp(2) domains, and produced materials that were as conducting as pristine graphene and exhibited clear intrinsic Dirac behavior.", "author": "Hailiang Wang, J. Robinson, Xiaoling Li, H. Dai", "color": "#97c2fc", "doi": "10.1021/ja904251p", "id": "10.1021/ja904251p", "isOrigin": false, "label": "Hailiang Wang 2009", "nb_citations": 818, "shape": "dot", "size": 33, "title": "Solvothermal reduction of chemically exfoliated graphene sheets.", "url": "https://www.semanticscholar.org/paper/f74ff868f5147a349fd6f9fe78b7f370b888a18c", "year": 2009}, {"abstract": "The elastic constants of pyrolytic graphite which has been highly ordered by annealing under compressive stress have been determined by ultrasonic, sonic resonance, and static test methods. Ultrasonic tests yielded the elastic constants c11, c12, c33, c44 = 1/s44, and the stress derivative of c33. The moduli 1/s11 and c44 were determined from the free flexural resonant vibrations of bars, and the shear modulus c44 also was determined from the fundamental torsional resonance of the bars and from the resonance of compound torsion oscillators composed of thin graphite disks with steel end pieces. Static tension, compression, and torsion tests on the pyrolytic graphite yielded a complete set of compliances (s11, s12, s13, s33, and s44). The following self\u2010consistent set of elastic constants (cij in units of 1011 dyn/cm2; sij in 10\u221211 cm2/dyn) has been deduced from the results: c11 = 106\u00b12, c12 = 18\u00b12, c33 = 3.65\u00b10.10, c13 = 1.5\u00b10.5, c44 = 0.018 to 0.035, 1/s11 = 102\u00b13, 1/s33 = 3.65\u00b10.10, s12 = \u22120.0016\u00b10.0006,...", "author": "O. L. Blakslee, D. G. Proctor, E. J. Seldin, G. B. Spence, T. Weng", "color": "#97c2fc", "doi": "10.1063/1.1659428", "id": "10.1063/1.1659428", "isOrigin": false, "label": "O. L. Blakslee 1970", "nb_citations": 816, "shape": "dot", "size": 33, "title": "Elastic Constants of Compression-Annealed Pyrolytic Graphite", "url": "https://www.semanticscholar.org/paper/b329fe58ddb9e3ea038521323d0a6ecfea5cd738", "year": 1970}, {"abstract": "The combination of Raman spectroscopy and high-pressure techniques provides a unique method for studying the mechanical and structural response of carbon-based materials. Existing Raman studies on graphite under pressure were restricted to the analysis of the so-called G band, because the Raman signal from the diamond anvils overlaps other characteristic Raman features, like the D band. Here, we present a Raman spectroscopy study of highly oriented pyrolytic graphite (HOPG) under uniaxial stress using moissanite anvils. The use of moissanite has allowed us to observe, for the first time, the evolution of the D band under extreme compression. We have employed several excitation wavelengths: 632.8, 532.0 and 488.0 nm, to further study dispersion effects. Our results have important implications on the interpretation of high-pressure Raman results on several families of carbon-based compounds.", "author": "E. Del Corro, Jes\u00fas D. Gonz\u00e1lez, M. Taravillo, W. Escoffier, V. Baonza", "color": "#97c2fc", "doi": "10.1080/08957950802444796", "id": "10.1080/08957950802444796", "isOrigin": false, "label": "E. Del Corro 2008", "nb_citations": 2, "shape": "dot", "size": 20, "title": "Graphite under non-hydrostatic conditions", "url": "https://www.semanticscholar.org/paper/0f8a429069bf90e8168c6256b846ee593e9ab47b", "year": 2008}, {"abstract": "Aper\u00e7u indisponible", "author": "Nobuya Nakae, Jun Ishisada, K. Shirai, A. Yanase", "color": "#97c2fc", "doi": "10.1016/j.jpcs.2009.12.003", "id": "10.1016/j.jpcs.2009.12.003", "isOrigin": false, "label": "Nobuya Nakae 2010", "nb_citations": 4, "shape": "dot", "size": 20, "title": "Fermi surface and metallic properties of graphite at high pressures", "url": "https://www.semanticscholar.org/paper/dd719b81b300116e4eb78f2b70658edc8e87f60a", "year": 2010}, {"abstract": "Aper\u00e7u indisponible", "author": "Y. Baskin, L. Meyer", "color": "#97c2fc", "doi": "10.1103/physrev.100.544", "id": "10.1103/physrev.100.544", "isOrigin": false, "label": "Y. Baskin 1955", "nb_citations": 432, "shape": "dot", "size": 27, "title": "Lattice Constants of Graphite at Low Temperatures", "url": "https://www.semanticscholar.org/paper/ab1a8496dab46526f27199948527d09c76df7d14", "year": 1955}, {"abstract": "The room-temperature Raman signatures from graphene layers on sapphire and glass substrates were compared with those from graphene on GaAs substrate and on the standard Si/SiO2 substrate, which served as a reference. It was found that while G peak of graphene on Si/SiO2 and GaAs is positioned at 1580 cm -1 it is down-shifted by ~5 cm -1 for graphene-on-sapphire (GOS) and, in many cases, splits into doublets for graphene-on-glass (GOG) with the central frequency around 1580 cm -1 . The obtained results are important for graphene characterization and its proposed graphene applications in electronic devices.", "author": "I. Calizo, W. Bao, F. Miao, C. N. Lau, A. Balandin", "color": "#97c2fc", "doi": "10.1063/1.2805024", "id": "10.1063/1.2805024", "isOrigin": false, "label": "I. Calizo 2007", "nb_citations": 181, "shape": "dot", "size": 23, "title": "Graphene-on-Sapphire and Graphene-on-Glass: Raman Spectroscopy Study", "url": "https://www.semanticscholar.org/paper/a257f8287712c94ee0c9767df2c29c690c50723f", "year": 2007}, {"abstract": "Using 514 nm radiation and a careful experimental protocol allowing us to make quantitative intensity analyses, we have examined the first- and second-order Raman spectra of five varieties of graphite. These include single-crystal graphite and highly oriented pyrolytic graphite as references, then two with a significant content of c-axis translation faults introduced through grinding and exfoliation, and a last sample which is purely turbostratic. We show that full c-axis stacking disorder results in a strong increase of the scattered E2g-mode intensity. We have further shown that even in those strongly disordered stacking sequences, but in which the AB sequence persists over only a few layers, the doublet around 2700 cm\u22121 is resolved. We argue against assigning the peak around 1355 cm\u22121 to \u201cdisorder,\u201d as is so often done, but to the finite in-plane domain size as proposed a number of years ago; moreover, we suggest that this peak is a more sensitive probe of such small domains than is x-ray diffraction.", "author": "H. Wilhelm, M. Lelaurain, E. Mcrae, B. Humbert", "color": "#97c2fc", "doi": "10.1063/1.369027", "id": "10.1063/1.369027", "isOrigin": false, "label": "H. Wilhelm 1998", "nb_citations": 166, "shape": "dot", "size": 23, "title": "Raman spectroscopic studies on well-defined carbonaceous materials of strong two-dimensional character", "url": "https://www.semanticscholar.org/paper/e7fcde0908998ebe69d8344b8a221271e3f08155", "year": 1998}, {"abstract": "Aper\u00e7u indisponible", "author": "E. D. Corro, M. Taravillo, Jes\u00fas Gonz\u00e1lez, V. Baonza", "color": "#97c2fc", "doi": "10.1016/j.carbon.2010.09.064", "id": "10.1016/j.carbon.2010.09.064", "isOrigin": false, "label": "E. D. Corro 2011", "nb_citations": 31, "shape": "dot", "size": 20, "title": "Raman characterization of carbon materials under non-hydrostatic conditions", "url": "https://www.semanticscholar.org/paper/63c8fad5b65cd2a721339c1370063e508034c5a0", "year": 2011}, {"abstract": "s 207", "author": "R. Weiland, D. Lupton, B. Fischer, J. Merker, C. Scheckenbach, J. Witte", "color": "#97c2fc", "doi": "10.1595/147106706x154198", "id": "10.1595/147106706x154198", "isOrigin": true, "label": "R. Weiland 2006", "nb_citations": 96, "shape": "dot", "size": 22, "title": "High-Temperature Mechanical Properties of the Platinum Group Metals", "url": "https://www.semanticscholar.org/paper/b18c92801fbdcb8c3d34512a4ec9b87aa334ccd6", "year": 2006}, {"abstract": "Aper\u00e7u indisponible", "author": "C. Maiti", "color": "#97c2fc", "doi": "10.1016/j.sse.2004.03.001", "id": "10.1016/j.sse.2004.03.001", "isOrigin": false, "label": "C. Maiti 2004", "nb_citations": 5, "shape": "dot", "size": 20, "title": "EditorialSpecial issue on strained-si heterostructures and devices", "url": "https://www.semanticscholar.org/paper/b85f1a377cb9f8b9c58c2cf78b4a994ca8f1f493", "year": 2004}, {"abstract": "Aper\u00e7u indisponible", "author": "A. Dekanski, J. Stevanovic, Rade Stevanovi\u0107, B. Nikoli\u0107, V. Jovanovi\u0107", "color": "#97c2fc", "doi": "10.1016/s0008-6223(00)00228-1", "id": "10.1016/s0008-6223(00)00228-1", "isOrigin": true, "label": "A. Dekanski 2001", "nb_citations": 236, "shape": "dot", "size": 24, "title": "Glassy carbon electrodes: I. Characterization and electrochemical activation", "url": "https://www.semanticscholar.org/paper/7789cae5300305aa7f0183707bd25a094bb6e189", "year": 2001}, {"abstract": "Glassy carbon (GC) surfaces modified with monolayers of biphenyl and nitrobiphenyl molecules were examined as voltammetric electrodes for ferrocene, benzoquinone, and tetracyanoquinodimethane electrochemistry in acetonitrile. The modified electrodes exhibited slower electron transfer than unmodified GC, by factors that varied with the monolayer and redox system. However, after a negative potential excursion to approximately -2.0 V versus Ag+/Ag, the modified electrodes exhibited much faster electron-transfer kinetics, approaching those observed on unmodified GC. The effect is attributed to an apparently irreversible structural change in the biphenyl or nitrobiphenyl monolayer, which increases the rate of electron tunneling. The transition to the \"ON\" state is associated with electron injection into the monolayer similar to that observed in previous spectroscopic investigations and causes a significant decrease in the calculated HOMO-LUMO gap for the monolayer molecule. Once the monolayer is switched ON, it supports rapid electron exchange with outer-sphere redox systems, but not with dopamine, which requires adsorption to the GC surface. The increase in electron-transfer rate with electron injection is consistent with an increase in electron tunneling rate through the monolayer, caused by a significant decrease in tunneling barrier height. The ON electrode can reduce biphenyl- or nitrobiphenyldiazonium reagent in solution to permit formation of a second modification layer of biphenyl or nitrobiphenyl molecules. This \"double derivatization\" procedure was used to prepare tetraphenyl- and nitrotetraphenyl-modified electrodes, which exhibit significantly slower electron transfer than their biphenyl and nitrobiphenyl counterparts. A \"switching\" electrode may have useful properties for electroanalytical applications and possibly in electrocatalysis. In addition, the ON state represents an \"organic electrode\" in which electron transfer occurs at an interface between an organic conductor and a solution rather than an interface between a solution and a metal or carbon electrode.", "author": "A. Solak, Laura R Eichorst, W. J. Clark, R. McCreery", "color": "#97c2fc", "doi": "10.1021/ac026107h", "id": "10.1021/ac026107h", "isOrigin": false, "label": "A. Solak 2003", "nb_citations": 104, "shape": "dot", "size": 22, "title": "Modified carbon surfaces as \"organic electrodes\" that exhibit conductance switching.", "url": "https://www.semanticscholar.org/paper/a34167ad6a538064984564a935a65bce78d22404", "year": 2003}, {"abstract": "Aper\u00e7u indisponible", "author": "J. Grace, G. Kennedy", "color": "#97c2fc", "doi": "10.1016/0022-3697(67)90214-4", "id": "10.1016/0022-3697(67)90214-4", "isOrigin": true, "label": "J. Grace 1967", "nb_citations": 41, "shape": "dot", "size": 20, "title": "The melting curve of five gases to 30 KB", "url": "https://www.semanticscholar.org/paper/5fff269ab4bbbe0f0f440a5dc85a345e68da5fe8", "year": 1967}, {"abstract": "Aper\u00e7u indisponible", "author": "G. Jelinek", "color": "#97c2fc", "doi": "10.1103/physrevb.3.2724", "id": "10.1103/physrevb.3.2724", "isOrigin": false, "label": "G. Jelinek 1971", "nb_citations": 6, "shape": "dot", "size": 20, "title": "Properties of Crystalline Argon, Krypton, and Xenon Based upon the Born and Huang Method of Homogeneous Deformations. II. Equation of State and Melting Lines", "url": "https://www.semanticscholar.org/paper/fe8e3d64ddadf381182b567a8ec93aa2d6f8aa12", "year": 1971}, {"abstract": "Aper\u00e7u indisponible", "author": "J. Watts", "color": "#97c2fc", "doi": "10.1002/sia.740200310", "id": "10.1002/sia.740200310", "isOrigin": true, "label": "J. Watts 1993", "nb_citations": 73, "shape": "dot", "size": 21, "title": "High resolution XPS of organic polymers: The Scienta ESCA 300 database. G. Beamson and D. Briggs. 280pp., \u00a365. John Wiley \u0026 Sons, Chichester, ISBN 0471 935921, (1992)", "url": "https://www.semanticscholar.org/paper/16329677286dd2ef803547edcd2e627f6f8551ae", "year": 1993}, {"abstract": "XPS techniques have been used to characterize electrically conducting films of polypyrrole and polybithiophenes as grown electrochemically. These techniques have yielded information not only on the nature of the polymeric cation and its counter anion but also on the structural disorder in these polymers. In particular the N1s spectra have revealed a nonuniformity in the distribution of the anions relative to the nitrogen atoms and the C1s spectra clearly show that as many as 1/3 of the pyrrole rings can be different from the rest. Significant improvement in the structural order is achieved by blocking the \u03b2 sites on the pyrrole ring with methyl groups to ensure a completely \u03b1,\u03b1\u2032 bonded polymer. Similar experiments on polybithiophene polymers show that this polymer is considerably more ordered than polypyrrole. The XPS results are best interpreted by assigning a nonmetallic character to the pyrrole polymers, in accordance with other experiments.XPS techniques have been used to characterize electrically conducting films of polypyrrole and polybithiophenes as grown electrochemically. These techniques have yielded information not only on the nature of the polymeric cation and its counter anion but also on the structural disorder in these polymers. In particular the N1s spectra have revealed a nonuniformity in the distribution of the anions relative to the nitrogen atoms and the C1s spectra clearly show that as many as 1/3 of the pyrrole rings can be different from the rest. Significant improvement in the structural order is achieved by blocking the \u03b2 sites on the pyrrole ring with methyl groups to ensure a completely \u03b1,\u03b1\u2032 bonded polymer. Similar experiments on polybithiophene polymers show that this polymer is considerably more ordered than polypyrrole. The XPS results are best interpreted by assigning a nonmetallic character to the pyrrole polymers, in accordance with other experiments.", "author": "P. Pfluger, G. Street", "color": "#97c2fc", "doi": "10.1063/1.446428", "id": "10.1063/1.446428", "isOrigin": false, "label": "P. Pfluger 1984", "nb_citations": 251, "shape": "dot", "size": 24, "title": "Chemical, electronic, and structural properties of conducting heterocyclic polymers: A view by XPS", "url": "https://www.semanticscholar.org/paper/3bd87ab3574b7ac750f2d5f718410c5e00a014a6", "year": 1984}, {"abstract": "Molecularly imprinted polymers are synthetic receptors for a targeted molecule. As such, they are analogues of the natural antibody-antigen systems. In this review, after a recounting of the early history of the general field, we specifically focus on the application of these polymers as sensors. In these applications, the polymers are paired with a reporting system, which may be electrical, electrochemical, optical, or gravimetric. The presence of the targeted molecule effects a change in the reporting agent, and a calibrated quantity of the target is recorded. In this review, we describe the imprinted polymer production processes, the techniques used for reporting, and the applications of the reported sensors. A brief survey of recent applications to gas-phase sensing is included, but the focus is primarily on the development of sensors for targets in solution. Included among the applications are those designed to detect toxic chemicals, toxins in foods, drugs, explosives, and pathogens. The application of computational chemistry to the development of new imprinted polymers is included as is a brief assessment of future developments.", "author": "J. BelBruno", "color": "#97c2fc", "doi": "10.1021/acs.chemrev.8b00171", "id": "10.1021/acs.chemrev.8b00171", "isOrigin": false, "label": "J. BelBruno 2018", "nb_citations": 950, "shape": "dot", "size": 35, "title": "Molecularly Imprinted Polymers.", "url": "https://www.semanticscholar.org/paper/1521afa97df7c4a9fe22962161b14e0f3a666ae4", "year": 2018}, {"abstract": "La comparaison des intensites theoriques et des intensites experimentales, realisee sur la forme \u03b2 du poly(fluorure de vinylidene) orientee monoaxialement nous a permis d\u0027attribuer les raies Raman observees aux differents modes de vibration de la cha\u01d0ne. Nous precisons plus particulierement l\u0027attribution des raies de frequences 1278, 882 et 840 cm\u22121 (raies qui subissent une profonde modification lors de la transition ferro\u2013paraelectrique des copolymeres contenant du PVF2\u03b2) aux mouvements \u03bds(CC), \u03c1(CH2) et \u03bds(CF2), respectivement. Enfin, nos resultats verifient que les groupements CH2 et CF2 conservent une bonne individualite dans la cha\u01d0ne du polymere. \n \n \n \nA comparison between theoretical and experimental intensities obtained for a uniaxially oriented film of the \u03b2-phase of poly(vinylidene fluoride) enabled the observed Raman bands to be assigned to the different vibrational modes of the polymer chain. In particular the 1278, 882 and 840 cm\u22121 frequencies (which show a large conformational change during the ferro\u2013paraelectric transition occurring in vinylidene fluoride\u2013trifluoroethylene copolymer) are attributed to \u03bds(CC), \u03c1(CH2) and \u03bds(CF2) vibrations, respectively. The results confirm that the CH2 and CF2 groups maintain their individuality in the polymeric chain.", "author": "A. Armengaud, J. Ramonja, M. Abenoza", "color": "#97c2fc", "doi": "10.1002/jrs.1250180208", "id": "10.1002/jrs.1250180208", "isOrigin": false, "label": "A. Armengaud 1987", "nb_citations": 2, "shape": "dot", "size": 20, "title": "Intensit\u00e9s Raman et Attribution des Modes dans le Poly(Fluorure de Vinylid\u00e8ne) en Phase \u03b2", "url": "https://www.semanticscholar.org/paper/97396f5f2014fb3dfb01a200d7f182c96df14781", "year": 1987}, {"abstract": "Aper\u00e7u indisponible", "author": "E. Kang, K. Neoh, K. L. Tan, B. T. G. Tan", "color": "#97c2fc", "doi": "10.1016/0379-6779(89)90629-2", "id": "10.1016/0379-6779(89)90629-2", "isOrigin": false, "label": "E. Kang 1989", "nb_citations": 3, "shape": "dot", "size": 20, "title": "XPS studies of some chemically-synthesized polypyridazine-acceptor complexes", "url": "https://www.semanticscholar.org/paper/c64b9e45e2cfb03db6de6db55bbebd61eade5beb", "year": 1989}, {"abstract": "Aper\u00e7u indisponible", "author": "J. Rusling", "color": "#97c2fc", "doi": "10.1021/ac00267a061", "id": "10.1021/ac00267a061", "isOrigin": false, "label": "J. Rusling 1984", "nb_citations": 40, "shape": "dot", "size": 20, "title": "Variations in electron-transfer rate at polished gla ) with a common electrochemical redox probe (such as hexaammine-ruthenium(III) chloride), which consequently allows information on the electrochemical properties of the electrode being utilised to be obtained and monitored throughout its application. This approach is explored using a range of commonly encountered carbonaceous electrode materials, including various graphene configurations, such as monolayer, double- and few-layered graphene electrodes \u2013 the latter is reported for the first time. The variability in structural quality and stability of the graphene electrodes used (particularly between batches) highlights the necessity for implementation of such approaches within the literature. This work provides a simple, yet effective option for the in situ electrochemical characterisation of various electrode materials, essential where the quality and composition of a \u2018reported\u2019 electrode material can vary greatly depending on its fabrication (batch-to-batch quality) or during the course of experimental use.", "author": "D. A. Brownson, P. Kelly, C. Banks", "color": "#97c2fc", "doi": "10.1039/c5ra03049h", "id": "10.1039/c5ra03049h", "isOrigin": false, "label": "D. A. Brownson 2015", "nb_citations": 54, "shape": "dot", "size": 21, "title": "In situ electrochemical characterisation of graphene and various carbon-based electrode materials: an internal standard approach", "url": "https://www.semanticscholar.org/paper/5d207993a7dbcd65a33b456b708fcf3e6cfd306b", "year": 2015}, {"abstract": "Aper\u00e7u indisponible", "author": "R. Forster", "color": "#97c2fc", "doi": "10.1039/cs9942300289", "id": "10.1039/cs9942300289", "isOrigin": false, "label": "R. Forster 1994", "nb_citations": 195, "shape": "dot", "size": 23, "title": "Microelectrodes: new dimensions in electrochemistry", "url": "https://www.semanticscholar.org/paper/8617f018cdc69c8a2f2c8efd49adacc7584f003a", "year": 1994}, {"abstract": "Aper\u00e7u indisponible", "author": "P. Kovach, W. Caudill, D. Pe
