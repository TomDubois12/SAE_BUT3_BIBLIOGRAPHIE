emanticscholar.org/paper/1b9a4443379b5c486fb509ba0beecba92385db9f", "year": 1957}, {"abstract": "was developed for solving the integral equations obtained from the boundary value problems, and extensive data were calculated which permit construction of stationary electrode polarograms from theory. Correlations of kinetic and experimental parameters made it possible to develop diagnostic criteria so that unknown systems can be characterized by studying the variation of peak current, half-peak potential, or ratio of anodic to cathodic peak currents as a function of rate of voltage scan.", "author": "R. Nicholson, I. Shain", "color": "blue", "doi": "10.1021/ac60210a007", "id": "10.1021/ac60210a007", "isOrigin": false, "label": "R. Nicholson 1964", "nb_citations": 4412, "primaryNode": false, "shape": "dot", "size": 68, "title": "Theory of Stationary Electrode Polarography. Single Scan and Cyclic Methods Applied to Reversible, Irreversible, and Kinetic Systems.", "url": "https://www.semanticscholar.org/paper/0b7a6d01e3c50ef8af24a38edf24e8ca64ee880b", "year": 1964}, {"abstract": "Aper\u00e7u indisponible", "author": "A. Saha, S. Chattopadhyay, C. Maiti", "color": "blue", "doi": "10.1016/j.sse.2004.02.015", "id": "10.1016/j.sse.2004.02.015", "isOrigin": false, "label": "A. Saha 2004", "nb_citations": 14, "primaryNode": false, "shape": "dot", "size": 20, "title": "Contact metallization on strained-Si", "url": "https://www.semanticscholar.org/paper/18fb461919de43798e6a09d0425b15b2b0fddca6", "year": 2004}, {"abstract": "The different steps that have to be taken in order to derive information about local mechanical stress in silicon using micro\u2010Raman spectroscopy experiments, including theoretical and experimental aspects, are discussed. It is shown that the calculations are in general less complicated when they are done in the axes system of the sample. For that purpose, the secular equation is calculated in the axes system [110], [\u2212110], [001], which is important for microelectronics structures. The theory relating Raman mode shift with stress tensor components is applied using two analytical stress models: uniaxial stress and planar stress. The results of these models are fitted to data from micro\u2010Raman spectroscopy experiments on Si3N4/poly\u2010Si lines on silicon substrate. In this fit procedure, the dimensions of the laser spot and its penetration depth in the substrate are also taken into account.", "author": "Ingrid De Wolf, H. E. Maes, Stephen K. Jones", "color": "blue", "doi": "10.1063/1.361485", "id": "10.1063/1.361485", "isOrigin": false, "label": "Ingrid De Wolf 1996", "nb_citations": 330, "primaryNode": false, "shape": "dot", "size": 26, "title": "Stress measurements in silicon devices through Raman spectroscopy: Bridging the gap between theory and experiment", "url": "https://www.semanticscholar.org/paper/d01e0d1b9c70af83d10628ef9731b76a3d534a97", "year": 1996}, {"abstract": "We exploit the concept of strain-induced band-structure engineering in graphene through the calculation of its electronic properties under uniaxial, shear, and combined uniaxial-shear deformations. We show that by combining shear deformations to uniaxial strains it is possible modulate the graphene energy-gap value from zero up to 0.9 eV. Interestingly enough, the use of a shear component allows for a gap opening at moderate absolute deformation, safely smaller than the graphene failure strain.", "author": "G. Cocco, E. Cadelano, L. Colombo", "color": "blue", "doi": "10.1103/physrevb.81.241412", "id": "10.1103/physrevb.81.241412", "isOrigin": false, "label": "G. Cocco 2010", "nb_citations": 261, "primaryNode": false, "shape": "dot", "size": 25, "title": "Gap opening in graphene by shear strain", "url": "https://www.semanticscholar.org/paper/12303860d2dc0d54965573169c94e8c3eb68c9e5", "year": 2010}, {"abstract": "Caracterisation par spectrometrie XPS et AES de surfaces de carbone vitreuse apres exposition a l\u0027oxygene et au dioxyde de carbone. La decomposition chimique ulterieure est etudiee par la methode de la decomposition a temperature programmee. Cette etude permet de caracteriser la premiere etape de la gazeification et de la combustion du charbon", "author": "S. Kelemen, H. Freund", "color": "blue", "doi": "10.1021/ef00008a001", "id": "10.1021/ef00008a001", "isOrigin": false, "label": "S. Kelemen 1988", "nb_citations": 47, "primaryNode": false, "shape": "dot", "size": 21, "title": "XPS Characterization of glassy-carbon surfaces oxidized by O2, CO2, and HNO3", "url": "https://www.semanticscholar.org/paper/4ffbcfb532310f55379c52c69f7ebced2fa7d39d", "year": 1988}, {"abstract": "Aper\u00e7u indisponible", "author": "K. Jurkiewicz, K. Jurkiewicz, M. Pawlyta, Dorota Zygad\u0142o, Dorota Zygad\u0142o, D. Chrobak, D. Chrobak, S. Duber, R. Wrzalik, R. Wrzalik, A. Ratuszna, A. Ratuszna, A. Burian, A. Burian", "color": "blue", "doi": "10.1007/s10853-017-1753-7", "id": "10.1007/s10853-017-1753-7", "isOrigin": false, "label": "K. Jurkiewicz 2018", "nb_citations": 120, "primaryNode": false, "shape": "dot", "size": 22, "title": "Evolution of glassy carbon under heat treatment: correlation structure\u2013mechanical properties", "url": "https://www.semanticscholar.org/paper/e5e7cd06acecd446ebc2e244d4b05db21fed8e82", "year": 2018}, {"abstract": "Aper\u00e7u indisponible", "author": "K. Stutts, P. Kovach, W. Kuhr, R. Wightman", "color": "blue", "doi": "10.1021/ac00260a050", "id": "10.1021/ac00260a050", "isOrigin": false, "label": "K. Stutts 1983", "nb_citations": 109, "primaryNode": false, "shape": "dot", "size": 22, "title": "Enhanced electrochemical reversibility at heat-treated glassy carbon electrodes", "url": "https://www.semanticscholar.org/paper/bbcd3a6ce8b0f9a9d610531e0fd352fce002542f", "year": 1983}, {"abstract": "Etudes de l\u0027activation des electrodes de carbones vitreux vis\u2015a-vis du transfert d\u0027electrons faisant intervenir un transfert d\u0027electron couple au proton. L\u0027activation oxydative des electrodes de carbone vitreux conduit a la catalyse du transfert de charge heterogene pour les couples redox comprenant du pyrocatechol, (bpy) 2 (H 2 O)Ru(OH) 2+ avec bpy=bipyridyle-2,2\u0027 et (NH 3 ) 5 Ru(OH) 2+ , ou il y a changement du taux de protons lors de l\u0027oxydation", "author": "G. Cabaniss, A. Diamantis, W. R. Murphy, R. W. Linton, T. Meyer", "color": "blue", "doi": "10.1021/ja00293a007", "id": "10.1021/ja00293a007", "isOrigin": false, "label": "G. Cabaniss 1985", "nb_citations": 291, "primaryNode": false, "shape": "dot", "size": 25, "title": "Electrocatalysis of proton-coupled electron-transfer reactions at glassy carbon electrodes", "url": "https://www.semanticscholar.org/paper/f184da7c1b01579e88388cf26c6c54ec1ad20b23", "year": 1985}, {"abstract": "Aper\u00e7u indisponible", "author": "K. Rajeshwar, Jorge G. Ibanez, Greg M. Swain", "color": "blue", "doi": "10.1007/bf00241305", "id": "10.1007/bf00241305", "isOrigin": false, "label": "K. Rajeshwar 1994", "nb_citations": 453, "primaryNode": false, "shape": "dot", "size": 28, "title": "Electrochemistry and the environment", "url": "https://www.semanticscholar.org/paper/1e8050153c1160f3f26a0e702ead065d7b6c8bcf", "year": 1994}, {"abstract": "Aper\u00e7u indisponible", "author": "J. Rusling", "color": "blue", "doi": "10.1021/ac00267a061", "id": "10.1021/ac00267a061", "isOrigin": false, "label": "J. Rusling 1984", "nb_citations": 40, "primaryNode": false, "shape": "dot", "size": 20, "title": "Variations in electron-transfer rate at polished glassy carbon electrodes exposed to air", "url": "https://www.semanticscholar.org/paper/09fc80a56985780457da9d261fee1da2887047bc", "year": 1984}, {"abstract": "Aper\u00e7u indisponible", "author": "A. Dekanski, J. Stevanovic, Rade Stevanovi\u0107, B. Nikoli\u0107, V. Jovanovi\u0107", "color": "blue", "doi": "10.1016/s0008-6223(00)00228-1", "id": "10.1016/s0008-6223(00)00228-1", "isOrigin": false, "label": "A. Dekanski 2001", "nb_citations": 236, "primaryNode": false, "shape": "dot", "size": 24, "title": "Glassy carbon electrodes: I. Characterization and electrochemical activation", "url": "https://www.semanticscholar.org/paper/7789cae5300305aa7f0183707bd25a094bb6e189", "year": 2001}, {"abstract": "The kinetic parameters (K o and \u03b1) of a uncomplicated quasi-reversible electrochemical reaction studied by any steady-state voltammatric technique can be found directly from the values of two easily accessible experimental parameters, (E 1/4 -E 1/2 ) and (E 1/2 -E 3/4 ), where E 1/2 is the experimental half-wave potential and E 1/4 and E 3/4 are voltammetric quartile potentials", "author": "M. Mirkin, A. Bard", "color": "blue", "doi": "10.1021/ac00043a020", "id": "10.1021/ac00043a020", "isOrigin": false, "label": "M. Mirkin 1992", "nb_citations": 185, "primaryNode": false, "shape": "dot", "size": 23, "title": "Simple analysis of quasi-reversible steady-state voltammograms", "url": "https://www.semanticscholar.org/paper/a2ecf65f0017b37d0d066af7b7eba177e859cfb7", "year": 1992}, {"abstract": "The cyclic voltammetric response of partially blocked electrodes is modeled using finite difference simulations, and a method is presented for the determination of currents at electrode surfaces that have an unstructured blocking pattern. The method is first applied to predict the current at purposely fabricated gold film electrodes in which monodispersed blocking disks are randomly sprinkled over the gold surface. The theoretical models are subsequently applied to the case of a basal plane pyrolytic graphite electrode modified with microdroplets of an electrochemically inactive oil. The theoretically predicted results are in good agreement with those observed experimentally.", "author": "T. J. Davies, B. A. Brookes, A. Fisher, K. Yunus, S. J. Wilkins, Phillip R. Greene, J. Wadhawan, R. Compton", "color": "blue", "doi": "10.1021/jp022616b", "id": "10.1021/jp022616b", "isOrigin": false, "label": "T. J. Davies 2003", "nb_citations": 74, "primaryNode": false, "shape": "dot", "size": 21, "title": "A Computational and Experimental Study of the Cyclic Voltammetry Response of Partially Blocked Electrodes. Part II: Randomly Distributed and Overlapping Blocking Systems", "url": "https://www.semanticscholar.org/paper/d598c945b9166248923df370d5ab9e7520a7038f", "year": 2003}, {"abstract": "The cyclic voltammetry at electrodes composed of multiple electroactive materials, where zones of one highly active material are distributed over a substrate of a second, less active material, is investigated by simulation. The two materials are assumed to differ in terms of their electrochemical rate constants towards any given redox couple. For a one-electron oxidation or reduction, the effect on voltammetry of the size and relative surface coverages of the zones as well as the rate constant of the slower zone are considered for systems where it is much slower than the rate constant of the faster zones. The occurrence of split peak cyclic voltammetry where two peaks are observed in the forward sweep, is studied in terms of the diffusional effects present in the system. A number of surface geometries are compared: specifically the more active zones are modelled as long, thin bands, as steps in the surface, as discs, and as rings (similar to a partially blocked electrode). Similar voltammetry for the band, step and ring models is seen but the disc geometry shows significant differences. Finally, the simulation technique is applied to the modelling of highly-ordered pyrolytic graphite (HOPG) surface and experimental conditions under which it may be possible to observe split peak voltammetry are predicted.", "author": "Kristopher R. Ward, N. Lawrence, R. S. Hartshorne, R. Compton", "color": "blue", "doi": "10.1039/c2cp40412e", "id": "10.1039/c2cp40412e", "isOrigin": false, "label": "Kristopher R. Ward 2012", "nb_citations": 35, "primaryNode": false, "shape": "dot", "size": 20, "title": "The theory of cyclic voltammetry of electrochemically heterogeneous surfaces: comparison of different models for surface geometry and applications to highly ordered pyrolytic graphite.", "url": "https://www.semanticscholar.org/paper/b35bc8bd2d6f5beeba50af92af23c62480fd805b", "year": 2012}, {"abstract": "Aper\u00e7u indisponible", "author": "R. J. Klingler, J. Kochi", "color": "blue", "doi": "10.1021/j150612a028", "id": "10.1021/j150612a028", "isOrigin": false, "label": "R. J. Klingler 1981", "nb_citations": 246, "primaryNode": false, "shape": "dot", "size": 24, "title": "Electron-transfer kinetics from cyclic voltammetry. Quantitative description of electrochemical reversibility", "url": "https://www.semanticscholar.org/paper/c13bbf9751add58dcdac24bf4ebc3c423c04f168", "year": 1981}, {"abstract": "The Raman spectra of ion-implanted highly oriented pyrolytic graphite (HOPG) are reported, in which an additional mode at 1083 cm(-1) and three doublet structures in the positions of similar to 1350, similar to 2450, and similar to 2710 cm(-1) are revealed. Noticeable frequency shifts are observed for all the Raman bands between the spectra excited with different laser powers, which are interpreted as the pure temperature effect and a downshift in the C-C stretching frequency induced by the thermal expansion. Moreover, the pure temperature effect (d omega/dT)(V) without anharmonic contribution is achieved in pristine HOPG. The results suggest that the pure temperature effect without anharmonic contribution plays an important role in the frequency shifts with temperature. (C) 1999 American Institute of Physics. [S0003-6951(99)01313-3].", "author": "P. Tan, Yuanming Deng, Qian Zhao, W. Cheng", "color": "blue", "doi": "10.1063/1.123096", "id": "10.1063/1.123096", "isOrigin": false, "label": "P. Tan 1999", "nb_citations": 129, "primaryNode": false, "shape": "dot", "size": 22, "title": "The intrinsic temperature effect of the Raman spectra of graphite", "url": "https://www.semanticscholar.org/paper/e34c37af5719de8a0c7d3ba9717b66cf718f1606", "year": 1999}, {"abstract": "Aper\u00e7u indisponible", "author": "Yasushi Kawashima, Gen Katagiri", "color": "blue", "doi": "10.1103/physrevb.52.10053", "id": "10.1103/physrevb.52.10053", "isOrigin": false, "label": "Yasushi Kawashima 1995", "nb_citations": 257, "primaryNode": false, "shape": "dot", "size": 24, "title": "Fundamentals, overtones, and combinations in the Raman spectrum of graphite.", "url": "https://www.semanticscholar.org/paper/6daa40512bd58fd254f9713cb09e6da694f3c20b", "year": 1995}, {"abstract": "We present a review of the Raman spectra of graphite from an experimental and theoretical point of view. The disorder\u2013induced Raman bands in this material have been a puzzling Raman problem for almost 30 years. Double\u2013resonant Raman scattering explains their origin as well as the excitation\u2013energy dependence, the overtone spectrum and the difference between Stokes and anti\u2013Stokes scattering. We develop the symmetry\u2013imposed selection rules for double\u2013resonant Raman scattering in graphite and point out misassignments in previously published works. An excellent agreement is found between the graphite phonon dispersion from double\u2013resonant Raman scattering and other experimental methods.", "author": "S. Reich, C. Thomsen", "color": "blue", "doi": "10.1098/rsta.2004.1454", "id": "10.1098/rsta.2004.1454", "isOrigin": false, "label": "S. Reich 2004", "nb_citations": 1147, "primaryNode": false, "shape": "dot", "size": 37, "title": "Raman spectroscopy of graphite", "url": "https://www.semanticscholar.org/paper/593e8367b9921c7b7bd5138f0532f68068e877d9", "year": 2004}, {"abstract": "The nature of the D band in the Raman spectrum of graphite has been the subject of considerable discussion. We examine the relationship between the depolarization characteristics of the D, ${D}^{\\ensuremath{\u0027}},$ and G fundamentals and their corresponding overtones and combinations on the basal and damaged edge planes of highly oriented pyrolytic graphite in the range 800\\char21{}4800 ${\\mathrm{cm}}^{\\mathrm{\\ensuremath{-}}1}$. A clear distinction is found between the depolarization ratios of bands that are Raman allowed $(2D,$ ${2D}^{\\ensuremath{\u0027}},$ $2D+G)$ and those that are disorder induced $(D,$ ${D}^{\\ensuremath{\u0027}},$ $D+G),$ implying that they are dictated by whether a Raman band is allowed in the infinite crystal, rather than by the bands\u0027 symmetry, as derived from previously proposed assignments of the D and G bands. Furthermore, although the ${D}_{a/b}$ vs ${2D}_{a/b}$ intensity ratios could differ considerably (where $a/b=HH/VV,$ $HV/VV),$ the participation of a G phonon in the scattering process changes their value in the same amount, i.e., ${D}_{a/b}{/D+G}_{a/b}\\ensuremath{\\approx}{2D}_{a/b}{/2D+G}_{a/b}.$ Such a simple result is surprising in view of the complexity of multiphonon scattering that involves several coupled scattering events.", "author": "T. Livneh, T. Haslett, M. Moskovits", "color": "blue", "doi": "10.1103/physrevb.66.195110", "id": "10.1103/physrevb.66.195110", "isOrigin": false, "label": "T. Livneh 2002", "nb_citations": 65, "primaryNode": false, "shape": "dot", "size": 21, "title": "Distinguishing disorder-induced bands from allowed Raman bands in graphite", "url": "https://www.semanticscholar.org/paper/9f676e5722feaebd34d9711dae92c084c4ed4570", "year": 2002}, {"abstract": "Using 514 nm radiation and a careful experimental protocol allowing us to make quantitative intensity analyses, we have examined the first- and second-order Raman spectra of five varieties of graphite. These include single-crystal graphite and highly oriented pyrolytic graphite as references, then two with a significant content of c-axis translation faults introduced through grinding and exfoliation, and a last sample which is purely turbostratic. We show that full c-axis stacking disorder results in a strong increase of the scattered E2g-mode intensity. We have further shown that even in those strongly disordered stacking sequences, but in which the AB sequence persists over only a few layers, the doublet around 2700 cm\u22121 is resolved. We argue against assigning the peak around 1355 cm\u22121 to \u201cdisorder,\u201d as is so often done, but to the finite in-plane domain size as proposed a number of years ago; moreover, we suggest that this peak is a more sensitive probe of such small domains than is x-ray diffraction.", "author": "H. Wilhelm, M. Lelaurain, E. Mcrae, B. Humbert", "color": "blue", "doi": "10.1063/1.369027", "id": "10.1063/1.369027", "isOrigin": false, "label": "H. Wilhelm 1998", "nb_citations": 166, "primaryNode": false, "shape": "dot", "size": 23, "title": "Raman spectroscopic studies on well-defined carbonaceous materials of strong two-dimensional character", "url": "https://www.semanticscholar.org/paper/e7fcde0908998ebe69d8344b8a221271e3f08155", "year": 1998}, {"abstract": "The phonon dispersion relations of graphite can be probed over a wide range of the Brillouin zone by double resonance Raman spectroscopy. The double resonance Raman process provides us with new assignments for the dispersive and nondispersive features observed in the Raman spectra of disordered graphite and carbon nanotubes, some features having been incorrectly assigned previously, or not assigned at all.", "author": "Riichiro Saito, A. Jorio, A. G. S. Filho, A. G. S. Filho, G. Dresselhaus, M. Dresselhaus, M. Pimenta", "color": "blue", "doi": "10.1103/physrevlett.88.027401", "id": "10.1103/physrevlett.88.027401", "isOrigin": false, "label": "Riichiro Saito 2001", "nb_citations": 492, "primaryNode": false, "shape": "dot", "size": 28, "title": "Probing phonon dispersion relations of graphite by double resonance Raman scattering.", "url": "https://www.semanticscholar.org/paper/ca04d632647f0297ac7f89e294eaeee134e1b8d5", "year": 2001}, {"abstract": "We report calculated Raman spectra of the D and 2D modes in graphene and graphite. Evaluating the Raman amplitude in the two-dimensional Brillouin zone, we reproduce the splitting of the modes when going from single-layer graphene to graphite. The energy dependence of the D mode in graphene is 24%\\char21{}32% smaller than in graphite. We discuss the intensity of the D line and show that the double resonant phonons originate from the low-symmetry parts of the Brillouin zone.", "author": "R. Narula, S. Reich", "color": "blue", "doi": "10.1103/physrevb.78.165422", "id": "10.1103/physrevb.78.165422", "isOrigin": false, "label": "R. Narula 2008", "nb_citations": 64, "primaryNode": false, "shape": "dot", "size": 21, "title": "Double resonant Raman spectra in graphene and graphite : A two-dimensional explanation of the Raman amplitude", "url": "https://www.semanticscholar.org/paper/bfa4fabc52c118405c5d6177d9f6783b134b44f3", "year": 2008}, {"abstract": "The Raman spectrum of glassy carbon has been measured. Two broad lines are observed at 1340 and 1590 cm\u22121. These results are consistent with the turbostratic structure, which has been suggested for glassy carbon, with a particle size La of approximately 30 A.", "author": "M. Nathan, John E. Smith, K. Tu", "color": "blue", "doi": "10.1063/1.1663599", "id": "10.1063/1.1663599", "isOrigin": false, "label": "M. Nathan 1974", "nb_citations": 146, "primaryNode": false, "shape": "dot", "size": 23, "title": "Raman spectra of glassy carbon", "url": "https://www.semanticscholar.org/paper/92aca12e2a778b2244684f9f85d0d9c908bf7d7b", "year": 1974}, {"abstract": "The cyclic voltammetry response of partially blocked electrodes is modeled using finite difference simulations and a method presented for determining currents at electrode surfaces which have a well-defined geometric blocking pattern. Peak current and peak separation data are presented for six decades of scan rates, blocking coverage values between 0.1 and 0.9 and between the limits of reversible and irreversible electrochemistry. The validity of the simulation approach employed is verified by data obtained experimentally from purpose-built partially blocked gold film electrodes, with either a cubic or hexagonal geometric array of electroinactive disks uniformly distributed on the electrode surface. Comparison of theory with experiment suggests that the modeling of hexagonally distributed blocking systems is superior to that of the cubically arranged ones.", "author": "B. A. Brookes, T. J. Davies, A. Fisher, R. G. Evans, S. J. Wilkins, K. Yunus, J. Wadhawan, R. Compton", "color": "blue", "doi": "10.1021/jp021810v", "id": "10.1021/jp021810v", "isOrigin": false, "label": "B. A. Brookes 2003", "nb_citations": 98, "primaryNode": false, "shape": "dot", "size": 22, "title": "Computational and Experimental Study of the Cyclic Voltammetry Response of Partially Blocked Electrodes. Part 1. Nonoverlapping, Uniformly Distributed Blocking Systems", "url": "https://www.semanticscholar.org/paper/84c31cabf7388f89314f5691342bcea298939a54", "year": 2003}, {"abstract": "Aper\u00e7u indisponible", "author": "R. Forster", "color": "blue", "doi": "10.1039/cs9942300289", "id": "10.1039/cs9942300289", "isOrigin": false, "label": "R. Forster 1994", "nb_citations": 195, "primaryNode": false, "shape": "dot", "size": 23, "title": "Microelectrodes: new dimensions in electrochemistry", "url": "https://www.semanticscholar.org/paper/8617f018cdc69c8a2f2c8efd49adacc7584f003a", "year": 1994}, {"abstract": "We employ an internal standard protocol to simultaneously characterise and utilise electrode materials during their electrochemical implementation. The proposed approach involves \u2018spiking\u2019 a solution containing the analyte of interest (namely, \u03b2-nicotinamide adenine dinucleotide (NADH)) with a common electrochemical redox probe (such as hexaammine-ruthenium(III) chloride), which consequently allows information on the electrochemical properties of the electrode being utilised to be obtained and monitored throughout its application. This approach is explored using a range of commonly encountered carbonaceous electrode materials, including various graphene configurations, such as monolayer, double- and few-layered graphene electrodes \u2013 the latter is reported for the first time. The variability in structural quality and stability of the graphene electrodes used (particularly between batches) highlights the necessity for implementation of such approaches within the literature. This work provides a simple, yet effective option for the in situ electrochemical characterisation of various electrode materials, essential where the quality and composition of a \u2018reported\u2019 electrode material can vary greatly depending on its fabrication (batch-to-batch quality) or during the course of experimental use.", "author": "D. A. Brownson, P. Kelly, C. Banks", "color": "blue", "doi": "10.1039/c5ra03049h", "id": "10.1039/c5ra03049h", "isOrigin": false, "label": "D. A. Brownson 2015", "nb_citations": 54, "primaryNode": false, "shape": "dot", "size": 21, "title": "In situ electrochemical characterisation of graphene and various carbon-based electrode materials: an internal standard approach", "url": "https://www.semanticscholar.org/paper/5d207993a7dbcd65a33b456b708fcf3e6cfd306b", "year": 2015}, {"abstract": "Aper\u00e7u indisponible", "author": "N. Pontikos, R. McCreery", "color": "blue", "doi": "10.1016/0022-0728(92)80048-9", "id": "10.1016/0022-0728(92)80048-9", "isOrigin": false, "label": "N. Pontikos 1992", "nb_citations": 36, "primaryNode": false, "shape": "dot", "size": 20, "title": "Microstructural and morphological changes induced in glassy carbon electrodes by laser irradiation", "url": "https://www.semanticscholar.org/paper/4064a11a6c84a04939ce16f6f4c35eb1f180caf2", "year": 1992}, {"abstract": "Aper\u00e7u indisponible", "author": "G. Jelinek", "color": "blue", "doi": "10.1103/physrevb.3.2724", "id": "10.1103/physrevb.3.2724", "isOrigin": false, "label": "G. Jelinek 1971", "nb_citations": 6, "primaryNode": false, "shape": "dot", "size": 20, "title": "Properties of Crystalline Argon, Krypton, and Xenon Based upon the Born and Huang Method of Homogeneous Deformations. II. Equation of State and Melting Lines", "url": "https://www.semanticscholar.org/paper/fe8e3d64ddadf381182b567a8ec93aa2d6f8aa12", "year": 1971}, {"abstract": "XPS techniques have been used to characterize electrically conducting films of polypyrrole and polybithiophenes as grown electrochemically. These techniques have yielded information not only on the nature of the polymeric cation and its counter anion but also on the structural disorder in these polymers. In particular the N1s spectra have revealed a nonuniformity in the distribution of the anions relative to the nitrogen atoms and the C1s spectra clearly show that as many as 1/3 of the pyrrole rings can be different from the rest. Significant improvement in the structural order is achieved by blocking the \u03b2 sites on the pyrrole ring with methyl groups to ensure a completely \u03b1,\u03b1\u2032 bonded polymer. Similar experiments on polybithiophene polymers show that this polymer is considerably more ordered than polypyrrole. The XPS results are best interpreted by assigning a nonmetallic character to the pyrrole polymers, in accordance with other experiments.XPS techniques have been used to characterize electrically conducting films of polypyrrole and polybithiophenes as grown electrochemically. These techniques have yielded information not only on the nature of the polymeric cation and its counter anion but also on the structural disorder in these polymers. In particular the N1s spectra have revealed a nonuniformity in the distribution of the anions relative to the nitrogen atoms and the C1s spectra clearly show that as many as 1/3 of the pyrrole rings can be different from the rest. Significant improvement in the structural order is achieved by blocking the \u03b2 sites on the pyrrole ring with methyl groups to ensure a completely \u03b1,\u03b1\u2032 bonded polymer. Similar experiments on polybithiophene polymers show that this polymer is considerably more ordered than polypyrrole. The XPS results are best interpreted by assigning a nonmetallic character to the pyrrole polymers, in accordance with other experiments.", "author": "P. Pfluger, G. Street", "color": "blue", "doi": "10.1063/1.446428", "id": "10.1063/1.446428", "isOrigin": false, "label": "P. Pfluger 1984", "nb_citations": 251, "primaryNode": false, "shape": "dot", "size": 24, "title": "Chemical, electronic, and structural properties of conducting heterocyclic polymers: A view by XPS", "url": "https://www.semanticscholar.org/paper/3bd87ab3574b7ac750f2d5f718410c5e00a014a6", "year": 1984}, {"abstract": "Molecularly imprinted polymers are synthetic receptors for a targeted molecule. As such, they are analogues of the natural antibody-antigen systems. In this review, after a recounting of the early history of the general field, we specifically focus on the application of these polymers as sensors. In these applications, the polymers are paired with a reporting system, which may be electrical, electrochemical, optical, or gravimetric. The presence of the targeted molecule effects a change in the reporting agent, and a calibrated quantity of the target is recorded. In this review, we describe the imprinted polymer production processes, the techniques used for reporting, and the applications of the reported sensors. A brief survey of recent applications to gas-phase sensing is included, but the focus is primarily on the development of sensors for targets in solution. Included among the applications are those designed to detect toxic chemicals, toxins in foods, drugs, explosives, and pathogens. The application of computational chemistry to the development of new imprinted polymers is included as is a brief assessment of future developments.", "author": "J. BelBruno", "color": "blue", "doi": "10.1021/acs.chemrev.8b00171", "id": "10.1021/acs.chemrev.8b00171", "isOrigin": false, "label": "J. BelBruno 2018", "nb_citations": 950, "primaryNode": false, "shape": "dot", "size": 35, "title": "Molecularly Imprinted Polymers.", "url": "https://www.semanticscholar.org/paper/1521afa97df7c4a9fe22962161b14e0f3a666ae4", "year": 2018}, {"abstract": "La comparaison des intensites theoriques et des intensites experimentales, realisee sur la forme \u03b2 du poly(fluorure de vinylidene) orientee monoaxialement nous a permis d\u0027attribuer les raies Raman observees aux differents modes de vibration de la cha\u01d0ne. Nous precisons plus particulierement l\u0027attribution des raies de frequences 1278, 882 et 840 cm\u22121 (raies qui subissent une profonde modification lors de la transition ferro\u2013paraelectrique des copolymeres contenant du PVF2\u03b2) aux mouvements \u03bds(CC), \u03c1(CH2) et \u03bds(CF2), respectivement. Enfin, nos resultats verifient que les groupements CH2 et CF2 conservent une bonne individualite dans la cha\u01d0ne du polymere. \n \n \n \nA comparison between theoretical and experimental intensities obtained for a uniaxially oriented film of the \u03b2-phase of poly(vinylidene fluoride) enabled the observed Raman bands to be assigned to the different vibrational modes of the polymer chain. In particular the 1278, 882 and 840 cm\u22121 frequencies (which show a large conformational change during the ferro\u2013paraelectric transition occurring in vinylidene fluoride\u2013trifluoroethylene copolymer) are attributed to \u03bds(CC), \u03c1(CH2) and \u03bds(CF2) vibrations, respectively. The results confirm that the CH2 and CF2 groups maintain their individuality in the polymeric chain.", "author": "A. Armengaud, J. Ramonja, M. Abenoza", "color": "blue", "doi": "10.1002/jrs.1250180208", "id": "10.1002/jrs.1250180208", "isOrigin": false, "label": "A. Armengaud 1987", "nb_citations": 2, "primaryNode": false, "shape": "dot", "size": 20, "title": "Intensit\u00e9s Raman et Attribution des Modes dans le Poly(Fluorure de Vinylid\u00e8ne) en Phase \u03b2", "url": "https://www.semanticscholar.org/paper/97396f5f2014fb3dfb01a200d7f182c96df14781", "year": 1987}, {"abstract": "Aper\u00e7u indisponible", "author": "E. Kang, K. Neoh, K. L. Tan, B. T. G. Tan", "color": "blue", "doi": "10.1016/0379-6779(89)90629-2", "id": "10.1016/0379-6779(89)90629-2", "isOrigin": false, "label": "E. Kang 1989", "nb_citations": 3, "primaryNode": false, "shape": "dot", "size": 20, "title": "XPS studies of some chemically-synthesized polypyridazine-acceptor complexes", "url": "https://www.semanticscholar.org/paper/c64b9e45e2cfb03db6de6db55bbebd61eade5beb", "year": 1989}, {"abstract": "We measured the dispersion of the graphite optical phonons in the in-plane Brillouin zone by inelastic x-ray scattering. The longitudinal and transverse optical branches cross along the \ufffd -K as well as the \ufffd -M direction. The dispersion of the optical phonons was, in general, stronger than expected from the literature. At the K point the transverse optical mode has a minimum and is only \ufffd 70 cm \ufffd 1 higher in frequency than the longitudinal mode. We show that first-principles calculations describe very well the vibrational properties of graphene once the long-range character of the dynamical matrix is taken into account.", "author": "J. Maultzsch, S. Reich, C. Thomsen, H. Requardt, P. Ordej\u00f3n", "color": "blue", "doi": "10.1103/physrevlett.92.075501", "id": "10.1103/physrevlett.92.075501", "isOrigin": false, "label": "J. Maultzsch 2004", "nb_citations": 331, "primaryNode": false, "shape": "dot", "size": 26, "title": "Phonon Dispersion in Graphite", "url": "https://www.semanticscholar.org/paper/8a8bd34e2372876862f8db3999b93fa0115953be", "year": 2004}, {"abstract": "We report a novel phase of carbon possessing a monoclinic C2/m structure (8 atoms/cell) identified using an ab initio evolutionary structural search. This polymorph, which we call M-carbon, is related to the (2x1) reconstruction of the (111) surface of diamond and can also be viewed as a distorted (through sliding and buckling of the sheets) form of graphite. It is stable over cold-compressed graphite above 13.4 GPa. The simulated x-ray diffraction pattern and near K-edge spectroscopy are in satisfactory agreement with the experimental data [W. L. Mao, Science 302, 425 (2003)10.1126/science.1089713] on overcompressed graphite. The hardness and bulk modulus of this new carbon polymorph are calculated to be 83.1 and 431.2 GPa, respectively, which are comparable to those of diamond.", "author": "Quan Li, Yanming Ma, A. Oganov, Hongbo Wang, Hui Wang, Ying Xu, T. Cui, H. Mao, G. Zou", "color": "blue", "doi": "10.1103/physrevlett.102.175506", "id": "10.1103/physrevlett.102.175506", "isOrigin": false, "label": "Quan Li 2009", "nb_citations": 465, "primaryNode": false, "shape": "dot", "size": 28, "title": "Superhard monoclinic polymorph of carbon.", "url": "https://www.semanticscholar.org/paper/d6b981b8ae7e13215629acdb7c8830b33cc6c625", "year": 2009}, {"abstract": ": Through a systematic structural search we found an allotrope of carbon with Cmmm symmetry which we predict to be more stable than graphite for pressures above 10 GPa. This material, which we refer to as Z-carbon, is formed by pure sp(3) bonds and it provides an explanation to several features in experimental x-ray diffraction and Raman spectra of graphite under pressure. The transition from graphite to Z-carbon can occur through simple sliding and buckling of graphene sheets. Our calculations predict that Z-carbon is a transparent wide band-gap semiconductor with a hardness comparable to diamond.", "author": "M. Amsler, J. A. Flores-Livas, L. Lehtovaara, F. Balima, S. Ghasemi, D. Machon, S. Pailh\u00e8s, Alexander Willand, D. Caliste, S. Botti, A. Miguel, S. Goedecker, M. Marques", "color": "blue", "doi": "10.1103/physrevlett.108.065501", "id": "10.1103/physrevlett.108.065501", "isOrigin": false, "label": "M. Amsler 2012", "nb_citations": 216, "primaryNode": false, "shape": "dot", "size": 24, "title": "Crystal Structure of Cold Compressed Graphite", "url": "https://www.semanticscholar.org/paper/859900aae66b40b3ec32af0580955f7261961753", "year": 2012}, {"abstract": "Aper\u00e7u indisponible", "author": "J. Hlinka, I. Gregora, J. Pokorny, C. H\u00e9rold, N. Emery, J. Mar\u00each\u00e9, P. Lagrange", "color": "blue", "doi": "10.1103/physrevb.76.144512", "id": "10.1103/physrevb.76.144512", "isOrigin": false, "label": "J. Hlinka 2007", "nb_citations": 15, "primaryNode": false, "shape": "dot", "size": 20, "title": "Lattice dynamics ofCaC6by Raman spectroscopy", "url": "https://www.semanticscholar.org/paper/ad80fa8a7a0e6e6fe2235c367668e3f7d4b701c9", "year": 2007}]);
