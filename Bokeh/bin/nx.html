              // This method is responsible for drawing the graph, returns the drawn network
              function drawGraph() {
                  var container = document.getElementById('mynetwork');

                  

                  // parsing and collecting nodes and edges from the python
                  nodes = new vis.DataSet([{"abstract": "High quality graphene oxide (GO) and reduced graphene oxide (rGO) have been synthesized by chemical oxidation of graphite flakes via three modified Hummers methods using a mixture of sulfuric acid (H2SO4), phosphoric acid (H3PO4) and nitric acid (HNO3) as intercalating agents and potassium permanganate (KMnO4) and hydrogen peroxide (H2O2) as oxidizing agents. In this study the production of dangerously explosive gases was avoided. The temperature was carefully controlled using ice baths, ensuring the temperature was kept at the minimum during the reaction. The prepared samples were extensively characterized using various techniques including X-ray diffraction (XRD), scanning electron microscopy (SEM), energy dispersive X-ray spectroscopy (EDS), high-resolution transmission electron microscopy (HRTEM), Fourier transform infrared spectroscopy (FTIR), and X-ray photoelectron spectroscopy (XPS). The results indicated greater presence of oxygen containing groups and an increase in the (C/O) ratio, both of which served as reliable indicators of high quality graphene oxide. Atomic ratio of carbon to oxygen (C/O) quantified by XPS was calculated to be 25.67, 1.81, 1.63, and 2.77 of graphite, GO-I, GO-II, and GO-III, respectively. As revealed by FTIR analysis, the GO-I had more hydrophilic oxygen functional groups compared to GO-II and GO-III.", "author": "Al-Gaashani, R.; Najjar, A.; Zakaria, Y.; Mansour, S.; Atieh, M. A.", "color": "red", "doi": "http://www.sciencedirect.com/science/article/pii/S0272884219309903", "id": "KMC3NK6D", "infos": "{\"Item Type\": \"journalArticle\", \"Publication Year\": 1984.0, \"Author\": \"Aoki, Koichi; Akimoto, Koji; Tokuda, Koichi; Matsuda, Hiroaki; Osteryoung, Janet\"}", "label": "KMC3NK6D", "shape": "dot", "size": 10, "title": "XPS and structural studies of high quality graphene oxide and reduced graphene oxide prepared by different chemical oxidation methods", "year": 1984.0}, {"abstract": NaN, "author": "Sundberg, K. M.; Smyrl, W. H.; Atanasoska, Lj; Atanasoski, R.", "color": "red", "doi": "http://iopscience.iop.org/article/10.1149/1.2096650/meta", "id": "XBQSFZ6X", "infos": "{\"Item Type\": \"journalArticle\", \"Publication Year\": 1975.0, \"Author\": \"Sav\u00e9ant, J. M.; Tessier, D.\"}", "label": "XBQSFZ6X", "shape": "dot", "size": 10, "title": "Surface Modification and Oxygen Reduction on Glassy Carbon in Chloride Media", "year": 1975.0}, {"abstract": "Heterogeneous electron transfer rate constants of a series of chemical systems are estimated using Cyclic Voltammetry (CV) and Electrochemical Impedance Spectroscopy (EIS), and critically compared to one another. Using aqueous, quasi-reversible redox systems, and carbon screen-printed electrodes, this work has been able to quantify rate constants using both techniques and have proved that the two methods sometimes result in measured rate constants that differ by as much as one order of magnitude. The method has been converted to estimate k0 values for irreversible electrochemical systems such as ascorbic acid and norepinephrine, yielding reasonable values for the electron transfer of their respective oxidation reactions. Such electrochemically irreversible cases are compared to data obtained via digital simulations. The work is limited to finite concentration ranges of electroactive species undergoing simple electron processes (\u2018E\u2019 type reactions). The manuscript provides the field with a simple and effective way estimating electron transfer rate constants for irreversible electrochemical systems without using digital software packages, something which is not possible using either Nicholson or Laviron methods.", "author": "Randviir, Edward P.", "color": "red", "doi": "http://www.sciencedirect.com/science/article/pii/S0013468618317882", "id": "V4MTIWRW", "infos": "{\"Item Type\": \"journalArticle\", \"Publication Year\": 1993.0, \"Author\": \"Myland, Jan C.; Oldham, Keith B.\"}", "label": "V4MTIWRW", "shape": "dot", "size": 10, "title": "A cross examination of electron transfer rate constants for carbon screen-printed electrodes using Electrochemical Impedance Spectroscopy and cyclic voltammetry", "year": 1993.0}, {"abstract": "We report a simple and effective method for reducing and functionalizing graphene oxide into chemically converted graphene by solvothermal reduction of a graphene oxide suspension in N-methyl-2-pyrrolidone (NMP). Graphene oxide sheets were functionalized by free radicals generated during heating of NMP in the presence of air. The degree of functionalization was easily controlled by manipulating the reduction time. High functionalized solvothermally reduced graphene oxide (STRG) shows superior dispersibility in various organic solvents, while slightly functionalized STRG shows excellent electrical conductivity. The superior dispersibility of highly functionalized STRG in organic solvents was attributed to the steric effect of functionalized groups on the surface of STRG sheets. Free-standing STRG paper that was reduced for 1 h exhibited electrical conductivity as high as 21600 S m\u22121, while the dispersibility of STRG that was reduced for 5 h was as high as 1.4 mg mL\u22121.", "author": "Pham, Viet Hung; Cuong, Tran Viet; Hur, Seung Hyun; Oh, Eunsuok; Kim, Eui Jung; Shin, Eun Woo; Chung, Jin Suk", "color": "red", "doi": "http://pubs.rsc.org/en/content/articlelanding/2011/jm/c0jm02790a", "id": "K7WP6MMW", "infos": "{\"Item Type\": \"journalArticle\", \"Publication Year\": 2003.0, \"Author\": \"Brookes, Benjamin A.; Davies, Trevor J.; Fisher, Adrian C.; Evans, Russell G.; Wilkins, Shelley J.; Yunus, Kamran; Wadhawan, Jay D.; Compton, Richard G.\"}", "label": "K7WP6MMW", "shape": "dot", "size": 10, "title": "Chemical functionalization of graphene sheets by solvothermal reduction of a graphene oxide suspension in N-methyl-2-pyrrolidone", "year": 2003.0}, {"abstract": "This work describes the development, electrochemical characterization and utilization of a cobalt phthalocyanine modified carbon nanotube electrode for the quantitative determination of dopamine in 0.2 mol L\u22121 phosphate buffer contaminated with high concentration of ascorbic acid. The electrode surface was analyzed by cyclic voltammetry and electrochemical impedance spectroscopy which showed a modified surface presenting a charge transfer resistance of 500 \u03a9, against the 16.46 k\u03a9 value found for the bare glassy carbon surface. A pseudo rate constant value of 5.4\u00d710\u22124 cm s\u22121 for dopamine oxidation was calculated. Voltammetric experiments showed a shift of the peak potential of DA oxidation to less positive value at 390 mV as compared with that of a bare GC electrode at 570 mV. The electrochemical determination of dopamine, in presence of ascorbic acid in concentrations up to 0.1 mol L\u22121 by differential pulse voltammetry, yielded a detection limit as low as 2.56\u00d710\u22127 mol L\u22121.", "author": "Cruz\u2005Moraes, Fernando; Cabral, Murilo F.; Machado, Sergio A. S.; Mascaro, Lucia H.", "color": "red", "doi": "https://onlinelibrary.wiley.com/doi/abs/10.1002/elan.200704107", "id": "Z7PHWZU3", "infos": "{\"Item Type\": \"journalArticle\", \"Publication Year\": 2012.0, \"Author\": \"Ward, Kristopher R.; Lawrence, Nathan S.; Hartshorne, R. Seth; Compton, Richard G.\"}", "label": "Z7PHWZU3", "shape": "dot", "size": 10, "title": "Electrocatalytic Behavior of Glassy Carbon Electrodes Modified with Multiwalled Carbon Nanotubes and Cobalt Phthalocyanine for Selective Analysis of Dopamine in Presence of Ascorbic Acid", "year": 2012.0}, {"abstract": "We report an ammonia (NH3) sensor in which a ultrathin polypyrrole (PPy) layer is synthesized on reduced graphene oxide (rGO) by electropolymerization. The PPy/rGO composite is characterized by scanning electron microscopy, secondary ion mass spectrometry, Raman spectroscopy, and X-ray photoelectron spectroscopy. The sensor exhibits an excellent performance in the selective sensing of NH3 at room temperature, having a high, fast, reversible and linear response. These performances are attributed to the synergistic effect of the ultrathin PPy layer and rGO. Specifically, NH3 molecules are adsorbed on the ultrathin PPy layer, electrons transfer from NH3 to the PPy layer, changing the PPy layer resistance. The ultrathin PPy layer over rGO allows NH3 molecules to pass through and react with sp2-bonded carbon atoms, also changing the rGO resistance. Moreover, the rGO sheets are not only a support material for the ultrathin PPy electropolymerization but also provide an efficient pathway for electron transfer, thereby, accelerating the sensor response and recovery. Meanwhile, the ultrathin PPy layer plays an important role in the sensor selectivity and immunity to humidity. Our research indicates that the post-step PPy electropolymerization is very promising for sensor fabrication and compatible with CMOS technology. These make it possible to design and manufacture the PPy/rGO sensors with integrated circuits onto the same Si wafer for different applications. Importantly, the fabrication method of the present sensor is easy and low cost. Therefore it is regarded as being scalable for mass production of NH3 sensors.", "author": "Tang, Xiaohui; Raskin, Jean-Pierre; Kryvutsa, Nadzeya; Hermans, Sophie; Slobodian, Oleksandr; Nazarov, Alexei N.; Debliquy, Marc", "color": "red", "doi": "http://www.sciencedirect.com/science/article/pii/S0925400519316223", "id": "JRSWPJKD", "infos": "{\"Item Type\": \"journalArticle\", \"Publication Year\": 2003.0, \"Author\": \"Davies, Trevor J.; Brookes, Benjamin A.; Fisher, Adrian C.; Yunus, Kamran; Wilkins, Shelley J.; Greene, Phillip R.; Wadhawan, Jay D.; Compton, Richard G.\"}", "label": "JRSWPJKD", "shape": "dot", "size": 10, "title": "An ammonia sensor composed of polypyrrole synthesized on reduced graphene oxide by electropolymerization", "year": 2003.0}, {"abstract": "We study the influence of different edge types on the electronic density of states of graphene nanostructures. To this end we develop an exact expansion for the single-particle Green\u2019s function of ballistic graphene structures in terms of multiple reflections from the system boundary, which allows for a natural treatment of edge effects. We first apply this formalism to calculate the average density of states of graphene billiards. While the leading term in the corresponding Weyl expansion is proportional to the billiard area, we find that the contribution that usually scales with the total length of the system boundary differs significantly from what one finds in semiconductor-based, Schr\u00f6dinger-type billiards: The latter term vanishes for armchair and infinite-mass edges and is proportional to the zigzag edge length, highlighting the prominent role of zigzag edges in graphene. We then compute analytical expressions for the density of states oscillations and energy levels within a trajectory-based semiclassical approach. We derive a Dirac version of Gutzwiller\u2019s trace formula for classically chaotic graphene billiards and further obtain semiclassical trace formulas for the density of states oscillations in regular graphene cavities. We find that edge-dependent interference of pseudospins in graphene crucially affects the quantum spectrum.", "author": "Wurm, J\u00fcrgen; Richter, Klaus; Adagideli, \u0130nan\u00e7", "color": "blue", "doi": "https://link.aps.org/doi/10.1103/PhysRevB.84.075468", "id": "RJFEHX2G", "infos": "{\"Item Type\": \"journalArticle\", \"Publication Year\": 2012.0, \"Author\": \"Patel, Anisha N.; Collignon, Manon Guille; O\u2019Connell, Michael A.; Hung, Wendy O. Y.; McKelvey, Kim; Macpherson, Julie V.; Unwin, Patrick R.\"}", "label": "RJFEHX2G", "shape": "dot", "size": 10, "title": "Edge effects in graphene nanostructures: From multiple reflection expansion to density of states", "year": 2012.0}, {"abstract": NaN, "author": "Waltman, R. J.; Pacansky, J.; Bates, C. W.", "color": "blue", "doi": "https://pubs.acs.org/doi/abs/10.1021/cm00036a018", "id": "98QZ5CSG", "infos": "{\"Item Type\": \"journalArticle\", \"Publication Year\": 2016.0, \"Author\": \"Amemiya, Shigeru; Chen, Ran; Nioradze, Nikoloz; Kim, Jiyeon\"}", "label": "98QZ5CSG", "shape": "dot", "size": 10, "title": "X-ray photoelectron spectroscopic studies on organic photoconductors: evaluation of atomic charges on chlorodiane blue and p-(diethylamino)benzaldehyde diphenylhydrazone", "year": 2016.0}, {"abstract": "We report a new hybrid sensor in which an ultrathin polypyrrole (PPy) layer is deposited on the CVD-grown graphene (G) by electropolymerization. The sensor exhibits an excellent performance in the selective sensing of ammonia (NH3) at room temperature, having a high, fast, and reversible response. It also shows rather good stability, reproducibility, and immunity to humidity. These performances are attributed to the synergistic effect between the PPy layer and G. Specifically, the NH3 molecules are adsorbed on the PPy layer, electrons transfer from NH3 to the PPy layer, changing the PPy layer resistance. Electrons can also be transferred to the G through the ultrathin PPy layer, in certain way changing the G resistance. These promote the sensor sensitivity. Moreover, the ultrathin PPy layer with porous nature plays an important role in the sensor response, selectivity, and immunity to humidity. Graphene is not only a support material for PPy electropolymerization but also provides an efficient pathway for electron transfer, thereby, accelerating the sensor response and recovery. Our research indicates that the combination of PPy and G is a very promising as a chemical sensor material. We implement a smart prototype with the present sensor in an electronic board for real-time monitoring the NH3 concentrations. The smart prototype can be connected to a computer by a USB port for demonstrating NH3 concentrations, transmitting the data and analyzing the sensor response curves. Our results are beneficial forward the commercial design and fabrication of sensors fulfilling the specifications of practical applications.", "author": "Tang, Xiaohui; Lahem, Driss; Raskin, Jean-Pierre; G\u00e9rard, Pierre; Geng, Xin; Andr\u00e9, Nicolas; Debliquy, Marc", "color": "red", "doi": NaN, "id": "D6UPT8JD", "infos": "{\"Item Type\": \"journalArticle\", \"Publication Year\": 1985.0, \"Author\": \"Kovach, Paul M.; Caudill, W. Lowry; Peters, Dennis G.; Wightman, R. Mark\"}", "label": "D6UPT8JD", "shape": "dot", "size": 10, "title": "A Fast and Room-Temperature Operation Ammonia Sensor Based on Compound of Graphene With Polypyrrole", "year": 1985.0}, {"abstract": "The suitability of graphene oxide (GO) foils as radiation sensitive materials for soft X-ray irradiation is investigated by means of X-ray photoelectron spectroscopy (XPS). In particular GO micrometric foils have been irradiated by soft X-rays at a 1486.6\u00a0eV energy at high flux (\u003e1012 photons/cm2s) in ultra-high vacuum. The XPS analysis of the carbon-carbon (CC) and the carbon-oxygen links (CO) characterizes the composition of the first layers of the GO foils. The CC/CO ratio of the high-resolution C1s XPS spectrum is used as dosimetric index. The incident X-ray photons, proportionally to their fluence, partially reduce GO foils decreasing the amount of oxygen groups chemically bonded to carbon network. This decrease causes an increase on the CC/CO ratio that is correlated to the irradiation time, i.e. to the dose absorbed by the GO foil, showing a linear increment with the dose. Our preliminary investigations indicate that GO can be employed to realize a thin foil dosimeter giving a linear response to the absorbed dose in the (275.76\u00a0kGy\u00a0\u00f7\u00a08.02\u00a0MGy) range. The absorbed dose can be also evaluated by measuring the C/O ratio from the C1s and O1s XPS spectra analysis or with different techniques, as discussed in the paper.", "author": "Torrisi, L.; Silipigni, L.; Cutroneo, M.; Torrisi, A.", "color": "red", "doi": "http://www.sciencedirect.com/science/article/pii/S0042207X20300129", "id": "CMJ2HFNL", "infos": "{\"Item Type\": \"journalArticle\", \"Publication Year\": 1977.0, \"Author\": \"Blaedel, W. J.; Schieffer, G. W.\"}", "label": "CMJ2HFNL", "shape": "dot", "size": 10, "title": "Graphene oxide as a radiation sensitive material for XPS dosimetry", "year": 1977.0}, {"abstract": "Graphene has attracted immense investigation since its discovery. Lattice imperfections are introduced into graphene unavoidably during graphene growth or processing. These structural defects are known to significantly affect electronic and chemical properties of graphene. A comprehensive understanding of graphene defect is thus of critical importance. Here we review the major progresses made in defect-related engineering of graphene. Firstly, we give a brief introduction on the types of defects in graphene. Secondly, the generation and healing of the graphene defects are summarized. Then, the effects of defects on the chemical, electronic, magnetic, and mechanical properties of graphene are discussed. Finally, we address the associated challenges and prospects on the future study of defects in graphene and other nanocarbon materials.", "author": "Liu, Lili; Qing, Miaoqing; Wang, Yibo; Chen, Shimou", "color": "red", "doi": "http://www.sciencedirect.com/science/article/pii/S100503021500016X", "id": "3VCZ7SXL", "infos": "{\"Item Type\": \"journalArticle\", \"Publication Year\": 2006.0, \"Author\": \"Esteban, M.; Ari\u00f1o, C.; D\u00edaz-Cruz, J. M.\"}", "label": "3VCZ7SXL", "shape": "dot", "size": 10, "title": "Defects in Graphene: Generation, Healing, and Their Effects on the Properties of Graphene: A Review", "year": 2006.0}, {"abstract": NaN, "author": NaN, "color": "blue", "doi": "http://data.europa.eu/eli/reg_impl/2016/872/oj/fra", "id": "GGCUV48E", "infos": "{\"Item Type\": \"journalArticle\", \"Publication Year\": 1980.0, \"Author\": \"Corrigan, Dennis A.; Evans, Dennis H.\"}", "label": "GGCUV48E", "shape": "dot", "size": 10, "title": "R\u00e8glement d\u0027ex\u00e9cution (UE) 2016/872 de la Commission du 1er juin 2016 concernant le non-renouvellement de l\u0027approbation de la substance active isoproturon, conform\u00e9ment au r\u00e8glement (CE) n\u00b0 1107/2009 du Parlement europ\u00e9en et du Conseil concernant la mise sur le march\u00e9 des produits phytopharmaceutiques, et modifiant le r\u00e8glement d\u0027ex\u00e9cution (UE) n\u00b0 540/2011 de la Commission (Texte pr\u00e9sentant de l\u0027int\u00e9r\u00eat pour l\u0027EEE)", "year": 1980.0}, {"abstract": "In present paper, the graphene doped carbon paste electrode (CPE) was firstly prepared with the addition of graphene into the carbon paste mixture. Compared with conventional CPE, an improved electrochemical response of graphene doped CPE toward the redox couple of Fe(CN)63\u2212/4\u2212 was demonstrated owing to the excellent electrical conductivity of graphene. The graphene doped CPE was further used for the successful determination of ascorbic acid (AA), and it showed an excellent electrocatalytic oxidation activity toward AA with a lower overvoltage, pronounced current response, and good sensitivity. Under the optimized experimental conditions, the proposed electrochemical AA sensor exhibited a rapid response to AA within 5s and a linear calibration plot ranged from 1.0\u00d710\u22127 to 1.06\u00d710\u22124M was obtained with a detection limit of 7.0\u00d710\u22128M.", "author": "Li, Feng; Li, Jingjing; Feng, Yan; Yang, Limin; Du, Zongfeng", "color": "red", "doi": "http://www.sciencedirect.com/science/article/pii/S0925400511002292", "id": "VPUZX2TI", "infos": "{\"Item Type\": \"journalArticle\", \"Publication Year\": 2018.0, \"Author\": \"Randviir, Edward P.\"}", "label": "VPUZX2TI", "shape": "dot", "size": 10, "title": "Electrochemical behavior of graphene doped carbon paste electrode and its application for sensitive determination of ascorbic acid", "year": 2018.0}, {"abstract": "The unique electronic structure of graphene leads to several distinctive optical properties. In this brief review, we outline the current understanding of two general aspects of optical response of graphene: optical absorption and light emission. We show that optical absorption in graphene is dominated by intraband transitions at low photon energies (in the far-infrared spectral range) and by interband transitions at higher energies (from mid-infrared to ultraviolet). We discuss how the intraband and interband transitions in graphene can be modified through electrostatic gating. We describe plasmonic resonances arising from the free-carrier (intraband) response and excitonic effects that are manifested in the interband absorption. Light emission, the reverse process of absorption, is weak in graphene due to the absence of a band gap. We show that photoluminescence from hot electrons can, however, become observable either through femtosecond laser excitation or strong electrostatic gating.", "author": "Mak, Kin Fai; Ju, Long; Wang, Feng; Heinz, Tony F.", "color": "red", "doi": "http://www.sciencedirect.com/science/article/pii/S0038109812002700", "id": "BP2LM4D8", "infos": "{\"Item Type\": \"journalArticle\", \"Publication Year\": 2018.0, \"Author\": \"Randviir, Edward P.\"}", "label": "BP2LM4D8", "shape": "dot", "size": 10, "title": "Optical spectroscopy of graphene: From the far infrared to the ultraviolet", "year": 2018.0}, {"abstract": "No abstract available", "author": "Forster, Robert J.", "color": "blue", "doi": "https://pubs.rsc.org/en/content/articlelanding/1994/cs/cs9942300289", "id": "FT3JSECK", "infos": "{\"Item Type\": \"journalArticle\", \"Publication Year\": 2000.0, \"Author\": \"Stulik, Karel; Amatore, Christian; Holub, Karel; Marecek, Vladimir; Kutner, Wlodzimierk\"}", "label": "FT3JSECK", "shape": "dot", "size": 10, "title": "Microelectrodes: new dimensions in electrochemistry", "year": 2000.0}, {"abstract": "The surface diffusion of a cobalt bis-terpyridine, Co(tpy)2-containing tripodal compound (1\u00b72PF6), designed to noncovalently adsorb to graphene through three pyrene moieties, has been studied by scanning electrochemical microscopy (SECM) on single-layer graphene (SLG). An initial boundary approach was designed in which picoliter droplets (radii \u223c15\u201350 \u03bcm) of the tripodal compound were deposited on an SLG electrode, yielding microspots in which a monolayer of the tripodal molecules is initially confined. The time evolution of the electrochemical activity of these spots was detected at the aqueous phosphate buffer/SLG interface by SECM, in both generation/collection (G/C) and feedback modes. The tripodal compound microspots exhibit differential reactivity with respect to the underlying graphene substrate in two different electrochemical processes. For example, during the oxygen reduction reaction, adsorbed 1\u00b72PF6 tripodal molecules generate more H2O2 than the bare graphene surface. This product was detected with spatial and temporal resolution using the SECM tip. The tripodal compound also mediates the oxidation of a Fe(II) species, generated at the SECM tip, under conditions in which SLG shows slow interfacial charge transfer. In each case, SECM images, obtained at increasing times, show a gradual decrease in the electrochemical response due to radial diffusion of the adsorbed molecules outward from the microspots onto the unfunctionalized areas of the SLG surface. This response was fit to a simple surface diffusion model, which yielded excellent agreement between the two experiments for the effective diffusion coefficients: Deff = 1.6 (\u00b10.9) \u00d7 10\u20139 cm2/s and Deff = 1.5 (\u00b10.6) \u00d7 10\u20139 cm2/s for G/C and feedback modes, respectively. Control experiments ruled out alternative explanations for the observed behavior, such as deactivation of the Co(II/III) species or of the SLG, and verified that the molecules do not diffuse when confined to obstructed areas. The noncovalent nature of the surface functionalization, together with the surface reactivity and mobility of these molecules, provides a means to couple the superior electronic properties of graphene to compounds with enhanced electrochemical performance, a key step toward developing dynamic electrode surfaces for sensing, electrocatalysis, and electronic applications.", "author": "Rodr\u00edguez-L\u00f3pez, Joaqu\u00edn; Ritzert, Nicole L.; Mann, Jason A.; Tan, Cen; Dichtel, William R.; Abru\u00f1a, H\u00e9ctor D.", "color": "blue", "doi": "https://doi.org/10.1021/ja2106724", "id": "78WQN6KY", "infos": "{\"Item Type\": \"journalArticle\", \"Publication Year\": 1987.0, \"Author\": \"Kawiak, Jan; Kulesza, Pawel J.; Galus, Zbigniew\"}", "label": "78WQN6KY", "shape": "dot", "size": 10, "title": "Quantification of the Surface Diffusion of Tripodal Binding Motifs on Graphene Using Scanning Electrochemical Microscopy", "year": 1987.0}, {"abstract": "We report on the electrical characterization and Raman spectroscopy of chemical vapor deposition copper-grown graphene transferred onto a Si/SiO2 substrate by high-speed (1 mm/s) electrochemical delamination. We determine graphene\u2019s sheet resistance, carrier mobility, and concentration as well as its physical quality as a function of the electolyte concentration. Graphene\u2019s electrical properties are investigated with standard Hall measurements in van der Pauw geometry and a contactless method that employs a single-post dielectric resonator operating at microwave frequencies. These properties are related to the widely used copper etching technique. The results prove that the high-speed electrochemical delamination provides good-quality graphene within a short time scale.", "author": "Ciuk, Tymoteusz; Pasternak, Iwona; Krajewska, Aleksandra; Sobieski, Jan; Caban, Piotr; Szmidt, Jan; Strupinski, Wlodek", "color": "blue", "doi": "https://doi.org/10.1021/jp4032139", "id": "EEE5VS8G", "infos": "{\"Item Type\": \"journalArticle\", \"Publication Year\": 1987.0, \"Author\": \"Kawiak, Jan; Kulesza, Pawel J.; Galus, Zbigniew\"}", "label": "EEE5VS8G", "shape": "dot", "size": 10, "title": "Properties of Chemical Vapor Deposition Graphene Transferred by High-Speed Electrochemical Delamination", "year": 1987.0}, {"abstract": NaN, "author": "Evans, John F.; Kuwana, Theodore.", "color": "red", "doi": "https://doi.org/10.1021/ac50019a042", "id": "R8IXG3ZC", "infos": "{\"Item Type\": \"journalArticle\", \"Publication Year\": 2016.0, \"Author\": \"Jadon, Nimisha; Jain, Rajeev; Sharma, Swati; Singh, Kshiti\"}", "label": "R8IXG3ZC", "shape": "dot", "size": 10, "title": "Radiofrequency oxygen plasma treatment of pyrolytic graphite electrode surfaces", "year": 2016.0}, {"abstract": NaN, "author": "Cheung, T. T. P.", "color": "red", "doi": "http://aip.scitation.org/doi/10.1063/1.330025", "id": "2GEGRFRL", "infos": "{\"Item Type\": \"journalArticle\", \"Publication Year\": 2018.0, \"Author\": \"Garc\u00eda-Miranda Ferrari, Alejandro; Foster, Christopher W.; Kelly, Peter J.; Brownson, Dale A. C.; Banks, Craig E.\"}", "label": "2GEGRFRL", "shape": "dot", "size": 10, "title": "X\u2010ray photoemission of carbon: Lineshape analysis and application to studies of coals", "year": 2018.0}, {"abstract": NaN, "author": NaN, "color": "blue", "doi": "https://demandeom.univ-orleans.fr/index.php?etape=4\u0026ajouterDeplacement", "id": "6FPFQRWR", "infos": "{\"Item Type\": \"journalArticle\", \"Publication Year\": 2011.0, \"Author\": \"Metters, Jonathan P.; Kadara, Rashid O.; Banks, Craig E.\"}", "label": "6FPFQRWR", "shape": "dot", "size": 10, "title": "DOM - Applicationde de d\u00e9mat\u00e9rialisation des demandes d\u0027ordre de mission", "year": 2011.0}, {"abstract": "Raman spectra, phenanthrenequinone adsorption, differential capacitance and scanning electron micrographs on fractured and polished glassy carbon (GC) surfaces were monitored before and after pulsed laser irradiation of varying power density. At power densities below 30 MW / cm2, the Raman spectra, \u0393PQ, Cdlo and SEM appearance of polished surfaces changed slightly with laser activation. However, the Raman spectra of fractured GC indicated increased disorder during laser irradiation. After vigorous laser treatment, the Raman spectrum became similar to that of the polished surface, but \u0393 and Cdlo on the fractured surface did not change greatly at power densities below 30 MW / cm2. At higher power densities, both polished and fractured surfaces showed significantly higher \u0393PQ and Cdlo, and the SEMs showed evidence of local melting. After 70 MW / cm2 laser treatment, the fractured and polished surfaces were quite similar. The results support a mechanism based on thermomechanical shock below about 30 MW / cm2 and local melting above this threshold.", "author": "Pontikos, Nicholas M.; McCreery, Richard L.", "color": "blue", "doi": "http://www.sciencedirect.com/science/article/pii/0022072892800489", "id": "RWZ7SDWN", "infos": "{\"Item Type\": \"journalArticle\", \"Publication Year\": 2012.0, \"Author\": \"Li, Meng; Li, Yuan-Ting; Li, Da-Wei; Long, Yi-Tao\"}", "label": "RWZ7SDWN", "shape": "dot", "size": 10, "title": "Microstructural and morphological changes induced in glassy carbon electrodes by laser irradiation", "year": 2012.0}, {"abstract": NaN, "author": "Tse, Daniel Chi-Sing.; Kuwana, Theodore.", "color": "blue", "doi": "https://doi.org/10.1021/ac50031a030", "id": "WE8V2UXM", "infos": "{\"Item Type\": \"journalArticle\", \"Publication Year\": 2008.0, \"Author\": \"Fanjul-Bolado, Pablo; Hern\u00e1ndez-Santos, David; Lamas-Ardisana, Pedro Jos\u00e9; Mart\u00edn-Pern\u00eda, Alberto; Costa-Garc\u00eda, Agust\u00edn\"}", "label": "WE8V2UXM", "shape": "dot", "size": 10, "title": "Electrocatalysis of dihydronicotinamide adenosine diphosphate with quinones and modified quinone electrodes", "year": 2008.0}, {"abstract": NaN, "author": "Fagan, Dan T.; Hu, Ing Feng.; Kuwana, Theodore.", "color": "blue", "doi": "https://doi.org/10.1021/ac00291a006", "id": "IFFR9IHS", "infos": "{\"Item Type\": \"journalArticle\", \"Publication Year\": 2014.0, \"Author\": \"Bouden, Sarra; Bellakhal, Nizar; Chauss\u00e9, Annie; Vautrin-Ul, Christine\"}", "label": "IFFR9IHS", "shape": "dot", "size": 10, "title": "Vacuum heat-treatment for activation of glassy carbon electrodes", "year": 2014.0}, {"abstract": "The zigzag edge of a graphene nanoribbon possesses a unique electronic state that is near the Fermi level and localized at the edge carbon atoms. The authors investigate the chemical reactivity of these zigzag edge sites by examining their reaction energetics with common radicals from first principles. A \u201cpartial radical\u201d concept for the edge carbon atoms is introduced to characterize their chemical reactivity, and the validity of this concept is verified by comparing the dissociation energies of edge-radical bonds with similar bonds in molecules. In addition, the uniqueness of the zigzag-edged graphene nanoribbon is further demonstrated by comparing it with other forms of sp2sp2\u003cmath display=\"inline\" overflow=\"scroll\" altimg=\"eq-00001.gif\"\u003e\u003cmrow\u003e\u003cmi\u003es\u003c/mi\u003e\u003cmsup\u003e\u003cmi\u003ep\u003c/mi\u003e\u003cmn\u003e2\u003c/mn\u003e\u003c/msup\u003e\u003c/mrow\u003e\u003c/math\u003e carbons, including a graphene sheet, nanotubes, and an armchair-edged graphene nanoribbon.", "author": "Jiang, De-en; Sumpter, Bobby G.; Dai, Sheng", "color": "blue", "doi": "http://aip.scitation.org/doi/10.1063/1.2715558", "id": "58NKNBUM", "infos": "{\"Item Type\": \"journalArticle\", \"Publication Year\": 2016.0, \"Author\": \"Qin, Qin; Bai, Xue; Hua, Zulin\"}", "label": "58NKNBUM", "shape": "dot", "size": 10, "title": "Unique chemical reactivity of a graphene nanoribbon\u2019s zigzag edge", "year": 2016.0}, {"abstract": "The microstructure and surface chemistry of eight polyacrylonitrile (PAN)-based carbon fibers heat treated at relatively low temperatures to retain lo\u2026", "author": NaN, "color": "red", "doi": "http://www.sciencedirect.com/science/article/pii/0008622394901589", "id": "WRK8BN4G", "infos": "{\"Item Type\": \"journalArticle\", \"Publication Year\": 1994.0, \"Author\": \"Chen, Ta K.; Strein, Timothy G.; Abe, Takayuki; Ewing, Andrew G.\"}", "label": "WRK8BN4G", "shape": "dot", "size": 10, "title": "Characterization of low thermal conductivity pan-based carbon fibers", "year": 1994.0}, {"abstract": "We present a high temperature heat treatment study of CVD-grown graphene nanoribbons annealed up to 2800\u00b0C, demonstrating a progressive annihilation of lattice defects as the heat treatment temperature is raised. Starting at 1500\u00b0C, single and multiple loop formation were observed on the ribbons edges as the temperature was increased. The structural changes of the samples are documented by X-ray diffraction, Raman spectroscopy, TGA, SEM, and HRTEM. This work indicates that nanoribbon annealing eventually leads to defect-free samples, through graphitization and edge loop formation. The annealed material exhibits structural differences that could be tailored for a variety of specific applications.", "author": "Campos-Delgado, J.; Kim, Y. A.; Hayashi, T.; Morelos-G\u00f3mez, A.; Hofmann, M.; Muramatsu, H.; Endo, M.; Terrones, H.; Shull, R. D.; Dresselhaus, M. S.; Terrones, M.", "color": "blue", "doi": "http://www.sciencedirect.com/science/article/pii/S0009261408017399", "id": "8FZRBV88", "infos": "{\"Item Type\": \"journalArticle\", \"Publication Year\": 2003.0, \"Author\": \"El-Nour, Kholoud Abou; Brajter-Toth, Anna\"}", "label": "8FZRBV88", "shape": "dot", "size": 10, "title": "Thermal stability studies of CVD-grown graphene nanoribbons: Defect annealing and loop formation", "year": 2003.0}, {"abstract": "The mechanical properties of graphene may be strongly affected by defects. In our work, the effects of the orientation and tilting angles of Stone\u2013Thrower\u2013Wales (STW, 5-7-7-5) defects on the mechanical properties of graphene have been investigated based on molecular dynamics simulations. When there is one centred STW defect including STW-1 defect and STW-2 defect, our study reveals that the orientation with respect to the chirality governs the mechanical properties of graphene. For STW-1 defective graphene, the strength of the armchair direction is much lower than that of zigzag direction. While the circumstance for STW-2 defective graphene is opposite, the strength of the armchair direction is much higher than the strength of the zigzag direction. Furthermore, when there is more than one STW defect, the mechanical properties of graphene depends on the tilting angle of STW defects. The breaking strength of graphene decreases with the increasing tilting angle. Our present work could provide significant insights into the effect of STW defects on the mechanical properties of graphene.", "author": "He, Linchun; Guo, Siusiu; Lei, Jincheng; Sha, Zhendong; Liu, Zishun", "color": "blue", "doi": "http://www.sciencedirect.com/science/article/pii/S0008622314003017", "id": "VLFN4WLW", "infos": "{\"Item Type\": \"journalArticle\", \"Publication Year\": 1997.0, \"Author\": \"Davis, Jason J.; Coles, Richard J.; Allen, H.; Hill, O.\"}", "label": "VLFN4WLW", "shape": "dot", "size": 10, "title": "The effect of Stone\u2013Thrower\u2013Wales defects on mechanical properties of graphene sheets \u2013 A molecular dynamics study", "year": 1997.0}, {"abstract": "The apparent heterogeneous rate constant, k\u00b0app, for three couples known to undergo outer-sphere electron transfer reactions has been investigated at carbon, gold, and platinum electrodes as a function of solution pH. The rates are found to be pH dependent at two different types of glassy carbon and at carbon paste but not at metallic electrodes. The rate is found to decrease with increasing pH for Fe(CN)3\u22124\u22126 and IrCl2\u22123\u22126, and the opposite effect is observed for the Ru(NH3)3+2+6 couple. For the three compounds examined, the magnitude of the pH dependent rate changes can be associated with a change in the magnitude of the potential of the reaction layer induced by a change in surface charge of \u223c 2 \u00d7 10\u22127 C cm\u22122. The pH dependence of the observed rate constant at glassy carbon can be attenuated by heat treatment, chemical reduction, or esterification of the surface. This behaviour is consistent with the theory that the pH dependence of k\u00b0app arises from the presence of functional groups on the carbon surface.", "author": "Deakin, Mark R.; Stutts, Kenneth J.; Wightman, R. Mark", "color": "blue", "doi": "http://www.sciencedirect.com/science/article/pii/0368187485854447", "id": "GQTF77MT", "infos": "{\"Item Type\": \"journalArticle\", \"Publication Year\": 2008.0, \"Author\": \"Cruz\u2005Moraes, Fernando; Cabral, Murilo F.; Machado, Sergio A. S.; Mascaro, Lucia H.\"}", "label": "GQTF77MT", "shape": "dot", "size": 10, "title": "The effect of pH on some outer-sphere electrode reactions at carbon electrodes", "year": 2008.0}, {"abstract": "Defect graphene was reported by adding sugar through solvothermal method. The characterization results of XRD, IR, Raman, and XPS showed that the samples have tunable mount of oxygenated group, which plays a role as adsorption site to detecting humidity gas molecule. The sample from sucrose has the highest mount of functional oxygenated groups and shows the best humidity property.", "author": "Huang, Qingwu; Zeng, Dawen; Tian, Shouqin; Xie, Changsheng", "color": "blue", "doi": "http://www.sciencedirect.com/science/article/pii/S0167577X12007525", "id": "NPBWGFQG", "infos": "{\"Item Type\": \"journalArticle\", \"Publication Year\": 2010.0, \"Author\": \"Henstridge, Martin C.; Dickinson, Edmund J. F.; Aslanoglu, Mehmet; Batchelor-McAuley, Christopher; Compton, Richard G.\"}", "label": "NPBWGFQG", "shape": "dot", "size": 10, "title": "Synthesis of defect graphene and its application for room temperature humidity sensing", "year": 2010.0}, {"abstract": "Highly reduced few-layer graphene oxide films with conductivities of up to 500 S cm\u22121 are obtained. The thin films with an optimized compromise between sheet resistance (3.1 k\u03a9 sq\u22121) and transparency (around 80% to 90%) are suitable for touch screens and transparent electrodes in OLEDs. We discuss the effects of low temperature annealing and chemical reduction on the properties of the films and present an optimized reduction process that allows the original 2D/G Raman intensity ratio of few-layer graphene to be recovered. The Raman spectrum of graphene oxide is found to be only related to oxygen-free graphene-like regions with Raman bands at 1130 and 3155 cm\u22121 that probably involve C\u2013H vibrations of rings and edges, while a band at 1700 cm\u22121 is assigned to irregular rings such as Stone Wales defects. All the bands involve resonant Raman processes and disappear in highly reduced samples. Clear correlations of the D band width with the sp2 content in thin films and resistivity have been observed, indicating that this is a good Raman parameter for evaluating the quality of the samples. The structural defects produced by the release of embedded water and some of the oxygen functional groups during annealing are detrimental for intra-grain conductivity but greatly enhance inter-grain connectivity.", "author": "D\u00edez-Betriu, Xavier; \u00c1lvarez-Garc\u00eda, Susana; Botas, Cristina; \u00c1lvarez, Patricia; S\u00e1nchez-Marcos, Jorge; Prieto, Carlos; Men\u00e9ndez, Rosa; Andr\u00e9s, Alicia de", "color": "red", "doi": "http://pubs.rsc.org/en/content/articlelanding/2013/tc/c3tc31124d", "id": "9GVTR8ZV", "infos": "{\"Item Type\": \"journalArticle\", \"Publication Year\": 1992.0, \"Author\": \"Huang, Wenhua; McCreery, Richard\"}", "label": "9GVTR8ZV", "shape": "dot", "size": 10, "title": "Raman spectroscopy for the study of reduction mechanisms and optimization of conductivity in graphene oxide thin films", "year": 1992.0}, {"abstract": "We investigate the quantum thermal transport properties of graphene nanoribbons (GNRs) with natural edges by combining the Naval Research Laboratory tight-binding approach and the phonon nonequilibrium Green\u2019s function method. Thermal transport of GNRs shows substantial dependence on the width due to edge reconstructions. For GNRs with n\u226512, where n is the number of atoms along the direction perpendicular to the ribbon axis, the effect of natural edges is negligible and quantized thermal transport is observed. For GNRs with 2\u003cn\u003c12, natural edges destroy quantized thermal transport and reduce thermal conductance significantly. For the narrowest GNR with n=2, perfect quantized thermal transport is restored and a zero-transmission phonon band gap appears at \u03c9=785\u223c808 cm\u22121. By sandwiching the narrowest GNR between two wide GNRs, the band gap is broadened by about ten times. The thermal conductivity of graphene evaluated from our results agrees very well with the recent experimental measurements.", "author": "Lan, Jinghua; Wang, Jian-Sheng; Gan, Chee Kwan; Chin, Sai Kong", "color": "blue", "doi": "https://link.aps.org/doi/10.1103/PhysRevB.79.115401", "id": "KCX6GS7T", "infos": "{\"Item Type\": \"journalArticle\", \"Publication Year\": 2006.0, \"Author\": \"Royea, William J.; Hamann, Thomas W.; Brunschwig, Bruce S.; Lewis, Nathan S.\"}", "label": "KCX6GS7T", "shape": "dot", "size": 10, "title": "Edge effects on quantum thermal transport in graphene nanoribbons: Tight-binding calculations", "year": 2006.0}, {"abstract": NaN, "author": "Cabaniss, George E.; Diamantis, A. A.; Murphy, W. Rorer; Linton, R. W.; Meyer, T. J.", "color": "blue", "doi": "https://doi.org/10.1021/ja00293a007", "id": "Z7BYI297", "infos": "{\"Item Type\": \"journalArticle\", \"Publication Year\": 1973.0, \"Author\": \"Taylor, R. J.; Humffray, A. A.\"}", "label": "Z7BYI297", "shape": "dot", "size": 10, "title": "Electrocatalysis of proton-coupled electron-transfer reactions at glassy carbon electrodes", "year": 1973.0}, {"abstract": "The tensile properties of graphene with the Stone-Wales (S\u2013W) defect are investigated by first principle calculations. It is found that the defect will not affect the elastic modulus and Poisson\u0027s ratio of graphene but causes the pre-stress of graphene, which makes the graphene to be anisotropic: the deformation along one direction is much easier than that along another direction. The pre-stress field causes only about 10% decrease of the intrinsic stress of graphene but causes more than 50% decrease of the maximum failure strain, which is significantly different with the results calculated by the empirical potential. The main reason is that the pre-stress field created by the S\u2013W defect predicted by first principle calculations is different than that calculated from molecular mechanics simulations. In addition, it is also found that the theoretical solution (on the basis of the continuum disclination dipoles model) of the pre-stress field created by the S\u2013W defect is also different with that determined from MM simulations, which is different from the results of the aligned 7-5 defects of graphene.", "author": "Ren, Yunpeng; Cao, Guoxin", "color": "blue", "doi": "http://www.sciencedirect.com/science/article/pii/S0008622316302068", "id": "UVNV9YQA", "infos": "{\"Item Type\": \"journalArticle\", \"Publication Year\": 2004.0, \"Author\": \"Lavagnini, Irma; Antiochia, Riccarda; Magno, Franco\"}", "label": "UVNV9YQA", "shape": "dot", "size": 10, "title": "Effect of geometrical defects on the tensile properties of graphene", "year": 2004.0}, {"abstract": "The edge reconstructions of zigzag graphene nanoribbons with one and two lines of alternating fused five and seven membered rings along one edge with hydrogen passivation are studied using first principles density functional theory. Reconstructions on one edge stabilize the systems in a metallic ground state with finite magnetic moment. The reconstructed edge suppresses the local spin density of atoms and contributes a finite density of states at the Fermi energy. Our study shows the possibilities of fabricating the metallic electrodes for semiconducting graphene devices with full control over their magnetic behavior without any lattice mismatch between leads and the channel.", "author": "Dutta, Sudipta; Pati, Swapan K.", "color": "blue", "doi": "http://www.sciencedirect.com/science/article/pii/S0008622310005622", "id": "64SHMCRF", "infos": "{\"Item Type\": \"journalArticle\", \"Publication Year\": 1999.0, \"Author\": \"DuVall, Stacy Hunt; McCreery, Richard L.\"}", "label": "64SHMCRF", "shape": "dot", "size": 10, "title": "Edge reconstructions induce magnetic and metallic behavior in zigzag graphene nanoribbons", "year": 1999.0}, {"abstract": "Numerical calculations have been performed to elucidate unconventional electronic transport properties in disordered nanographene ribbons with zigzag edges (zigzag ribbons). The energy band structure of zigzag ribbons has two valleys that are well separated in momentum space, related to the two Dirac points of the graphene spectrum. The partial flat bands due to edge states make the imbalance between left- and right-going modes in each valley, i.e. appearance of a single chiral mode. This feature gives rise to a perfectly conducting channel in the disordered system, i.e. the average of conductance \u3008g\u3009 converges exponentially to 1 conductance quantum per spin with increasing system length, provided impurity scattering does not connect the two valleys, as is the case for long-range impurity potentials. Ribbons with short-range impurity potentials, however, through inter-valley scattering, display ordinary localization behavior. Symmetry considerations lead to the classification of disordered zigzag ribbons into the unitary class for long-range impurities, and the orthogonal class for short-range impurities. The electronic states of graphene nanoribbons with general edge structures are also discussed, and it is demonstrated that chiral channels due to the edge states are realized even in more general edge structures except for armchair edges.", "author": "Wakabayashi, Katsunori; Takane, Yositake; Yamamoto, Masayuki; Sigrist, Manfred", "color": "blue", "doi": "http://www.sciencedirect.com/science/article/pii/S0008622308004971", "id": "EVAN9DC4", "infos": "{\"Item Type\": \"journalArticle\", \"Publication Year\": 2016.0, \"Author\": \"Labib, Mahmoud; Sargent, Edward H.; Kelley, Shana O.\"}", "label": "EVAN9DC4", "shape": "dot", "size": 10, "title": "Edge effect on electronic transport properties of graphene nanoribbons and presence of perfectly conducting channel", "year": 2016.0}, {"abstract": "In this paper, we carried out detailed electrochemical studies of epitaxial graphene (EG) using inner-sphere and outer-sphere redox mediators. The EG sample was anodized systematically to investigate the effect of edge plane defects on the heterogeneous charge transfer kinetics and capacitive noise. We found that anodized EG, consisting of oxygen-related defects, is a superior biosensing platform for the detection of nucleic acids, uric acids (UA), dopamine (DA), and ascorbic acids (AA). Mixtures of nucleic acids (A, T, C, G) or biomolecules (AA, UA, DA) can be resolved as individual peaks using differential pulse voltammetry. In fact, an anodized EG voltammetric sensor can realize the simultaneous detection of all four DNA bases in double stranded DNA (dsDNA) without a prehydrolysis step, and it can also differentiate single stranded DNA from dsDNA. Our results show that graphene with high edge plane defects, as opposed to pristine graphene, is the choice platform in high resolution electrochemical sensing.", "author": "Lim, Cheng Xiang; Hoh, Hui Ying; Ang, Priscilla Kailian; Loh, Kian Ping", "color": "blue", "doi": "https://doi.org/10.1021/ac101519v", "id": "QNRTYV8W", "infos": "{\"Item Type\": \"presentation\", \"Publication Year\": 2018.0, \"Author\": \"Mathieu-Scheers, Emilie; Bertagna, Val\u00e9rie; Cagnon, Beno\u00eet; Joigneaux, Emmanuelle; Vautrin-Ul, Christine\"}", "label": "QNRTYV8W", "shape": "dot", "size": 10, "title": "Direct Voltammetric Detection of DNA and pH Sensing on Epitaxial Graphene: An Insight into the Role of Oxygenated Defects", "year": 2018.0}, {"abstract": "Large-area graphene grown by chemical vapour deposition (CVD) is promising for applications; however, the interaction between graphene and the substrate is still not well understood. In this report, we use a combination of two non-destructive characterization techniques, i.e., electron backscatter diffraction (EBSD) and Raman mapping to locally probe the interface between graphene and copper lattices without removing graphene. We conclude that the crystal structure of the Cu grains under graphene layers is governed by two competing processes: (1) graphene induced Cu surface reconstruction favoring the formation of Cu(100) orientation, and (2) recrystallization from bulk Cu favoring Cu(111) formation. The underlying Cu grains, regardless of reconstruction or recrystallization, induce a large hydrostatic compression to the graphene lattice. Interestingly, the strong interaction could be decoupled by allowing the intercalation of a thin cuprous oxide interfacial-layer. The Cu2O layer is mechanically and chemically weak; hence, graphene films can be detached and transferred to arbitrary substrates and the Cu substrates could be re-used for graphene growth.", "author": "Lu, Ang-Yu; Wei, Sung-Yen; Wu, Chih-Yu; Hernandez, Yenny; Chen, Tzu-Yin; Liu, Te-Huan; Pao, Chun-Wei; Chen, Fu-Rong; Li, Lain-Jong; Juang, Zhen-Yu", "color": "blue", "doi": "http://pubs.rsc.org/en/content/articlelanding/2012/ra/c2ra01281b", "id": "488W3WG7", "infos": "{\"Item Type\": \"journalArticle\", \"Publication Year\": 2019.0, \"Author\": \"Mathieu-Scheers, Emilie; Bouden, Sarra; Grillot, C\u00e9line; Nicolle, Jimmy; Warmont, Fabienne; Bertagna, Val\u00e9rie; Cagnon, Beno\u00eet; Vautrin-Ul, Christine\"}", "label": "488W3WG7", "shape": "dot", "size": 10, "title": "Decoupling of CVD graphene by controlled oxidation of recrystallized Cu", "year": 2019.0}, {"abstract": "Highly conductive chemically-derived graphene can be synthesized using an efficient two-step method starting from graphene oxide. The key strategy involves the use of a CVD process to heal defects contained within the monolayers, which imparts a two order of magnitude enhancement of electrical conductivity over the merely reduced samples.", "author": "L\u00f3pez, Vicente; Sundaram, Ravi S.; G\u00f3mez\u2010Navarro, Cristina; Olea, David; Burghard, Marko; G\u00f3mez\u2010Herrero, Julio; Zamora, F\u00e9lix; Kern, Klaus", "color": "blue", "doi": "http://onlinelibrary.wiley.com/doi/abs/10.1002/adma.200901582", "id": "SEDC5H8R", "infos": "{\"Item Type\": \"journalArticle\", \"Publication Year\": 2019.0, \"Author\": \"Mathieu-Scheers, Emilie; Bouden, Sarra; Grillot, C\u00e9line; Nicolle, Jimmy; Warmont, Fabienne; Bertagna, Val\u00e9rie; Cagnon, Beno\u00eet; Vautrin-Ul, Christine\"}", "label": "SEDC5H8R", "shape": "dot", "size": 10, "title": "Chemical Vapor Deposition Repair of Graphene Oxide: A Route to Highly-Conductive Graphene Monolayers", "year": 2019.0}]);

    <script type="text/javascript">
        function onNodeClick(params) {
            const className = 'generated-div';
            const nodeId = params.nodes[0];
            
            // Retrieve the title from the node attributes
            const node = network.body.data.nodes.get(nodeId);

            // Check for existing aside element by ID
            const existingIdenticalElement = document.getElementById(nodeId);
            
            // If the existing aside is found, remove it
            if (existingIdenticalElement) {
                existingIdenticalElement.remove();
            } else {
                const existingElements = document.getElementsByClassName(className);
                // Remove the first existing element if it exists
                if (existingElements.length > 0) {
                    existingElements[0].remove();
                }

                // Create a new aside element
                const aside = document.createElement("aside");

                // Add content to the aside, including the title
                const titre = document.createElement("h1");
                titre.textContent = `Titre de la publication : ${node.title}`;
                aside.appendChild(titre);
                
                const year = document.createElement("p");
                year.textContent = `Année de publication : ${node.year}`;
                aside.appendChild(year);
                
                const author = document.createElement("p");
                year.textContent = `Auteurs : ${node.author}`;
                aside.appendChild(author);
                
                const abstract = document.createElement("p");
                abstract.textContent = `Abstract : ${node.abstract}`;
                aside.appendChild(abstract);
                
                const doi = document.createElement("a");
                doi.textContent = `DOI : ${node.doi}`;
                doi.href = node.doi;  // Set the URL for the link
                doi.target = "_blank";  // Open the link in a new tab
                doi.rel = "noopener noreferrer";  // Security measure to prevent exploitation
                aside.appendChild(doi);
     
                aside.classList.add(className); // Add class for styling
                aside.id = nodeId; // Assign unique ID

                // Append the aside to the DOM
                document.body.appendChild(aside);
                console.log(`Un nouvel aside a été créé pour ${nodeId} avec le titre "${title} publié en "${year}".`);
            }

            if (params.nodes.length > 0) {
                console.log("Clicked node:", nodeId);
                // Here you can add more functionality, like fetching data
            }
        }
        network.on("click", onNodeClick);
    </script>
